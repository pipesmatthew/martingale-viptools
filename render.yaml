# martingale.viptools.gg
#
# A STATIC SITE, NOT A SERVICE. Everything this page does happens in the
# visitor's browser: the keno draw, the limbo roll, the ladder arithmetic, the
# practice balance and the run history. There is no database to keep, no
# session to expire, and nothing to authenticate — so there is nothing here
# worth paying for a web service to hold.
#
# ITS OWN REPOSITORY, AND ITS OWN SERVICE. The predictions app is deployed
# from `pipesmatthew/viptools`, which is private because it carries the hunt
# archive every recommendation is fitted to. This is public marketing content
# with no secrets in it, and keeping the two apart means a bad deploy here
# cannot reach the board.

services:
  - type: web
    name: martingale
    runtime: static
    # Nothing to build. The page is one file with no dependencies, which is
    # deliberate: a build step is a thing that can break between you writing
    # the page and somebody reading it.
    buildCommand: ""
    staticPublishPath: ./public

    # NO CATCH-ALL REWRITE, and that is deliberate.
    #
    # This used to rewrite /* to /index.html so a mistyped or shared-with-a-path
    # link landed on the page rather than a 404. The cost was that EVERY path
    # answered 200 with HTML - including /.env, /wp-admin/ and /config.json,
    # which are the paths automated scanners probe hardest. A host that never
    # 404s is the signature of a catch-all redirector or a compromised box, and
    # a user reported viptools.gg blocked as "Suspicious" by a mobile security
    # product while this was in place.
    #
    # Nothing here needs it. Routing is hash-based (location.hash), and a
    # fragment never reaches the server, so deep links were never being served
    # by this rule in the first place - it only ever caught typos.

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # The page is self-contained apart from Google Fonts, so it can afford to
      # say so. If a future version pulls in anything else, this is the line
      # that will stop it — which is the point of writing it down now.
      #
      # `connect-src 'self'` was added 2026-08-26 for the Keno Clicker score.
      # Web Audio cannot schedule a sound it has not decoded, and
      # `decodeAudioData` needs an ArrayBuffer, which means `fetch` — and a
      # fetch with no `connect-src` falls back to `default-src 'none'` and is
      # refused before anything is heard. It is deliberately `connect-src` and
      # not `media-src`: an `<audio>` element would be permitted by the latter
      # and is not accurate enough to land a cue on a given frame, so allowing
      # it would only invite the wrong approach back in.
      #
      # 'self' and nothing else. The audio ships from this origin.
      # `media-src 'self'` was added 2026-08-26, and the note above is why it
      # was missing. Choosing connect-src over media-src was deliberate - an
      # <audio> element is not accurate enough to land a cue on a given frame,
      # so refusing it steered the code to fetch + decodeAudioData.
      #
      # The boss VOICE lines do exactly that and always worked. The boss MUSIC
      # is a `new Audio()` element, which is governed by media-src - absent, so
      # it fell back to default-src 'none' and was blocked outright. In
      # production there was simply no music, and locally there is no CSP at
      # all, so nothing short of loading the deployed page could show it.
      #
      # 'self' only: the audio ships from this origin. The frame-accuracy
      # argument still stands and the music should move to decodeAudioData like
      # the voices did - but a silent boss fight is not the way to enforce it.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'"
