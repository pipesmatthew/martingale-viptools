<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIP Tools</title>
<meta name="color-scheme" content="dark">
<meta name="description" content="This page is retired.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23131316'/%3E%3Crect x='7' y='5' width='4' height='22' fill='%23ffb454'/%3E%3Crect x='21' y='5' width='4' height='22' fill='%23ffb454'/%3E%3Crect x='7' y='9' width='18' height='3' fill='%23ffb454'/%3E%3Crect x='7' y='15' width='18' height='3' fill='%23ffb454'/%3E%3Crect x='7' y='21' width='18' height='3' fill='%23ffb454'/%3E%3C/svg%3E">
<style>
/* THIS FILE EXISTS BECAUSE DELETING THE PAGE DID NOT UNPUBLISH IT.
   The game was still PLAYABLE after its files were deleted: /keno-clicker/index.html
   answered cf=MISS and 200 from the origin.
   Render's static publish here is ADDITIVE: a deploy overwrites changed files
   and adds new ones, and never removes what a commit deleted. Measured on all
   four of these sites, not assumed - the deleted entry point came back
   `cf-cache-status: MISS` and 200 from the origin with `last-modified` from the
   previous deploy, so Cloudflare was not the explanation.

   So this path is retired by OVERWRITING it, which works, rather than by
   deleting it, which does not. Nothing here loads any of the payload that is
   still sitting beside it. Purging the orphans for real needs `Clear build
   cache & deploy` on the service; after that, confirm a deleted path 404s
   before trusting deletion on these services again. */
:root{
  color-scheme: dark;
  --bg:#131316; --button:#242429; --fg:#f0f0f2;
  --accent:#ffb454; --amber-line:#4a3a20; --muted:#a0a0a8;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:grid;justify-items:center;align-content:start;
  padding:clamp(110px,28vh,300px) 16px 48px}
.home{width:100%;max-width:800px}
.mark{display:flex;align-items:center;justify-content:center;gap:18px;
  margin:0 0 30px}
.mark i{flex:1 1 0;max-width:150px;height:2px;background:var(--amber-line)}
.mark span{font-size:26px;font-weight:700;text-transform:uppercase;
  letter-spacing:.2em;text-indent:.2em;white-space:nowrap}
.retired{background:var(--button);border:1px solid var(--amber-line);
  border-radius:10px;padding:26px 28px;text-align:center}
.retired p{margin:0;font-size:15px;line-height:1.7;color:var(--fg)}
.retired p+p{margin-top:12px;font-size:13px;color:var(--muted)}
.retired b{color:var(--accent);font-weight:600}

@media (max-width:560px){
  .mark{gap:12px;margin-bottom:24px}
  .mark i{max-width:44px}
  .mark span{font-size:19px;letter-spacing:.16em;text-indent:.16em}
  .retired{padding:22px 18px}
  .retired p{font-size:14px}
}
</style>
</head>
<body>

<main class="home">
  <h1 class="mark"><i aria-hidden="true"></i><span>VIP Tools</span><i aria-hidden="true"></i></h1>

  <div class="retired">
    <p>The VIP Tools are <b>retired</b>.</p>
    <p>The Keno Clicker that was served at this address has been taken offline.</p>
  </div>
</main>

</body>
</html>
