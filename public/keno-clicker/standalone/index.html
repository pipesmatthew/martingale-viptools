<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WALKER</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════ THE STANDALONE SHELL ══════════════════
   This page is only the room the fight happens in: an arena layer stack, a
   front door, and the two screens either side of a run. Everything below the
   canvas belongs to boss.js and is lifted verbatim from the preview page so
   the two cannot drift - z-indices especially, because the fight's own notes
   argue about them (he is 920, the effects canvas is 930, and several effects
   depend on that ordering).                                                  */
:root{
  --mono: ui-monospace, "SF Mono", Consolas, "Liberation Mono", monospace;
  --ink:#e8eef5; --dim:#8fa2b4; --faint:#5d6b7a;
  --bg:#07070b; --panel:#0e1017; --line:#1d2430;
  --gold:#ffd36b; --good:#7dffb0; --bad:#ff6b4b; --walker:#7c3aed;
  /* Trebuchet is web-safe on Windows and macOS, has character in its
     lowercase g and numerals, and belongs to nobody's default stack -
     lifted from the keno build's own note on this panel. */
  --face:"Trebuchet MS","Lucida Grande",Verdana,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--mono);overflow:hidden;
  -webkit-font-smoothing:antialiased}

/* ── the arena layers, verbatim from the preview page ───────────────────── */
#bossVeil{position:fixed;inset:0;z-index:850;pointer-events:none;opacity:0;
  background:radial-gradient(120% 90% at 50% 30%,rgba(8,8,10,.55),rgba(4,4,6,.93));
  transition:opacity 700ms ease}
body.boss #bossVeil{opacity:1}
#bossSky{position:fixed;inset:0;z-index:855;width:100%;height:100%;display:block;
  pointer-events:none}
#bossStage{position:fixed;inset:0;z-index:915;pointer-events:none;overflow:hidden}
#bossFx{position:fixed;inset:0;z-index:930;width:100%;height:100%;display:block;
  pointer-events:none}
#bossVeil,#bossSky,#bossStage,#bossFx,#walker,#bossSubs{display:none}
/* THE SKY IS THE ONE ARENA LAYER THE TITLE CARD KEEPS. Everything else in the
   stack is the fight; the starfield is just where the fight happens, so the
   door sits in it rather than in front of a flat black rectangle. */
/* THE TITLE CARD PAINTS ITS OWN SKY. boss.js is an IIFE - makeStars,
   makeNebula and drawStars are private to it and window.Boss does not export
   them - so the door cannot borrow the arena's starfield, it has to have one.
   #bossSky stays hidden until the fight owns it. */
#space{position:fixed;inset:0;z-index:900;display:block;pointer-events:none}
body.boss #space{display:none}
body.boss #bossVeil,body.boss #bossSky,body.boss #bossStage,body.boss #bossFx,
body.boss #walker,body.boss #bossSubs{display:block}
#walker{position:fixed;left:0;top:0;z-index:920;
  transform-origin:50% 50%;pointer-events:none;will-change:transform}
#walker canvas{position:absolute;inset:0;width:100%;height:100%}
#bang{position:absolute;left:50%;bottom:100%;margin-bottom:2px;
  transform:translateX(-50%);z-index:7;pointer-events:none;opacity:0;
  font-weight:900;font-size:44px;line-height:1;letter-spacing:2px;color:#fff3d0;
  text-shadow:0 0 12px rgba(255,120,40,.9),0 0 30px rgba(255,60,0,.6),0 2px 0 #7a1500}
#bang.on{animation:bang 620ms cubic-bezier(.2,1.6,.35,1) forwards}
#bang.off{opacity:0;transition:opacity 260ms ease-out}
@keyframes bang{
  0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.35) rotate(-9deg)}
  55%{opacity:1;transform:translateX(-50%) translateY(-6px) scale(1.18) rotate(3deg)}
  100%{opacity:1;transform:translateX(-50%) translateY(-2px) scale(1) rotate(0)}
}
#bossSubs{position:fixed;left:50%;margin-left:150px;bottom:22%;width:320px;
  z-index:940;pointer-events:none;opacity:0;transition:opacity 220ms ease}
#bossSubs.on{opacity:1}
#bossSubs .who{font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:#9fd9ff;margin-bottom:3px}
#bossSubs .who.walker{color:#9fd9ff}
#bossSubs .who.you{color:#8ee6a8}
#bossSubs .who.demon{color:#ff6b4b}
#bossSubs .line{font-size:16px;line-height:1.45;color:#eee}

/* THE QUIETEST THING ON THE PAGE, ON PURPOSE. It is a housekeeping note, not
   an instruction the fight depends on - the rules sheet carries it properly
   with a drawn keycap. Sized and coloured to be findable when looked for and
   invisible when not: --faint on near-black is about 2.4:1, under the contrast
   floor for text that matters and correct for text that does not. */
/* PINNED TO THE FLOOR, not stacked under the volume. In the column it sat
   inside the group it has nothing to do with - the medallion, the three
   buttons and the slider are one block of things you act on, and this is a
   footnote about the browser. #door is position:fixed, so absolute here
   anchors to the viewport and it stays put whatever the column does. */
.f11{position:absolute;left:0;right:0;bottom:30px;text-align:center;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:#93a3b4;opacity:.80;transition:opacity 300ms ease}
.f11.gone{opacity:0;pointer-events:none}
.f11 kbd{font-family:var(--mono);font-size:10px;letter-spacing:.06em;
  padding:2px 5px;margin:0 2px;border:1px solid #2a3444;border-bottom-width:2px;
  border-radius:2px;background:#141824;color:#93a3b4}

.volrow{display:flex;align-items:center;gap:12px;margin-top:2px}
.vlab{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.vread{font-size:11px;color:var(--faint);min-width:34px;text-align:right}
#vol{-webkit-appearance:none;appearance:none;width:170px;height:3px;
  background:#2a3444;border-radius:2px;outline:none;cursor:pointer}
#vol::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:13px;height:13px;border-radius:50%;background:#9d6bff;
  border:0;cursor:pointer}
#vol::-moz-range-thumb{width:13px;height:13px;border-radius:50%;
  background:#9d6bff;border:0;cursor:pointer}

/* ── the death drain ────────────────────────────────────── */
/* THE ARENA GOES GREY, NOT THE PAGE. Two reasons it is applied to the six
   arena layers by name rather than to <body>:

     1. body{filter:} would take the buttons and the history sheet with it,
        which is exactly what was asked against.
     2. A filter on an ancestor creates a containing block for fixed
        positioning - every layer in here is position:fixed, so filtering the
        body would silently re-anchor all of them.

   #after and #stats are SIBLINGS of the arena layers, so they keep their
   colour for free and the sheet opens in full colour over a grey room.

   ON DEATH ONLY. A win keeps its colour: WALKER DOWN is green and the run code
   under it is the thing the player came for. */
body.dead #bossVeil, body.dead #bossSky, body.dead #bossStage,
body.dead #walker,   body.dead #bossFx,  body.dead #bossSubs{ filter:grayscale(1) }
/* the ramp lives on the elements, not on .dead - a transition declared only in
   the matched rule vanishes the moment the class does, and it would snap back
   to colour instead of easing. The two layers that already animate keep what
   they had. */
#bossVeil{transition:opacity 700ms ease, filter 700ms ease}
#bossSubs{transition:opacity 220ms ease, filter 700ms ease}
#bossSky,#bossStage,#walker,#bossFx{transition:filter 700ms ease}

/* ── shared button language ─────────────────────────────────────────────── */
.btn{font-family:var(--mono);font-weight:700;letter-spacing:.10em;
  text-transform:uppercase;cursor:pointer;border-radius:2px;
  border:1px solid var(--line);background:#141824;color:var(--ink);
  padding:13px 26px;font-size:13px;
  transition:background 140ms ease,border-color 140ms ease,transform 90ms ease}
.btn:hover{background:#1c2231;border-color:#33405a}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* OUTLINED, NOT FILLED. A solid amber slab was the loudest thing on a screen
   whose subject is a violet medallion - it read as a warning rather than as the
   way in. Purple is his, and an outline lets the sky through. */
.btn.primary{background:rgba(124,58,237,.10);border-color:#7c3aed;color:#c9b0ff}
.btn.primary:hover{background:rgba(124,58,237,.22);border-color:#9d6bff;color:#ddccff}
.btn.big{padding:17px 42px;font-size:16px;letter-spacing:.14em}
.btn.small{padding:7px 13px;font-size:11px;letter-spacing:.06em}

/* ── the front door ─────────────────────────────────────────────────────── */
#door{position:fixed;inset:0;z-index:1000;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:22px;
  /* NO BACKGROUND AT ALL. The vignette that keeps the buttons readable is
     painted into the star canvas instead, where it can sit UNDER the stars
     nearest the middle rather than flattening the whole field. */
  background:none}
body.boss #door{display:none}
/* HIM, AS HE IS AT THE END. Backed at 2x and laid out by CSS, so the ring's
   knotwork survives a high-dpi screen - it is fine detail and it is the first
   thing anybody sees. */
#hero{width:min(46vh,420px);height:min(46vh,420px);display:block;margin:0 auto}

/* ── after a run ────────────────────────────────────────────────────────── */
/* THE CANVAS ALREADY DRAWS THE VERDICT. WALKER DOWN / YOU DIED and the run
   code are painted by boss.js onto #bossFx; this bar is only the things you
   can click, so it sits low and stays out of the way of them. */
#after{position:fixed;left:0;right:0;bottom:8vh;z-index:960;
  display:none;flex-direction:column;align-items:center;gap:16px;pointer-events:none}
#after.on{display:flex}
#after .btn,#after .codebar{pointer-events:auto}
#after .row{display:flex;gap:14px}
.verdict{font-family:"Archivo Black","Arial Black",Impact,sans-serif;
  font-size:clamp(30px,5vw,50px);line-height:1;letter-spacing:.01em;
  text-shadow:0 3px 20px rgba(0,0,0,.92)}
.verdict.win{color:var(--good)}
.verdict.loss{color:var(--bad)}
/* the code is TEXT, not paint. user-select:all means one click takes the whole
   thing, which is what somebody does before they even find the button. */
.codebar{display:none;align-items:center;gap:10px;background:#0b0f14;
  border:1px solid #2a3444;border-radius:2px;padding:8px 8px 8px 14px}
.codebar.on{display:flex}
.codetext{font-size:13px;letter-spacing:.04em;color:var(--good);user-select:all}

/* ── the rules sheet ──────────────────────────────────── */
/* THE PICTURES ARE THE POINT, so the copy is set in the same face the keno
   build uses for this panel rather than the shell's monospace - running prose
   in a mono face reads as a terminal, and this is the one screen that is
   asking to be read rather than scanned. */
#rules{position:fixed;inset:0;z-index:1200;display:none;
  background:rgba(4,5,8,.90);backdrop-filter:blur(3px);
  padding:5vh 4vw;overflow:auto}
#rules.on{display:block}
#rules .sheet{max-width:770px;margin:0 auto;background:var(--panel);
  border:1px solid var(--line);border-radius:3px;padding:26px 26px 20px}
#rules h2{margin:0 0 18px;font-family:"Cinzel",Georgia,serif;font-weight:500;
  font-size:24px;letter-spacing:.20em;color:#f7f4ee}
#rules .foot{display:flex;justify-content:flex-end;margin-top:22px}
.rulegrid{display:grid;grid-template-columns:auto minmax(0,1fr);
  gap:14px 16px;align-items:center}
.rulegrid canvas{display:block}
.rulegrid span{font:13px/1.55 var(--face);color:#c8c8d0}
.rulegrid b{color:#eef1f5}
/* THE ONE ACTIONABLE LINE ON THE SHEET, so it gets the only border on it. His
   purple rather than an alert colour - it is an invitation, not a warning. */
.callout{margin-top:22px;padding:12px 15px;border:1px solid rgba(124,58,237,.55);
  border-radius:2px;background:rgba(124,58,237,.09);
  font:13px/1.5 var(--face);color:#d6cdf0}
.callout b{color:#efe9ff;font-weight:700}
/* INLINE SVG, NOT AN IMAGE FILE. Both sites run a 'self' CSP, so a remote logo
   would be blocked outright and a local copy is another asset to carry into
   viptools-home. The mark is ~1.4KB of path and costs no request at all.

   The icon keeps Discord's blurple, lifted a little for a dark background - it
   is what makes the line recognisable at a glance - while the handle takes the
   sheet's own bright violet. Baseline-aligned rather than middle, so the mark
   sits on the text's baseline instead of floating above it. */
.dc{display:inline-flex;align-items:baseline;gap:6px;white-space:nowrap}
.dcico{width:1.05em;height:1.05em;color:#7d87f5;flex:0 0 auto;
  align-self:center;position:relative;top:.08em}

/* ── the history sheet ──────────────────────────────────────────────────── */
#stats{position:fixed;inset:0;z-index:1200;display:none;
  background:rgba(4,5,8,.90);backdrop-filter:blur(3px);
  padding:5vh 4vw;overflow:auto}
#stats.on{display:block}
/* ══════ THE SHEET IS SET IN THE HEADING'S FACE ══════
   Cinzel throughout instead of the shell's monospace. It is an inscriptional
   face, so its lowercase renders as small caps and its figures are lining and
   even-width - which is why it survives being used for a table at all, and why
   "Cleared" and "Break 1" read as engraved rather than shouted.

   THE RUN CODE IS THE ONE EXCEPTION and stays monospace. It is a string
   somebody has to read character by character and retype; a serif that renders
   1/l and 0/O anywhere near each other is the wrong tool for that job. */
#stats .sheet{max-width:910px;margin:0 auto;background:var(--panel);
  border:1px solid var(--line);border-radius:3px;padding:26px 26px 20px;
  font-family:"Cinzel",Georgia,serif}
#stats h2{margin:0 0 20px;font-family:"Cinzel",Georgia,serif;font-weight:500;
  font-size:24px;letter-spacing:.20em;color:#f7f4ee}
/* ══════ SIX TILES THAT READ AS ONE ROW ══════
   They were left-aligned with three different accent colours in them - green
   kills, gold best time, white everything else - which made a row of six
   identical boxes look like six unrelated widgets. Centred and set in one
   colour, the row scans as a single object and the eye compares the NUMBERS
   rather than hunting the highlights.

   nowrap on the value, because "464m 53s" was breaking onto a second line and
   pushing that tile taller than its neighbours. fmtT hands back hours past the
   hour mark now, so the string stays short enough that it never has to. */
.totals{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  gap:10px;margin-bottom:24px}
.tot{background:#0a0c12;border:1px solid var(--line);border-radius:2px;
  padding:13px 8px;text-align:center}
.tot .k{color:#e8eef5;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot .v{color:#ffffff;font-size:22px;font-weight:700;margin-top:6px;
  font-family:var(--face);letter-spacing:0;white-space:nowrap;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
@media (max-width:700px){ .totals{grid-template-columns:repeat(3,minmax(0,1fr))} }

table{width:100%;border-collapse:collapse;font-size:12px}
/* THE HEADINGS ARE READ, NOT DECORATED. They were 10px of --faint at .14em
   tracking - three separate things all pushing the same way, and wide tracking
   on small dim caps is the combination that turns a label into texture. Bigger,
   brighter, and tracked less; the row data stays quieter than the heading that
   names it, which is the order that was wanted anyway. */
th{text-align:left;color:#c2cfdb;font-weight:600;font-size:12px;
  letter-spacing:.10em;text-transform:uppercase;padding:0 12px 11px 0;
  border-bottom:1px solid #2a3444;white-space:nowrap}
/* ══════ HEADINGS IN CINZEL, DATA IS NOT ══════
   Cinzel is inscriptional: its 1 is drawn as a Roman I and its lowercase comes
   out as small caps, so "11.1s" renders as II.IS and "Break 1" as BREAK I. That
   is exactly right for a title and unusable for a number somebody is comparing.

   So the split is the ordinary typographic one - display face for the labels,
   text face for the values. --face is Trebuchet, already loaded for the rules
   sheet, and picked there for having real character in its numerals.

   tabular-nums so the columns line up under each other; Trebuchet's figures are
   proportional by default and a column of times would otherwise wander. */
td{padding:10px 12px 10px 0;border-bottom:1px solid #131926;vertical-align:middle;
  white-space:nowrap;font-family:var(--face);font-size:14px;letter-spacing:0;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
tr:last-child td{border-bottom:0}
tr.win td{background:rgba(125,255,176,.045)}
/* NO BOX. A tinted pill behind eleven DIEDs in a column turns the table into a
   stack of buttons - the eye reads the rectangles before the words, and there
   is nothing to click. The word alone, in its own colour and tracked out, says
   the same thing and lets the row breathe. */
/* the one thing in the row that stays in the display face - DIED and KILL have
   no digits in them, so nothing can be misread */
.tag{font-family:"Cinzel",Georgia,serif;font-size:12px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase}
.tag.win{color:var(--good)}
.tag.loss{color:#b8574a}
.num{color:#8fa2b4}
/* DAMAGE TAKEN IS THE NUMBER PEOPLE COMPARE, so it is the brightest thing in
   the row. Dealt sits behind it: on a clear it is always the whole pool, so it
   carries information only on a death. */
.took{color:#ffffff}
.dealt{color:#8fa2b4}
.code{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.02em}
#tbl .btn{font-family:var(--mono)}
.empty{color:var(--faint);text-align:center;padding:34px 0;font-size:12px;letter-spacing:.06em}
#stats .foot{display:flex;justify-content:space-between;align-items:center;
  margin-top:20px;gap:12px;flex-wrap:wrap}
.danger{color:#6b4a44;font-size:10px;letter-spacing:.06em;cursor:pointer;
  background:none;border:0;font-family:var(--mono)}
.danger:hover{color:var(--bad)}

/* the transient "copied" flash, so a click has a visible result */
.btn.copied{background:#123021;border-color:#2e6b47;color:var(--good)}
</style>
</head>
<body>

<!-- the arena layer stack, in the order boss.js expects -->
<canvas id="space"></canvas>
<div id="bossVeil"></div>
<canvas id="bossSky"></canvas>
<div id="bossStage"></div>
<div id="walker">
  <canvas id="wRing" width="600" height="600"></canvas>
  <canvas id="wHead" width="600" height="600"></canvas>
  <div id="bang">!!</div>
</div>
<canvas id="bossFx"></canvas>
<div id="bossSubs"><div class="who" id="bossWho"></div><div class="line" id="bossLine"></div></div>

<div id="door">
  <canvas id="hero" width="1120" height="1120"></canvas>
  <div style="display:flex;gap:12px">
    <button class="btn primary big" id="bPlay">Fight</button>
    <button class="btn big" id="bRules">Rules</button>
    <button class="btn big" id="bStats0">Stats</button>
  </div>
  <div class="volrow">
    <span class="vlab">Volume</span>
    <input type="range" id="vol" min="0" max="100" step="1" value="100" aria-label="Volume">
    <span class="vread" id="volRead">100%</span>
  </div>
  <div class="f11" id="f11">Press <kbd>F11</kbd> for fullscreen</div>
</div>

<div id="after">
  <div class="verdict" id="verdict"></div>
  <div class="codebar" id="codebar">
    <span class="codetext" id="codetext"></span>
    <button class="btn small" id="bCopyWin">Copy</button>
  </div>
  <div class="row">
    <button class="btn primary" id="bAgain">Go again</button>
    <button class="btn" id="bStats">User stats</button>
  </div>
</div>

<div id="rules">
  <div class="sheet">
    <h2>HOW IT WORKS</h2>
    <div class="rulegrid" id="ruleGrid"></div>
    <div class="callout">DM <span class="dc"><svg class="dcico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20.317 4.3698a19.7913 19.7913 0 0 0-4.8851-1.5152.0741.0741 0 0 0-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 0 0-.0785-.037 19.7363 19.7363 0 0 0-4.8852 1.515.0699.0699 0 0 0-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 0 0 .0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 0 0 .0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 0 0-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 0 1-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 0 1 .0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 0 1 .0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 0 1-.0066.1276 12.2986 12.2986 0 0 1-1.873.8914.0766.0766 0 0 0-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 0 0 .0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 0 0 .0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 0 0-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.4190 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.41891.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg><b>bigmatthew1</b></span> on Discord with your code if you win!</div>
    <div class="foot"><button class="btn" id="bRulesClose">Close</button></div>
  </div>
</div>

<div id="stats">
  <div class="sheet">
    <h2>YOUR RUNS</h2>
    <div class="totals" id="totals"></div>
    <div style="overflow-x:auto"><table id="tbl"></table></div>
    <div class="foot">
      <button class="btn" id="bClose">Close</button>
      <button class="danger" id="bWipe">Erase my history</button>
    </div>
  </div>
</div>

<script>
/* ══════════════ THE STANDALONE PINS THE DIFFICULTY ══════════════
   boss.js takes its damage from the idle game underneath it. padPower() reads
   derived().betCents and autoSps(); breakSeconds() reads S.upgrades.betSize.
   With no game present all three fall back to their zero values - a one-cent
   bet - and padPower came out 9.85 against the 79 the fight is tuned for.
   Every damage number on screen was an eighth of what it should have been.

   THE FIGHT'S LENGTH WAS NEVER WRONG, which is exactly why this was easy to
   miss. His pool is derived FROM padPower at fightStart, so a smaller padPower
   simply bought a proportionally smaller boss and every break still ran its
   thirty seconds. Only the numbers were wrong.

   $8 IS betSize LEVEL 36, the point the whole fight is tuned at - see the
   handoff. 800 cents saturates padPower's bet term at its 70 cap. autoSps is
   zero on purpose: a standalone player has the bet and no hired help.

   DEFINED BEFORE boss.js LOADS, not after. padPower() is read once at
   fightStart and frozen for the run, so a late definition would be a race
   against the first click. */
/* THIS PAGE DRAWS ITS OWN ENDING. boss.js paints WALKER DOWN / YOU DIED and
   the run code straight onto the canvas, where none of it can be selected or
   copied - see the note at the top of that block. The shell renders the same
   information as real elements instead, so the code can be clicked, selected
   and copied. */
window.BOSS_NO_OVERLAY = true;
/* A BOARD, ONLY SO THE SKY HAS DEPTH. makeNebula() reads BOARD.tiles and maps
   4->0, 40->1 on a curve, deliberately keeping the opening fight black rather
   than nearly black. With no board at all it takes the 4 default and skyDepth
   comes out zero - a starless void. 30 puts it around 0.64: stars and a
   nebula, without the late-game wash. Nothing else in the fight reads it. */
window.BOARD = { tiles: 30 };
window.BOSS_NO_OVERLAY = true;
window.S = { upgrades: { betSize: 36 }, muted: false, autoOn: false };
window.derived = function(){ return { betCents: 800 }; };
window.autoSps = function(){ return 0; };
</script>
<script src="../streamers.js"></script>
<script src="../music.js"></script>

<script>
/* ════════════════ THE DEBUG SURFACE IS TAKEN AWAY ════════════════
   boss.js publishes a large window.Boss for testing: god() grants
   invulnerability, jump() drops you straight into any row, tune is every
   difficulty constant and mutable, step() advances the simulation by hand.
   On the keno build that is a dev tool behind ?dev. On a public page it means
   nobody has to forge a run code at all - they type Boss.god(true), kill him
   for real, and get a genuine, checksum-valid code with an ordinary-looking
   time on it.

   REPLACED, NOT DELETED KEY BY KEY. The original object is captured in this
   closure and a new one is published with only what the shell needs, so the
   removed functions have no reachable handle left anywhere on the page -
   boss.js is an IIFE, and window.Boss was the only door into it.

   state IS NOT PASSED THROUGH EITHER. It is F, the live mutable fight object;
   handing it out lets someone set hpW to zero as easily as calling god(). The
   two fields the shell actually reads are exposed as getters instead.

   THIS IS NOT A SECURITY BOUNDARY AND MUST NOT BE MISTAKEN FOR ONE. It closes
   the easy door. The encoder still ships in boss.js and can still be read and
   reimplemented by anyone who wants to badly enough - see walker-code.py. */
(function(){
  var B = window.Boss;
  if (!B) return;
  window.Boss = {
    start:   B.start,
    stop:    B.stop,
    restart: B.restart,
    vol:     B.vol,
    isLive:  B.isLive,
    get over(){ return B.state ? B.state.over : null; },
    get code(){ return B.state ? B.state.code : null; }
  };
})();
</script>

<script>
/* ══════════════════ THE SHELL'S OWN SCRIPT ══════════════════
   It owns three things and nothing else: the front door, the bar that appears
   when a run ends, and the history sheet. The fight is entirely boss.js and is
   reached only through window.Boss, so nothing here can get between the player
   and the arena.                                                             */
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var STATS_KEY = "kenoidle.walker.stats";

  function stats(){
    try {
      var o = JSON.parse(localStorage.getItem(STATS_KEY));
      if (o && typeof o === "object") return o;
    } catch(e){}
    return {};
  }
  /* seconds under a minute, m+s under an hour, h+m above it. The last case is
     what stops "Time in arena" wrapping - 464m 53s is two lines in a 134px
     tile, 7h 44m is one. */
  function fmtT(ms){
    var s = (ms||0)/1000;
    if (s < 60)   return s.toFixed(1) + "s";
    if (s < 3600) return Math.floor(s/60) + "m " + ("0" + Math.floor(s%60)).slice(-2) + "s";
    return Math.floor(s/3600) + "h " + ("0" + Math.floor((s%3600)/60)).slice(-2) + "m";
  }
  var ROW = {1:"Phase 1",2:"Break 1",3:"Phase 2",4:"Break 2",
             5:"Phase 3",6:"Break 3",7:"Phase 4",8:"The finale",9:"Cleared"};

  /* ── the sheet ────────────────────────────────────────────────────────── */
  function draw(){
    var S = stats(), log = S.log || [];
    var wins = 0, best = 0, dealt = 0, i;
    for (i=0;i<log.length;i++){
      if (log[i].w) wins++;
      if ((log[i].r|0) > best) best = log[i].r|0;
      dealt += (log[i].o|0);
    }
    var fastest = null;
    for (i=0;i<log.length;i++) if (log[i].w && (fastest === null || log[i].t < fastest)) fastest = log[i].t;

    $("totals").innerHTML =
      tot("Attempts", log.length) +
      tot("Kills", wins) +
      tot("Furthest", ROW[best] || "—") +
      tot("Best time", fastest === null ? "—" : fmtT(fastest)) +
      tot("Damage dealt", dealt.toLocaleString()) +
      tot("Time in arena", fmtT(S.ms || 0));

    if (!log.length){
      $("tbl").innerHTML = '<tr><td class="empty">No runs yet. The first one is not going to go well.</td></tr>';
      return;
    }
    var h = "<tr><th>#</th><th>Result</th><th>Reached</th><th>Time</th>" +
            "<th>Damage taken</th><th>Damage dealt</th><th></th></tr>";
    /* newest first - the run somebody wants is almost always the last one */
    for (i=log.length-1;i>=0;i--){
      var r = log[i];
      h += '<tr class="' + (r.w ? "win" : "") + '">'
        +  '<td class="num">' + (i+1) + '</td>'
        +  '<td><span class="tag ' + (r.w ? "win\">KILL" : "loss\">DIED") + '</span></td>'
        +  '<td>' + (ROW[r.r|0] || "—") + '</td>'
        +  '<td>' + fmtT(r.t) + '</td>'
        +  '<td class="took">' + (r.d|0).toLocaleString() + '</td>'
        +  '<td class="dealt">' + (r.o|0).toLocaleString() + '</td>'
        +  '<td>' + (r.w && r.c
              ? '<button class="btn small" data-code="' + r.c + '">Copy code</button>'
              : '') + '</td></tr>';
    }
    $("tbl").innerHTML = h;
  }
  function tot(k, v){
    return '<div class="tot"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
  }

  /* COPY, WITH A FALLBACK THAT ACTUALLY RUNS. navigator.clipboard is
     undefined on any page not served over https or localhost, which is
     exactly where this gets tested. execCommand is deprecated and works
     everywhere that matters. */
  function copy(text, btn){
    var done = function(){
      var old = btn.textContent;
      btn.textContent = "Copied"; btn.classList.add("copied");
      setTimeout(function(){ btn.textContent = old; btn.classList.remove("copied"); }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallback(text, done); });
    } else fallback(text, done);
  }
  function fallback(text, done){
    var t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly","");
    t.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); done(); } catch(e){}
    document.body.removeChild(t);
  }
  $("tbl").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("button[data-code]") : null;
    if (b) copy(b.getAttribute("data-code"), b);
  });

  /* ══════════════════ THE RULES, WITH PICTURES ══════════════════
     Ported from the keno build's help panel rather than rewritten, canvases and
     all, so the diagrams stay the same objects the arena draws. The hitbox row
     especially: s2 is half of P's 52px box and the dot is P.r = 4.5, both
     straight out of boss.js, so the ratio shown here is the ratio being dodged.

     KEYED BY NAME, NOT BY POSITION - the original's note, and it holds: a
     switch on row index means inserting a row silently reattaches every
     picture to the wrong sentence. */
  var FACE = '"Trebuchet MS","Lucida Grande",Verdana,sans-serif';
  var ROWS = [
    ["wasd",   150, 62, "<b>WASD</b> moves you. You never shoot."],
    ["key",    150, 62, "<b>Press F11 to fullscreen</b> for a better experience!"],
    ["hitbox", 150, 62, "Your hitbox is <b>not the triangle</b>, it is <b>the dot</b>."],
    ["tile",   150, 62, "<b>Stand on a keno tile to repair it.</b> Repaired tiles are the only " +
                        "thing that damages Walker — you never attack him yourself."],
    ["health", 150, 62, "<b>You can be hit five times before you die.</b> Repairing a keno tile " +
                        "grants 30% health."],
    ["mines",  150, 62, "<b>Press SPACE or SHIFT to blow up a mine</b>, clearing all projectiles near you. " +
                        "Gain +1 maximum mines for each keno tile charged, reset to max at each step."]
  ];
  var rulesBuilt = false;
  function buildRules(){
    if (rulesBuilt) return; rulesBuilt = true;
    var html = "", q;
    for (q=0;q<ROWS.length;q++)
      html += '<canvas data-help="' + q + '" style="width:' + ROWS[q][1] +
              'px;height:' + ROWS[q][2] + 'px"></canvas><span>' + ROWS[q][3] + '</span>';
    $("ruleGrid").innerHTML = html;

    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var cvs = $("ruleGrid").querySelectorAll("canvas");
    for (var z=0; z<cvs.length; z++){
      var cv = cvs[z], k = +cv.getAttribute("data-help");
      var kind = ROWS[k][0], W2 = ROWS[k][1], H2 = ROWS[k][2];
      cv.width = Math.round(W2*dpr); cv.height = Math.round(H2*dpr);
      var g = cv.getContext("2d");
      g.setTransform(dpr,0,0,dpr,0,0);
      var cx = W2/2, cy = H2/2;

      /* ONE KEYCAP ROUTINE FOR BOTH KEY ROWS. F11 and WASD were going to be two
         separate lots of bevel arithmetic that had to keep matching each other
         by hand; drawn from the same function they cannot drift. Origin is the
         cap's CENTRE, because that is what both callers actually know. */
      function cap(gg, x, y, w, hgt, label, fs){
        var kx = x - w/2, ky = y - hgt/2;
        gg.fillStyle = "#0d0d10"; gg.fillRect(kx-1, ky-1, w+2, hgt+3);
        var kg = gg.createLinearGradient(0, ky, 0, ky+hgt);
        kg.addColorStop(0, "#3a3a44"); kg.addColorStop(1, "#212128");
        gg.fillStyle = kg; gg.fillRect(kx, ky, w, hgt);
        gg.fillStyle = "#44444f"; gg.fillRect(kx+3, ky+3, w-6, hgt-9);
        gg.strokeStyle = "#565663"; gg.lineWidth = 1;
        gg.strokeRect(kx+0.5, ky+0.5, w-1, hgt-1);
        gg.fillStyle = "#e9e9f0"; gg.font = "700 " + fs + "px " + FACE;
        gg.textAlign = "center"; gg.textBaseline = "middle";
        /* -3 because the cap's lit face is inset 3px at the bottom, so its
           optical centre sits above its geometric one */
        gg.fillText(label, x, y - 3);
      }

      if (kind === "key"){
        g.save(); cap(g, cx, cy, 54, 38, "F11", 15); g.restore();
      }

      else if (kind === "wasd"){
        /* the cluster as it sits under a left hand: W over A S D. 24x22 caps at
           a 4px gutter is 80x48 - inside the 150x62 tile with room to breathe,
           and big enough that the letters stay legible at 11px. */
        var kw2 = 24, kh2 = 22, gap = 4, step = kw2 + gap;
        g.save();
        cap(g, cx,        cy - (kh2+gap)/2, kw2, kh2, "W", 11);
        cap(g, cx - step, cy + (kh2+gap)/2, kw2, kh2, "A", 11);
        cap(g, cx,        cy + (kh2+gap)/2, kw2, kh2, "S", 11);
        cap(g, cx + step, cy + (kh2+gap)/2, kw2, kh2, "D", 11);
        g.restore();
      }
      else if (kind === "hitbox"){
        var s2 = 26;
        g.save(); g.translate(cx, cy+2);
        g.beginPath();
        g.moveTo(0,-s2); g.lineTo(s2*0.94, s2*0.80); g.lineTo(-s2*0.94, s2*0.80); g.closePath();
        var pg = g.createLinearGradient(0,-s2,0,s2*0.8);
        pg.addColorStop(0,"#2a1b45"); pg.addColorStop(1,"#14101f");
        g.fillStyle = pg; g.fill();
        g.strokeStyle = "rgba(160,120,255,.30)"; g.lineWidth = 6; g.stroke();
        g.lineWidth = 2.4; g.strokeStyle = "#c9b0ff"; g.stroke();
        g.fillStyle = "rgba(0,0,0,.85)";
        g.beginPath(); g.arc(0,0,7,0,6.28318); g.fill();
        g.fillStyle = "rgba(190,255,215,.95)";
        g.beginPath(); g.arc(0,0,4.5,0,6.28318); g.fill();
        g.fillStyle = "rgba(255,255,255,.95)";
        g.beginPath(); g.arc(0,0,1.89,0,6.28318); g.fill();
        g.restore();
      }
      else if (kind === "tile"){
        var TS = 52, hh = TS/2, hue = 8, frac = 0.74;
        g.save(); g.translate(cx, cy);
        g.fillStyle = "hsla(" + hue + ",30%,10%,.95)";
        g.fillRect(-hh,-hh,TS,TS);
        var fg2 = g.createLinearGradient(-hh,0,-hh+TS*frac,0);
        fg2.addColorStop(0,"hsla(" + hue + ",92%,55%,.42)");
        fg2.addColorStop(1,"hsla(" + hue + ",92%,66%,.16)");
        g.fillStyle = fg2; g.fillRect(-hh,-hh,TS*frac,TS);
        g.fillStyle = "hsla(" + hue + ",100%,86%,.95)";
        g.fillRect(-hh+TS*frac-1.25,-hh,2.5,TS);
        g.strokeStyle = "hsla(" + hue + ",75%,58%,.85)"; g.lineWidth = 1.5;
        g.strokeRect(-hh+2.5,-hh+2.5,TS-5,TS-5);
        g.fillStyle = "hsla(" + hue + ",95%,74%,1)";
        g.font = "700 20px " + FACE;
        g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText("1", 0, 1);
        g.restore();
      }
      else if (kind === "health"){
        var sc = 0.52, sw = 52*sc, sh = 16*0.95, gp = 4*sc, n5 = 5, left = 3;
        var tot = n5*sw + (n5-1)*gp, x0 = cx - tot/2, y0 = cy - sh/2;
        for (var q2=0; q2<n5; q2++){
          var sx = x0 + q2*(sw+gp);
          g.fillStyle = "#0e1a14"; g.fillRect(sx,y0,sw,sh);
          if (q2 < left){
            var hg = g.createLinearGradient(0,y0,0,y0+sh);
            hg.addColorStop(0,"#7dffb0"); hg.addColorStop(1,"#2ba465");
            g.fillStyle = hg; g.fillRect(sx,y0,sw,sh);
            g.fillStyle = "rgba(0,0,0,.22)";
            for (var nn=1; nn<3; nn++) g.fillRect(sx+sw*nn/3-0.5,y0,1,sh);
          }
          g.strokeStyle = q2<left ? "rgba(190,255,220,.55)" : "rgba(110,125,120,.35)";
          g.lineWidth = 1; g.strokeRect(sx+0.5,y0+0.5,sw-1,sh-1);
        }
      }
      else {
        var bd = 18, gap2 = 6, nb = 4, held = 2;
        var totb = nb*bd + (nb-1)*gap2, bx = cx - totb/2 + bd/2;
        for (var q3=0; q3<nb; q3++){
          g.save(); g.translate(bx + q3*(bd+gap2), cy); g.rotate(0.7854);
          var bs = bd*0.66;
          if (q3 < held){
            var bg2 = g.createLinearGradient(-bs/2,-bs/2,bs/2,bs/2);
            bg2.addColorStop(0,"#dff4ff");
            bg2.addColorStop(0.55,"#6cc4f5");
            bg2.addColorStop(1,"#1d5f8c");
            g.fillStyle = bg2; g.fillRect(-bs/2,-bs/2,bs,bs);
            g.strokeStyle = "rgba(215,245,255,.95)";
          } else {
            g.strokeStyle = "rgba(110,125,140,.5)";
          }
          g.lineWidth = 2; g.strokeRect(-bs/2,-bs/2,bs,bs);
          g.restore();
        }
      }
    }
  }
  function openRules(){ buildRules(); $("rules").classList.add("on"); }
  function closeRules(){ $("rules").classList.remove("on"); }

  /* ════════════════════ THE TITLE CARD ════════════════════
     Him at the last phase, turning, in front of a bloom. A first pass drew the
     two bullet arms wound around him as a frozen still; on screen it read as
     laser spam over the art, because the arms only make sense MOVING - a spiral
     you cannot see turn is a row of dots on a diagonal. Cut.

     THE FILTER IS APPLIED ONCE, NOT PER FRAME. hue-rotate + saturate +
     brightness + contrast over two 600px images is far too expensive sixty
     times a second; both layers are baked into offscreen canvases at load and
     the loop only blits them. The filter string is the one paintWalker()
     builds, from boss.js's own numbers - PHASE_HUE[4]=272, PHASE_GLITCH[4]=1,
     PHASE_LUMA[4]=1.41 - so this is not an impression of the last phase, it is
     the last phase.

     ONLY THE RING TURNS, which is the same split boss.js makes: the ring is his
     armour and spins, the head is him and does not. */
  var HERO_HUE = 272, HERO_G = 1.00, HERO_LUMA = 1.41, HERO_SPIN = 0.11;
  function heroStart(){
    var cv = $("hero"); if (!cv) return;
    var g = cv.getContext("2d"), S = cv.width, c = S/2;
    var FILT = "hue-rotate(" + HERO_HUE + "deg) saturate(" + (1+0.55*HERO_G).toFixed(2) +
               ") brightness(" + ((1-0.24*HERO_G)*HERO_LUMA).toFixed(4) +
               ") contrast(" + (1+0.5*HERO_G).toFixed(2) + ")";

    /* the bloom he stands in front of, baked too - it never changes */
    var back = document.createElement("canvas");
    back.width = back.height = S;
    (function(b){
      var bg = b.createRadialGradient(c, c, S*0.20, c, c, S*0.50);
      bg.addColorStop(0,    "rgba(124,58,237,.26)");
      bg.addColorStop(0.62, "rgba(96,42,190,.13)");
      bg.addColorStop(1,    "rgba(70,30,150,0)");
      b.fillStyle = bg; b.beginPath(); b.arc(c, c, S*0.50, 0, 6.28318); b.fill();
    })(back.getContext("2d"));

    function bake(img){
      var o = document.createElement("canvas");
      o.width = o.height = S;
      var x = o.getContext("2d");
      x.filter = FILT;
      var d = 0.94*S, m = (S-d)/2;
      x.drawImage(img, m, m, d, d);
      return o;
    }

    /* ════════ WHERE THE EYES ARE, FOUND RATHER THAN GUESSED ════════
       Hardcoding two coordinates into someone else's PNG is a number that goes
       silently wrong the day the art is re-exported. His eyes are by a wide
       margin the brightest thing on him, so they are located by looking.

       AT NATIVE RESOLUTION, AND THAT IS THE WHOLE TRICK. The first attempt
       scanned a 160px downscale and found nothing: the glow is about twenty
       pixels in a 1024px image, so a 7x7 box filter averages it clean away.
       Measured on the real art, the bright pixels form two tight lobes at 37%
       and 62% of the width - symmetric about his middle, which is exactly what
       two eyes look like and nothing else on him does.

       THE RAW IMAGE, NOT THE FILTERED ONE. hue-rotate and friends move colour,
       not position, so there is no reason to pay for the filter here - and
       getImageData off a filtered canvas is the slower path.

       X IS CLAMPED TO THE MIDDLE HALF. There is a second bright thing out at
       77% - a rune on the ring - which only appears once the threshold drops,
       but excluding it by geometry is cheaper than tuning around it.

       IT FAILS CLOSED. Without two convincing lobes the wink never fires. A
       wink in the wrong place is far worse than no wink, and re-exported art is
       precisely when that would happen. */
    function findEyes(img){
      var N = img.naturalWidth || 1024;
      var t = document.createElement("canvas"); t.width = t.height = N;
      t.getContext("2d").drawImage(img, 0, 0);
      var d;
      try { d = t.getContext("2d").getImageData(0,0,N,N).data; } catch(e){ return null; }
      var best = 0, i, L;
      for (i=0;i<d.length;i+=4){
        if (d[i+3] < 40) continue;
        L = 0.2126*d[i] + 0.7152*d[i+1] + 0.0722*d[i+2];
        if (L > best) best = L;
      }
      if (best < 90) return null;
      var cut = best*0.78, half = N/2;
      var sd = [{x:0,y:0,n:0,x0:1e9,x1:-1}, {x:0,y:0,n:0,x0:1e9,x1:-1}];
      for (var y=Math.round(N*0.15); y<Math.round(N*0.60); y++){
        for (var x=Math.round(N*0.25); x<Math.round(N*0.73); x++){
          i = (y*N+x)*4;
          if (d[i+3] < 40) continue;
          if (0.2126*d[i] + 0.7152*d[i+1] + 0.0722*d[i+2] < cut) continue;
          var k = x < half ? 0 : 1, e = sd[k];
          e.x += x; e.y += y; e.n++;
          if (x < e.x0) e.x0 = x; if (x > e.x1) e.x1 = x;
        }
      }
      if (sd[0].n < 4 || sd[1].n < 4) return null;
      /* into hero-canvas space: the head is drawn at 0.94*S, centred */
      var dd = 0.94*S, off = (S-dd)/2, k2 = dd/N, out = [];
      for (var q=0;q<2;q++){
        var e2 = sd[q];
        out.push({ x: off + (e2.x/e2.n)*k2,
                   y: off + (e2.y/e2.n)*k2,
                   /* the glow core is smaller than the eye it comes from */
                   r: Math.max(S*0.020, ((e2.x1-e2.x0+1)*k2)*0.95) });
      }
      return Math.abs(out[0].x - out[1].x) > S*0.06 ? out : null;
    }

    var ring = null, head = null, eyes = null, ready = 0;
    [["../boss/walker_ring.png", 0], ["../boss/walker_head.png", 1]].forEach(function(pair){
      var im = new Image();
      im.onload = function(){
        if (pair[1] === 0) ring = bake(im);
        else { head = bake(im); eyes = findEyes(im); }   /* the RAW image - see findEyes */
        ready++;
      };
      im.src = pair[0];
    });

    var t0 = performance.now(), nextWink = 2600 + Math.random()*3000, winkAt = -1e9, winkEye = 0;
    (function loop(){
      requestAnimationFrame(loop);
      /* the arena owns the screen once it is up; nothing here needs drawing */
      if (document.body.classList.contains("boss")) return;
      if (ready < 2) return;
      var now = performance.now(), el = now - t0;

      g.clearRect(0,0,S,S);
      g.drawImage(back, 0, 0);
      g.save(); g.translate(c,c); g.rotate(el/1000*HERO_SPIN); g.translate(-c,-c);
      g.drawImage(ring, 0, 0); g.restore();
      g.drawImage(head, 0, 0);

      if (eyes){
        if (el > nextWink){ winkAt = now; winkEye = Math.random() < 0.5 ? 0 : 1;
                            nextWink = el + 3400 + Math.random()*4200; }
        var w = (now - winkAt) / 190;                    /* one blink, 190ms */
        if (w >= 0 && w <= 1){
          /* a LID, not a dot. The eye is covered by a shape that closes from
             the top and opens again - sin gives the shut-and-open in one
             expression - and it is drawn in a colour sampled from his own face
             just below the eye, so it reads as skin rather than as a hole. */
          var e = eyes[winkEye], close = Math.sin(w*3.14159);
          var h = e.r * 2.05 * close;
          if (h > 0.4){
            g.save();
            g.beginPath();
            g.ellipse(e.x, e.y, e.r*1.5, Math.max(0.4, h), 0, 0, 6.28318);
            g.clip();
            /* his own face, taken from just under the eye and stretched over it */
            g.drawImage(head, 0, Math.round(e.r*2.2), S, S - Math.round(e.r*2.2),
                              0, Math.round(e.r*2.2), S, S - Math.round(e.r*2.2));
            g.restore();
          }
        }
      }
    })();
  }
  heroStart();

  /* ══════════════════ THE DOOR SITS IN SPACE ══════════════════
     A first pass tried to borrow the arena's own starfield. It cannot: boss.js
     is an IIFE and makeStars/makeNebula/drawStars are private to it, so the
     calls resolved to undefined and the try/catch swallowed it - a black
     screen with no error, which is the worst way for a thing to be missing.
     The door paints its own.

     NEBULA AND VIGNETTE ARE BAKED, STARS ARE LIVE. The clouds never change and
     large soft gradients are the expensive part; the stars are cheap and want
     to breathe. Rebuilt on resize only.

     THE VIGNETTE IS UNDER THE STARS, NOT OVER THEM. Over the top it flattens
     the whole field into haze; underneath, the middle simply has fewer stars
     to begin with and the ones there still read as points of light. */
  var sky = $("space"), sctx = sky.getContext("2d"), baked = null;
  var STARS = [], DPR = Math.min(2, window.devicePixelRatio || 1);

  function skyBuild(){
    var w = Math.round(innerWidth*DPR), h = Math.round(innerHeight*DPR);
    sky.width = w; sky.height = h;
    sky.style.width = innerWidth + "px"; sky.style.height = innerHeight + "px";

    STARS = [];
    var n = Math.round(Math.min(420, (innerWidth*innerHeight)/3600));
    for (var i=0;i<n;i++){
      var x = Math.random(), y = Math.random();
      /* thinned toward the middle, so the medallion is not sitting in confetti */
      var dm = Math.hypot(x-0.5, y-0.5)/0.7071;
      if (Math.random() > 0.18 + 0.82*dm) { i--; continue; }
      STARS.push({ x:x, y:y, r:(0.35 + Math.random()*1.25)*DPR,
                   a:0.20 + Math.random()*0.62,
                   tw:0.6 + Math.random()*1.7, ph:Math.random()*6.28318,
                   c: Math.random() < 0.14 ? "190,205,255"
                    : Math.random() < 0.10 ? "255,225,205" : "255,255,255" });
    }

    baked = document.createElement("canvas");
    baked.width = w; baked.height = h;
    var b = baked.getContext("2d");
    /* three clouds, off-centre and different sizes, so it does not read as one
       symmetrical blob behind him */
    var clouds = [[0.24,0.30,0.46,"88,44,190"], [0.78,0.66,0.52,"52,36,150"],
                  [0.58,0.16,0.34,"120,50,200"]];
    for (var k=0;k<clouds.length;k++){
      var cl = clouds[k], cx = cl[0]*w, cy = cl[1]*h, cr = cl[2]*Math.max(w,h);
      var gr = b.createRadialGradient(cx,cy,0,cx,cy,cr);
      gr.addColorStop(0,   "rgba(" + cl[3] + ",.085)");
      gr.addColorStop(0.55,"rgba(" + cl[3] + ",.034)");
      gr.addColorStop(1,   "rgba(" + cl[3] + ",0)");
      b.fillStyle = gr; b.fillRect(0,0,w,h);
    }
    /* and the well the buttons sit in */
    var vg = b.createRadialGradient(w/2,h*0.46,0,w/2,h*0.46,Math.max(w,h)*0.55);
    vg.addColorStop(0,   "rgba(3,3,7,.80)");
    vg.addColorStop(0.42,"rgba(3,3,7,.48)");
    vg.addColorStop(1,   "rgba(3,3,7,0)");
    b.fillStyle = vg; b.fillRect(0,0,w,h);
  }
  skyBuild();
  addEventListener("resize", skyBuild);

  (function skyLoop(){
    requestAnimationFrame(skyLoop);
    if (document.body.classList.contains("boss")) return;   /* the arena has it */
    var w = sky.width, h = sky.height, t = performance.now()/1000;
    sctx.clearRect(0,0,w,h);
    sctx.drawImage(baked,0,0);
    sctx.globalCompositeOperation = "lighter";
    for (var i=0;i<STARS.length;i++){
      var st = STARS[i];
      var a = st.a * (0.62 + 0.38*Math.sin(t*st.tw + st.ph));
      sctx.fillStyle = "rgba(" + st.c + "," + a.toFixed(3) + ")";
      sctx.beginPath();
      sctx.arc(st.x*w, st.y*h, st.r, 0, 6.28318);
      sctx.fill();
    }
    sctx.globalCompositeOperation = "source-over";
  })();

  /* ══════════════════ THE BED, ON THE TITLE CARD ══════════════════
     title-bed.m4a is the game's dark bed with its first fifteen seconds already
     cut off and re-encoded at 64k. The trim is baked into the FILE rather than
     done with currentTime, and that is most of why it starts quickly now:

       - nothing to seek. A seek on a progressive stream waits for the byte
         range holding that timestamp, which on a cold load is most of the
         download anyway.
       - 837KB against 1434KB, so 42% less to wait for.
       - loop=true wraps to 0, which is now the right place. The old version had
         to catch `ended` and seek back, because wrapping to the true start
         handed back the exact seconds being skipped.
       - +faststart puts the moov atom at the front, so playback can begin
         before the file has finished arriving.

     AND IT IS BUILT AT LOAD, NOT ON THE FIRST CLICK. This was created lazily
     inside bedGet(), so the download did not BEGIN until the player touched
     something - the whole fetch was spent after the gesture instead of before
     it. That was the rest of the delay.

     AUTOPLAY IS ATTEMPTED, THEN FALLEN BACK ON. Browsers block unprompted
     audio, but not always: a visitor with prior media engagement on the origin
     is allowed through, and gets sound as the page settles. When the promise
     rejects, the listeners below take over - and by then the file is buffered,
     so the first click starts it instantly. There is no way to force it;
     muted-autoplay-then-unmute needs the same gesture to unmute. */
  var BED_FADE = 2000, BED_GAIN = 0.34, bedT0 = 0, bedOn = false;
  var bed = new Audio("../audio/title-bed.m4a");
  bed.loop = true; bed.preload = "auto"; bed.volume = 0;
  try { bed.load(); } catch(e){}

  function master(){
    try { if (window.Boss && Boss.vol) return Boss.vol(); } catch(e){}
    return 1;
  }
  function bedPlay(){
    if (!bed.paused) return;
    var pr = bed.play();
    if (pr && pr.then) pr.then(function(){ bedOn = true; bedT0 = performance.now(); },
                               function(){});
    else { bedOn = true; bedT0 = performance.now(); }
  }
  function bedWant(on){
    if (on){
      if (bed.paused) bedPlay();
      if (!bedOn) return;
      bed.volume = BED_GAIN * master() * Math.min(1, (performance.now() - bedT0)/BED_FADE);
    } else {
      bed.volume = Math.max(0, bed.volume - 0.05);
      if (bed.volume <= 0 && !bed.paused) bed.pause();
    }
  }
  bedPlay();                                   /* for anyone the browser allows */
  function bedArm(){
    document.removeEventListener("pointerdown", bedArm, true);
    document.removeEventListener("keydown", bedArm, true);
    if (!document.body.classList.contains("boss")) bedPlay();
  }
  document.addEventListener("pointerdown", bedArm, true);
  document.addEventListener("keydown", bedArm, true);

  /* IT GOES AWAY ONCE IT HAS BEEN TAKEN. F11 is browser chrome rather than the
     Fullscreen API, so document.fullscreenElement never sees it - the only
     signal is the viewport growing to fill the screen. Compared with a slack of
     a few pixels because the two rarely match exactly, and re-checked on resize
     because that is the event F11 actually fires. */
  (function(){
    var el = $("f11");
    function check(){
      var full = (screen.height - innerHeight) < 6 && (screen.width - innerWidth) < 6;
      el.classList.toggle("gone", full);
    }
    addEventListener("resize", check);
    check();
  })();

  function openStats(){ draw(); $("stats").classList.add("on"); }
  function closeStats(){ $("stats").classList.remove("on"); }

  $("bPlay").onclick   = function(){ start(); };
  $("bAgain").onclick  = function(){ if (window.Boss && Boss.restart) Boss.restart(); hideAfter(); };
  $("bCopyWin").onclick = function(){ copy($("codetext").textContent, this); };
  $("bStats").onclick  = openStats;
  $("bStats0").onclick = openStats;
  /* ONE KNOB FOR EVERYTHING. Boss.vol() is boss.js's own master - it scales the
     fight music and every cue, and persists itself to localStorage - so the
     slider drives that and the bed simply multiplies by it. A second,
     independent volume for the title card would be a setting that silently
     un-sets itself the moment the fight starts. */
  (function(){
    var sl = $("vol"), rd = $("volRead");
    function show(v){ rd.textContent = Math.round(v*100) + "%"; }
    var v0 = master(); sl.value = Math.round(v0*100); show(v0);
    sl.addEventListener("input", function(){
      var v = (+sl.value)/100;
      try { if (window.Boss && Boss.vol) Boss.vol(v); } catch(e){}
      if (bed && !bed.paused) bed.volume = BED_GAIN * v;
      show(v);
    });
  })();
  $("bRules").onclick  = openRules;
  $("bRulesClose").onclick = closeRules;
  $("bClose").onclick  = closeStats;
  $("bWipe").onclick   = function(){
    if (!confirm("Erase every run recorded in this browser? This cannot be undone.")) return;
    try { localStorage.removeItem(STATS_KEY); } catch(e){}
    draw();
  };
  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    /* SWALLOWED, so Escape closing a sheet does not also reach boss.js and
       tear the player out of the arena behind it. */
    if ($("stats").classList.contains("on")){ closeStats(); e.stopPropagation(); }
    else if ($("rules").classList.contains("on")){ closeRules(); e.stopPropagation(); }
  }, true);

  function start(){
    closeStats(); hideAfter();
    if (window.Boss && Boss.start) Boss.start(true);   /* straight in, no cutscene */
  }

  /* ── the bar after a run ──────────────────────────────────────────────── */
  /* POLLED, NOT HOOKED. boss.js has no event when a run ends - F.over simply
     becomes truthy - and reaching in to wrap finCollapse from out here would
     couple this shell to the fight's internals. A quarter-second poll is
     imperceptible against a death screen and costs nothing. */
  var wasOver = null;
  function hideAfter(){
    $("after").classList.remove("on");
    document.body.classList.remove("dead");
    wasOver = null;
  }
  setInterval(function(){
    /* the bed belongs to the door: on whenever the arena is not up */
    bedWant(!document.body.classList.contains("boss"));
    var over = (window.Boss && "over" in Boss) ? Boss.over : null;
    if (over && over !== wasOver){
      wasOver = over;
      var win = (over === "player");
      $("verdict").textContent = win ? "WALKER DOWN" : "YOU DIED";
      $("verdict").className = "verdict " + (win ? "win" : "loss");
      /* a code only exists for a kill - there is nothing to verify about a death */
      var code = (win && Boss.code) ? Boss.code : "";
      $("codetext").textContent = code;
      $("codebar").classList.toggle("on", !!code);
      $("after").classList.add("on");
      /* "walker" is the player dying; "player" is the kill. Only the first
         drains the room - see the note on body.dead. */
      document.body.classList.toggle("dead", !win);
    }
    else if (!over && wasOver){ hideAfter(); }
  }, 250);
})();
</script>
</body>
</html>
