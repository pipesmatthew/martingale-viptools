   happening to. Scaled by column count, floored at half so the first mine is
   still an event and not a puff. At the last stage it resolves to 1 and the
   blast is exactly the one the takeover throws. */
function mineBlast(){ return 0.5 + 0.5 * (BOARD.cols / STAGES[LAST_STAGE].cols); }
/* HOW LONG A STAGE HAS TO BE LIVED IN BEFORE THE NEXT MINE CAN ARM.

   THE OPENING IS EXEMPT. Stage 1 is armed by the purchase — buying a second
   number is what puts a mine in play — and putting draws in front of that
   would push the first one out past the dead stretch it exists to fill.

   EVERY STAGE AFTER IT DWELLS. Without this the mine re-arms the instant the
   board finishes growing, so 3x2 lasted the same 1-in-200 as 2x2 did: about
   four minutes, and the board was at 3x3 before the player had played on the
   thing that had just been built for them.

   ONE NUMBER, FLAT, ON PURPOSE. A per-stage curve would be inventing pacing
   for stages 3 to 9, which are `tbd` in HANDOFF-BOARD.md and nobody has
   designed. 1,200 draws is about 22 minutes of hand-clicking, and the 1-in-200
   roll then sits on top of it — so 3x2 runs roughly 26 minutes against the
   opening's seven. Raise it to slow the arc; the ladder does not care. */
var MINE_STAGE_DRAWS = 1200;
function mineArmAt(stage){ return stage <= 0 ? 0 : MINE_STAGE_DRAWS; }
function mineArmed(){
  return upLevel("extraPicks") >= 1 && S.stage < LAST_STAGE &&
         S.stageDraws >= mineArmAt(S.stage);
}
function rollMine(){
  if (!mineArmed()) return false;
  if (S.dev.forceMine){ S.dev.forceMine = false; return true; }
  S.mineDraws += 1;
  if (S.mineDraws >= MINE_GUARANTEE) return true;
  return Math.floor(Math.random() * mineOdds()) === 0;
}

/* WHERE IT LANDS: the middle of the column about to be pushed out, so the
   blast is at the edge that actually moves. A stage that adds a row instead
   moves the bottom one, and the same reasoning picks it. */
function mineTargetTile(next){
  var n = STAGES[Math.min(next, LAST_STAGE)];
  var addsCol = n.cols > BOARD.cols;
  var r = addsCol ? Math.floor(BOARD.rows / 2) : BOARD.rows - 1;
  var c = addsCol ? BOARD.cols - 1 : Math.floor(BOARD.cols / 2);
  return r * BOARD.cols + c + 1;
}

/* ── the board grows ──────────────────────────────────────────────────
   FLIP, BECAUSE A GRID CANNOT ANIMATE A CHANGE OF TRACK COUNT. Adding a
   column re-lays the whole grid out in a single frame and every tile
   teleports. So: measure where the tiles are, change the geometry, measure
   where they landed, put them back with a transform, and release. The layout
   stays the fluid grid it always was — nothing is positioned by hand — and
   the animation is one transform per tile.

   PICKS MOVE WITH THE TILE THEY WERE ON, NOT WITH THEIR NUMBER. Tiles are
   numbered in reading order, so widening the board renumbers nearly all of
   them: the bottom-left square is tile 3 on a 2x2 and tile 4 on a 3x2.
   Carrying the number across would silently move the player's pick to a
   different square; carrying the position keeps the one they clicked. */
function growBoardTo(next, quiet){
  next = clamp(int(next, 0), 0, LAST_STAGE);
  if (next === S.stage) return;

  var board = $("board");
  var oldCols = BOARD.cols, oldTiles = BOARD.tiles;
  var rects = {}, i, el;
  if (!quiet){
    for (i = 1; i <= oldTiles; i++){
      el = board.children[i-1];
      if (el) rects[i] = el.getBoundingClientRect();
    }
  }

  var newCols = STAGES[next].cols;
  function moved(oldT){
    var r = Math.floor((oldT - 1) / oldCols), c = (oldT - 1) % oldCols;
    return r * newCols + c + 1;
  }
  var back = {};                        /* new tile number -> its old rect */
  for (i = 1; i <= oldTiles; i++) if (rects[i]) back[moved(i)] = rects[i];

  var picks = [];
  for (i = 0; i < S.picks.length; i++) picks.push(moved(S.picks[i]));
  S.picks = picks.sort(function(a,b){ return a-b; });

  S.stage = next;
  S.stageDraws = 0;                    /* the new board has not been played yet */
  S.mineDraws = 0;
  setStage(next);
  /* THE LAST DRAW WAS SCORED ON A BOARD THAT NO LONGER EXISTS. Its tile
     numbers name different squares now and its hit count was against a
     different ball count, so it is dropped rather than remapped — the history
     strip already has the row. */
  S.last = null; S.revealUpto = null;
  /* A BIGGER BOARD IS A NEW BOARD FOR THE HIRED HELP TOO, by the same rule
     their own upgrades already follow. */
  reboardStreamers();
  paintBoard();

  if (quiet){ paint(); return; }

  /* FIRST/LAST/INVERT. Old tiles go back to where they were; new ones are
     held at zero. Both are inline styles, which paintBoard cannot disturb
     because it only ever writes className. */
  var fresh = [];
  for (i = 1; i <= BOARD.tiles; i++){
    el = board.children[i-1];
    if (!el) continue;
    var was = back[i];
    el.style.transition = "none";
    if (was){
      var now = el.getBoundingClientRect();
      el.style.transform = "translate(" + (was.left - now.left).toFixed(2) + "px," +
                                          (was.top - now.top).toFixed(2) + "px)";
    } else {
      el.style.transform = "scale(0)";
      el.style.opacity = "0";
      fresh.push(el);
    }
  }

  /* TWO FRAMES, NOT ONE. A single rAF still shares a frame with the style
     writes above often enough to be flaky, and a transition that starts from
     the value it is transitioning to does not run at all. */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      for (var j = 1; j <= BOARD.tiles; j++){
        var e2 = board.children[j-1];
        if (!e2 || !back[j]) continue;
        /* SET INLINE, NOT BY A CLASS. `transition` is a shorthand and .kt
           already declares one for its colours; a class rule would replace it
           wholesale and take the colour fades with it. */
        e2.style.transition = "transform 560ms cubic-bezier(.22,1,.3,1)";
        e2.style.transform = "";
      }
      for (var f = 0; f < fresh.length; f++){
        (function(node, k){
          setTimeout(function(){
            node.style.transition = "transform 420ms cubic-bezier(.2,1.5,.4,1)," +
                                    "opacity 300ms ease";
            node.style.transform = ""; node.style.opacity = "";
          }, 90 + 70 * k);
        })(fresh[f], f);
      }
      setTimeout(function(){
        for (var j2 = 1; j2 <= BOARD.tiles; j2++){
          var e3 = board.children[j2-1];
          if (!e3) continue;
          e3.style.removeProperty("transition");
          e3.style.removeProperty("transform");
          e3.style.removeProperty("opacity");
        }
      }, 1100 + 70 * fresh.length);
      paint();
    });
  });
}

/* Boards re-rolled against the new size, and the fractional carry dropped:
   it is a numerator over the tile count, and the tile count just changed.
   At most one cent per streamer per stage. */
function reboardStreamers(){
  for (var i = 0; i < STREAMERS.length; i++){
    var def = STREAMERS[i], st = S.streamers[def.id];
    if (!st) continue;
    st.board = rollBoard(sPicks(def, st));
    st.centsCarry = 0;
    st.last = null;
  }
}

/* ── the sequence ─────────────────────────────────────────────────────
   ABOUT TWO AND A HALF SECONDS, and deliberately nothing like the takeover.
   That one is a 41-second cabinet event at 1-in-4,000; this one fires nine
   times in a whole run and has to survive being seen every time. It borrows
   the takeover's comet, shockwave, bullet hell and mesh wave rather than
   growing a second set of them. */
function mineSequence(){
  var next = S.stage + 1;
  var tile = mineTargetTile(next);
  var el = $("board").querySelector('.kt[data-t="' + tile + '"]');
  if (!el){ growBoardTo(next, true); save(); return; }

  /* 16s, not 9. The shower adds five seconds in front of a sequence that was
     already ~2.9, and the watchdog exists to release a stranded board — not to
     fire in the middle of a running one. Same lesson as beginAnim(50000) for
     the takeover. */
  beginAnim(16000);
  document.body.classList.add("mine");

  /* THE SKY FILLS BEFORE ANYTHING HITS THE BOARD. Thirty to forty small
     meteors over five seconds, on the ambient star's own canvas rather than
     the takeover's — see meteorShower. They run BEHIND the cards, so the
     announcement happens around the board and the impact happens on it. */
  meteorShower(SHOWER_MS);

  setTimeout(function(){
  bwShotsStart();
  bwShotFire(tile, true);
  thud(150, 44, 0.5, 0.16);

  setTimeout(function(){
    var r = el.getBoundingClientRect();
    var x = r.left + r.width/2, y = r.top + r.height/2;
    var bs = mineBlast();
    bwBoom(x, y, 34 * bs, 26);
    bwBurst(x, y, Math.round(260 * bs), bs);
    bwMeshWave(x, y, MINE_MESH_MS, BOARD.cols / STAGES[LAST_STAGE].cols);
    thud(90, 28, 0.9, 0.3);
    document.body.classList.add("mineshake");
    setTimeout(function(){ document.body.classList.remove("mineshake"); }, 660);

    /* THE MESH AND THE GROWTH CANNOT OVERLAP, and it is not a matter of taste.
       bwMeshWave writes style.transform on every tile every frame and holds a
       reference to each one; growth is FLIP, which also writes style.transform
       — and rebuilds the tiles out from under those references first. Run
       together, the mesh wins the transform on every frame the growth needs
       it, and then goes on animating nodes that have left the document. It
       also makes getBoundingClientRect lie by up to a few hundred pixels while
       it runs, and the FLIP measurement is built on exactly that call.

       So: the board is struck, the surface gives and springs back, and THEN it
       opens. bwMeshStop() is called rather than trusted — MINE_MESH_MS is the
       number the wave was given, but a slow tab makes that a hope, not a fact. */
    setTimeout(function(){
      bwMeshStop();
      growBoardTo(next, false);

      setTimeout(function(){
        bwShotsStop();
        starClear();
        document.body.classList.remove("mine");
        endAnim();
        /* the event is not idle time — restart the countdown from its end, or
           auto snaps on the instant it finishes */
        lastPlayAt = Date.now();
        paint(); save();
        if (S.autoOn) startAuto();
      }, 1500);
    }, MINE_MESH_MS);
  }, BW.shotFly);
  }, SHOWER_MS);
}

/* ROLLED AFTER THE DRAW HAS SETTLED, never before it. A mine that fired first
   would change the board's size — and therefore its paytable — underneath a
   draw that had already been rolled against the old one. */
/* Returns whether it fired. Nothing reads that any more — it existed to stop
   the win banner landing in the middle of the blast, and the banner is gone —
   but a function that says whether it did the thing is worth keeping over one
   that does not. */
function maybeMine(){
  if (!rollMine()) return false;
  S.mineDraws = 0;
  if (S.dev.instant || autoQuiet || document.hidden){
    /* NOBODY IS WATCHING A CATCH-UP BATCH, but the board still grew. */
    growBoardTo(S.stage + 1, true);
    save();
    return true;
  }
  mineSequence();
  return true;
}

function inBallZone(t){
  /* EXPRESSED AS A MARGIN, NOT AS FIXED ROWS AND COLUMNS. "rows 2-4, columns
     3-6" was one ring inside an 8x5 board and is the EMPTY SET on a 2x2 one,
     which would have sent every early ball to the fallback without ever
     saying so. One tile in from each edge is the same intent at any size, and
     a board too small to have an inside qualifies everywhere. */
  var row = Math.ceil(t / BOARD.cols), col = ((t - 1) % BOARD.cols) + 1;
  if (BOARD.cols < 3 || BOARD.rows < 3) return true;
  return row >= 2 && row <= BOARD.rows - 1 && col >= 2 && col <= BOARD.cols - 1;
}
/* 1,619,428x will not fit in a 54px tile; 1.6Mx will. */
function multText(m){
  if (m >= 1e9) return (m/1e9).toFixed(m >= 1e10 ? 0 : 1) + "B";
  if (m >= 1e6) return (m/1e6).toFixed(m >= 1e7 ? 0 : 1) + "M";
  if (m >= 1000) return (m/1000).toFixed(m >= 1e4 ? 0 : 1) + "K";
  return String(m);
}

/* A draw containing exactly n of the player's numbers - developer only. */
/* Ten tiles, one of them chosen in advance. */
function draw10With(tile){
  var others = [];
  for (var t=1;t<=40;t++) if (t !== tile) others.push(t);
  shuffle(others);
  return shuffle([tile].concat(others.slice(0, 9)));
}

function drawWithHits(n){
  var mine = shuffle(S.picks.slice()), others = [];
  for (var t=1;t<=40;t++) if (S.picks.indexOf(t) === -1) others.push(t);
  shuffle(others);
  return shuffle(mine.slice(0, n).concat(others.slice(0, 10 - n)));
}

/* ═══════════════ THE ORDER OF A DRAW, WITH A BALL IN IT ═══════════════
   1. you press Play
   2. the ball drops onto one of the numbers YOU chose
   3. the draw comes in, and that number is guaranteed to be among it
   4. the win is multiplied

   The ball arriving BEFORE the draw is what makes it worth anything: it
   lands on a number you own and then promises the draw will contain it, so
   the multiplier always has something to multiply. Landing it afterwards —
   which is how this worked first — meant it could only ride on a win that
   had already happened, and a ball that lands on a losing board is a
   jackpot animation played over nothing. */
function play(fromAuto){
  /* NOT WHILE THE ARENA IS UP. Every draw in the game comes through here —
     manual, auto, the idle pump, the dev buttons — so this one line is the
     whole guarantee, and gating any of the callers instead would leave the
     others to be found one at a time. The board is a TARGET during the fight,
     and a board that keeps drawing behind a boss is both a distraction and a
     lie: it is supposed to be broken. */
  if (window.Boss && Boss.isLive()) return;

  var D = derived();
  if (S.animating || S.picks.length !== D.picks) return;
  /* the last win's glow belongs to the last win */
  document.body.classList.remove("bwafter");
  hideBall();

  var ball = rollBall();
  /* Nobody is watching a hidden tab or a catch-up batch, so those skip the
     drop — but they still get the guaranteed tile and the multiplier. The
     ball is worth the same whether or not you saw it arrive. */
  var quiet = S.dev.instant || autoQuiet || document.hidden;
  /* GEM TIERS TAKE OVER THE SCREEN. Everything below 200x keeps the ordinary
     drop, because a sixteen-second cabinet moment for a 10x would leave the
     1000x with nothing left to be. */
  var g = ball ? (BALL_ART[ball.mult] || {}) : {};
  if (ball && !quiet && g.kind === "gem"){
    var D2 = derived();
    var dd2 = draw10With(ball.tile);
    var h2 = 0;
    for (var q=0;q<dd2.length;q++) if (S.picks.indexOf(dd2[q]) !== -1) h2++;
    var m2 = (pays()[D2.picks] || {})[h2] || 0;
    S.last = { drawn: dd2, hits: h2, mult: m2,
               payCents: D2.betCents * m2 * ball.mult, ball: ball };
    S.dev.forceHits = null;
    /* 50s, not 40. The watchdog exists to stop a stranded takeover locking
       the board, and the takeover itself is now 41.31s — at 40000 the guard
       fired BEFORE the event finished and tore down its own animation. */
    beginAnim(50000);                       /* the event outlasts the usual guard */
    S.revealUpto = 0;
    paint();
    bigWinSequence(ball, dd2, h2, m2, S.last.payCents, function(){
      endAnim();
      /* the event is not idle time — restart the countdown from its end,
         or auto snaps on the instant a thirty-second cinematic finishes */
      lastPlayAt = Date.now();
      settle();
    });
    return;
  }
  /* THE BALL ARRIVES AFTER THE DRAW, NOT BEFORE IT. It used to land first
     and then promise the draw would contain its tile, which meant the
     interesting part — whether the number turns up — was already settled
     before a single tile had turned over. Now the ten numbers come in
     first and the ball drops onto one of them, which reads as a reward for
     the draw rather than an announcement of it.

     Nothing about the payout moves: draw10With() still guarantees the
     tile, so the ball is worth exactly what it was. Only the order you
     see it in changed. */
  resolveDraw(fromAuto, ball, quiet);
}

function resolveDraw(fromAuto, ball, quiet){
  var D = derived();
  var forced = S.dev.forceHits;
  var d;
  if (ball) d = draw10With(ball.tile);              /* its tile is in the draw */
  else if (forced !== null && forced <= D.picks) d = drawWithHits(forced);
  else d = draw10();
  S.dev.forceHits = null;

  var hits = 0;
  for (var i=0;i<d.length;i++) if (S.picks.indexOf(d[i]) !== -1) hits++;
  var mult = (pays()[D.picks] || {})[hits] || 0;
  /* integer cents x integer multiplier, twice - a fraction cannot appear */
  S.last = { drawn: d, hits: hits, mult: mult, payCents: D.betCents * mult,
             ball: ball || null };
  if (ball) S.last.payCents *= ball.mult;

  if (quiet){ S.revealUpto = null; endAnim(); settle(); return; }

  /* THE REVEAL HAS TO FIT IN THE GAP. At four draws a second the turn-over
     is longer than the interval itself, so it would throttle auto-play to
     whatever the animation costs instead of the rate you paid for. It gets
     three quarters of the gap, and below the point where there is anything
     left to see the draw lands at once.

     A MANUAL PRESS ALWAYS TURNS OVER AT THE FULL PACE. The speed track is
     auto-play's; pressing Play yourself should not hand you an animation
     clipped by a setting meant for something else. */
  var total = REVEAL_TOTAL;
  if (fromAuto){
    total = Math.min(REVEAL_TOTAL, autoSecs() * 1000 * 0.75);
    if (total < 120){ S.revealUpto = null; endAnim(); settle(); return; }
  }
  var every = Math.max(12, Math.round(total / d.length));
  beginAnim(); S.revealUpto = 0;
  var rung = 0;
  paint();
  (function next(){
    /* If the tab is hidden PART WAY THROUGH, abandon the rest of the reveal
       rather than crawling it — otherwise a draw that began while visible
       keeps the board locked long after you switched away. */
    if (document.hidden && S.revealUpto < d.length){
      endAnim(); S.revealUpto = null;
      settle();                       /* no drop: nobody is watching it */
      return;
    }
    if (S.revealUpto >= d.length){
      S.revealUpto = null;
      if (ball){
        /* the draw is in; now show what landed on it */
        activeBall = ball;
        paintBoard();
        dropBall(ball, function(){ endAnim(); settle(); });
        return;
      }
      endAnim();
      settle();
      return;
    }
    var v = d[S.revealUpto];
    S.revealUpto += 1;
    paintBoard();
    if (S.picks.indexOf(v) !== -1){ rung += 1; ping(rung); }
    setTimeout(next, every);
  })();
}


/* Positions the ball over its tile and lets the animation do the rest. The
   coordinates are read from the live tile because the board is a percentage
   width — a hard-coded grid position would drift with the viewport. */
/* ═══════════════════════ THE BIG WIN SEQUENCE ════════════════════════
   Gem tiers only. The order is: room clears and the board grows, the storm
   builds, the ten tiles turn over one at a time, the gem lands, the total
   counts up, then everything fades back.

   It runs about sixteen seconds, which is a long time to hold a game still —
   at 1 in 4,000 that is roughly every seventeen minutes at top speed. The
   streamers keep earning underneath it; only YOUR board is paused. */
var BW = {
  ramp:    10000,   /* the sky builds over the ORDINARY board, nothing else moves */
  peakHold:  900,   /* solid white — the room changes inside this */
  clear:    1700,   /* the veil thins onto the new board */
  settle:   1400,   /* a beat: the bonus board under an ordinary starfall */
  storm:    2600,   /* the comet storm that clears the board */
  stormRest: 700,   /* a beat with only your numbers left standing */
  pickWave: 2600,   /* then one comet per number you chose */
  shotFly:   430,   /* a comet's flight, so it lands ON the beat */
  dropFor:   900,   /* the gem falls and radiates */
  /* ── THE CELEBRATION IS THE SONG ─────────────────────────────────────
     These were 3200 and 4200, and the win was over while the music was
     still going — the cue runs to 42.72s and the whole payoff was done by
     28. Stretched so the multiplier and the money are climbing for most of
     the track, with the gem throwing shells the entire time.

     Sequence now ends at 41.31s against a 42.72s cue, so the music still
     outlives it by about two seconds rather than being cut off. If either
     number moves again, that relationship is the one to keep. */
  mult:     7000,   /* 0x climbs to the multiplier, winding up as it goes */
  count:   10000,   /* MAXIMUM WIN counts from zero */
  hold:     2000,
  fade:     1250    /* shrink, then colour, then the interface */
};
var bwTimers = [], bwRaf = null, bwGemRaf = null;

/* EVERY STREAK LOOPS FOREVER, so the ramp is done with start delays rather
   than by spawning more of them — density climbs as each one joins, and
   holds at full once they all have. Built once and reused. */
/* ═══════════════════ THE STORM IS DRAWN, NOT STYLED ═══════════════════
   This was 380 SVG paths each animating stroke-dashoffset. It never worked.
   Two separate faults, and the second is why it moved to canvas:

   1. The offset was driven from custom properties. The keyframes resolved and
      the animation attached, but the value never moved, so every streak sat
      parked off the start of its own path and the sky rendered pure black.
   2. Even once that was fixed and streaks appeared, Chrome could not keep up.
      Each dashoffset change invalidates that path's raster, and 380 of them
      over a full-screen SVG layer is main-thread work every frame. Screenshots
      caught whole frames coming up empty — the board vanishing, then the
      entire screen going black and back. That is the flicker.

   A canvas draws the same 400 streaks as plain line segments with no DOM, no
   style recalc and no per-path invalidation. Three strokes of rising alpha
   stand in for a gradient tail, which avoids allocating 400 gradient objects
   every frame. */
var bwSkyRaf = null, bwSkyT0 = 0;
var SKY_BASE = 0.62;          /* the ordinary storm, as a fraction of the pool */

/* ONE POOL, AND DENSITY IS THE WHOLE PERFORMANCE. Streaks no longer carry
   individual start delays — the count drawn is what ramps, from almost
   nothing to the entire pool and then back down to the ordinary rate. That
   also means the settle after the cover looks exactly like the storm always
   did, because it IS the storm, just at its usual density. */
function bwSkyStart(sched){
  var cv = $("bwSky");
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext("2d");
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var W = window.innerWidth, H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  /* EVERY STREAK STARTS AND ENDS OFF SCREEN. Placing x0 anywhere in
     `-0.4*run .. +1.25W` meant most of them began at a positive x — they
     popped into existence in the middle of the picture rather than flying
     into it, which is the one thing a starfield must never do.

     So the path is built from the direction instead of from a box: take the
     mean travel vector, jitter the angle a little, lay a path of 1.4 screen
     diagonals centred on a point offset perpendicular to it. Half a path is
     0.7 diagonals, which is longer than the screen's half-extent in any
     direction, so both ends are always outside. */
  var diag = Math.hypot(W, H), L = diag * 1.4;
  var baseAng = Math.atan2(-H * 0.525, W * 1.125);
  var N = 3400, st = [];
  for (var i=0;i<N;i++){
    var ang = baseAng + (Math.random() - 0.5) * 0.22;
    var ux = Math.cos(ang), uy = Math.sin(ang);
    var offs = (Math.random()*2 - 1) * diag * 0.72;
    st.push({ ux: ux, uy: uy, len: L,
              x0: W/2 - uy*offs - ux*L/2,
              y0: H/2 + ux*offs - uy*L/2,
              hue: Math.floor(Math.random()*360),
              w: 1.1 + Math.random()*1.7,
              tail: 0.055 + Math.random()*0.055,
              dur: 450 + Math.random()*400,
              /* EACH STREAK RESTS BETWEEN CROSSINGS, ALWAYS BY THE SAME
                 AMOUNT. The rest used to shrink as density climbed, which
                 sounds harmless and is not: the rest is part of the cycle
                 LENGTH, and `(t % cycle)` with a cycle that changes every
                 frame does not advance smoothly — it jumps. Streaks
                 teleported along their own paths and read as travelling at
                 wildly different speeds early on versus late.

                 A fixed cycle means the crossing always takes `dur`, so
                 every streak moves at the same speed for the whole event and
                 only the NUMBER of them changes. Density does all the work. */
              gap: 300 + Math.random()*2600,
              off: Math.random()*6000 });
  }

  var peakEnd = sched.ramp + sched.peakHold;
  var BASEN = Math.round(SKY_BASE * N);      /* the ordinary storm, in streaks */
  var START = 2;                             /* about one crossing a second */

  /* 0 -> 1 across the ramp: drives the veil, width and brightness */
  function level(el){
    if (el < sched.ramp) return Math.pow(el / sched.ramp, 1.9);
    if (el < peakEnd) return 1;
    return Math.max(0, 1 - (el - peakEnd) / sched.clear);
  }

  /* COUNT IS GEOMETRIC, NOT LINEAR. Three streaks to two and a half thousand
     is a range of nearly a thousand to one, and interpolating that linearly
     spends the entire ramp already dense — the old curve started at 17% of
     the pool, which is 440 streaks in the very first frame. There was no
     build to see. Multiplying up from three means the first seconds really
     are a handful of stars. */
  function count(el){
    if (el < sched.ramp){
      var t = el / sched.ramp;
      /* the exponent is the whole feel of the build. Above 1 the count sits
         low for most of the ramp and arrives late; at 0.85 it is climbing
         hard by the halfway mark and the last seconds before the white are
         genuinely dense rather than merely busy. */
      return Math.max(1, Math.round(START * Math.pow(N/START, Math.pow(t, 0.85))));
    }
    if (el < peakEnd) return N;
    var q = Math.min(1, (el - peakEnd) / sched.clear);
    return Math.round(N + (BASEN - N) * q);
  }

  /* A GAP IS ENOUGH TO SEE A BOARD CHANGE THROUGH, and density always leaves
     gaps. The last stretch saturates to a solid veil so the swap is genuinely
     unseen — "very dense" is not the same as opaque. */
  function veil(k){
    if (k <= 0.80) return 0;
    return Math.min(1, Math.pow((k - 0.80) / 0.20, 1.15));
  }

  var vEl = $("bwVeil");
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;
  /* THE SKY'S CLOCK STARTS NOW, NOT ON THE FIRST FRAME. Every other stage of
     the event is scheduled on setTimeout, which keeps running whatever the
     compositor is doing — but requestAnimationFrame does not, so taking t0
     from the first callback meant the ramp began whenever the first frame
     happened to be produced. Any hitch at the start and the veil is no
     longer over the swap it exists to hide. performance.now() shares rAF's
     time origin, so this is the same clock, just read earlier. */
  bwSkyT0 = performance.now();
  if (bwSkyRaf) cancelAnimationFrame(bwSkyRaf);

  function frame(now){
    var el = still ? peakEnd + sched.clear : now - bwSkyT0;
    var k = level(el);
    var n = Math.min(N, count(el));
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = "round";
    for (var j=0;j<n;j++){
      var z = st[j];
      var cyc = z.dur + z.gap;                /* CONSTANT: see above */
      var p = ((el + z.off) % cyc) / z.dur;
      if (p > 1) continue;                    /* resting between crossings */
      var head = -z.tail + p * (1 + z.tail);
      var a = Math.max(0, head - z.tail), b = Math.min(1, head);
      if (b <= a) continue;
      ctx.strokeStyle = "hsl(" + z.hue + " 96% " + (66 + 24*k).toFixed(0) + "%)";
      ctx.lineWidth = z.w * (1 + 2.6 * k);
      for (var q=0;q<3;q++){
        var f = [0, 0.45, 0.78][q], s0 = a + (b - a) * f;
        if (b <= s0) continue;
        ctx.globalAlpha = [0.22, 0.5, 0.95][q];
        ctx.beginPath();
        ctx.moveTo(z.x0 + z.ux*z.len*s0, z.y0 + z.uy*z.len*s0);
        ctx.lineTo(z.x0 + z.ux*z.len*b,  z.y0 + z.uy*z.len*b);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    if (vEl) vEl.style.opacity = veil(k).toFixed(3);
    if (!still) bwSkyRaf = requestAnimationFrame(frame);
  }
  bwSkyRaf = requestAnimationFrame(frame);
}

/* ══════════════ THE DRAW ARRIVES AS SOMETHING, NOT AS A CLASS ═════════
   The numbers are stars now, so a number being drawn should look like one
   star hitting another. A comet is fired at each drawn tile, timed to arrive
   exactly as the tile turns over, travelling along the same diagonal the
   storm does so it reads as part of the same weather.

   What it does on arrival is the whole point:
     a number you own  -> it LANDS. Impact flash, expanding ring, and it
                          stays on the tile while the number lights up.
     a number you don't -> it PUNCHES THROUGH and keeps going, dimming as it
                          leaves, with only a faint ripple left behind.

   So ten comets come in and you can see which ones stuck. */
var bwShots = [], bwShotRaf = null, bwParts = [], bwPartLast = 0;

/* BULLET HELL. Thirty shards thrown along fixed arcs is a firework; what this
   wants is a screen full of independent projectiles, each with its own
   heading, speed, size and colour, flying until they leave. They are
   integrated rather than parameterised — position from velocity, velocity
   from drag — which is why they spread unevenly and read as debris instead
   of as a pattern. */
/* `reach` scales how far the debris throws, and defaults to 1 so every
   existing call is untouched. The mine needs it: the same burst that reads as
   one tile shattering on a forty-tile board covers the entire viewport on a
   four-tile one, and particle COUNT does not control that — velocity does. */
function bwBurst(x, y, n, reach){
  reach = reach || 1;
  for (var i=0;i<n;i++){
    var a = Math.random() * 6.2832;
    /* biased so most are fast and a few crawl - an even spread looks like a
       ring expanding, not like something being blown apart */
    var sp = (300 + Math.pow(Math.random(), 0.45) * 2600) * reach;
    bwParts.push({ x:x, y:y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      hue: Math.floor(Math.random()*360),
      r: 1.4 + Math.random()*3.8,
      life: 0, max: 0.85 + Math.random()*1.25 });
  }
}
var bwKnocked = null;   /* tiles the storm has cleared away */

function bwShotsStart(){
  var cv = $("bwShots");
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext("2d");
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var W = window.innerWidth, H = window.innerHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bwShots = [];
  if (bwShotRaf) cancelAnimationFrame(bwShotRaf);

  function frame(now){
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    var dt = bwPartLast ? Math.min(0.05, (now - bwPartLast) / 1000) : 0.016;
    bwPartLast = now;
    ctx.lineCap = "round";
    for (var pi=bwParts.length-1; pi>=0; pi--){
      var q = bwParts[pi];
      q.life += dt;
      if (q.life >= q.max){ bwParts.splice(pi,1); continue; }
      var px = q.x, py = q.y;
      q.x += q.vx*dt; q.y += q.vy*dt;
      var drag = 1 - 0.55*dt;
      q.vx *= drag; q.vy *= drag;
      if (q.x < -80 || q.x > W+80 || q.y < -80 || q.y > H+80){
        bwParts.splice(pi,1); continue;
      }
      var f = 1 - q.life/q.max;
      ctx.globalAlpha = Math.min(1, f*1.4);
      ctx.strokeStyle = "hsl(" + q.hue + " 100% " + (62 + 22*f).toFixed(0) + "%)";
      ctx.lineWidth = q.r*f + 0.5;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(q.x, q.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (var i=bwShots.length-1;i>=0;i--){
      var sh = bwShots[i], el = now - sh.t0;
      if (el < 0) continue;
      var p = el / sh.fly;

      if (p < 1){                                   /* inbound */
        /* ACCELERATING, NOT SMOOTHSTEP. Ease-out spends the last fifth of
           the flight crawling the last tenth of the distance — the head sits
           almost stationary on the target, which reads as a little marker
           appearing before the landing and then slotting into place. A comet
           should arrive at speed. */
        var e = p * (0.55 + 0.45*p);
        var x = sh.x0 + (sh.tx - sh.x0)*e, y = sh.y0 + (sh.ty - sh.y0)*e;
        drawComet(ctx, x, y, sh, 1);
      } else {
        var q = (el - sh.fly) / sh.after;
        if (q >= 1){ bwShots.splice(i,1); continue; }
        if (sh.pick){
          /* A SUPERNOVA, AND THEN NOTHING. The comet's job is to deliver the
             hit; the number lighting up is the result, so nothing is left
             sitting on the tile afterwards. But the delivery itself should be
             violent — a hard core, two shockwaves running out at different
             rates, and shards thrown through the whole circle rather than in
             a polite arc along the line of travel. */
          var fl = Math.max(0, 1 - q/0.20);            /* core, gone at once */
          if (fl > 0){
            var rad = sh.size * (4 + 5*(1-fl));
            var g2 = ctx.createRadialGradient(sh.tx,sh.ty,0,sh.tx,sh.ty,rad);
            g2.addColorStop(0, "rgba(255,255,255," + (1*fl).toFixed(3) + ")");
            g2.addColorStop(.35, "rgba(255,255,255," + (0.8*fl).toFixed(3) + ")");
            g2.addColorStop(.7, "hsla(" + sh.hue + ",100%,80%," + (0.55*fl).toFixed(3) + ")");
            g2.addColorStop(1, "hsla(" + sh.hue + ",100%,62%,0)");
            ctx.globalAlpha = 1; ctx.fillStyle = g2;
            ctx.fillRect(sh.tx-rad, sh.ty-rad, rad*2, rad*2);
          }
          /* two shockwaves, the second chasing the first */
          for (var w2=0;w2<2;w2++){
            var qq = w2 ? Math.max(0, q - 0.14) : q;
            var rr = Math.pow(qq, 0.34) * sh.size * (w2 ? 15 : 24);
            var ra = Math.max(0, 1 - q/(w2 ? 0.85 : 0.6));
            if (ra <= 0 || rr <= 0) continue;
            ctx.globalAlpha = ra * (w2 ? 0.55 : 0.95);
            ctx.strokeStyle = "hsl(" + ((sh.hue + w2*40) % 360) + " 100% " + (w2?72:84) + "%)";
            ctx.lineWidth = (w2 ? 3 : 6.5) * ra + 0.6;
            ctx.beginPath(); ctx.arc(sh.tx, sh.ty, rr, 0, 6.2832); ctx.stroke();
          }
          /* and the shards, all the way round */
          var SH = 30, sa = Math.max(0, 1 - q/0.92);
          if (sa > 0){
            ctx.lineCap = "round";
            for (var k2=0;k2<SH;k2++){
              var ang = sh.spin + k2 * (6.2832/SH);
              var spd = 0.55 + (k2 % 5) * 0.20;
              var d0 = sh.size*2 + Math.pow(q, 0.42) * sh.size * 30 * spd;
              var d1 = d0 + sh.size * (3.4 + (k2 % 4) * 1.9) * sa;
              ctx.globalAlpha = sa * (0.55 + (k2 % 3) * 0.18);
              ctx.lineWidth = (2.6 + (k2 % 3) * 0.9) * sa + 0.4;
              ctx.strokeStyle = "hsl(" + ((sh.hue + k2*11) % 360) + " 100% 74%)";
              ctx.beginPath();
              ctx.moveTo(sh.tx + Math.cos(ang)*d0, sh.ty + Math.sin(ang)*d0);
              ctx.lineTo(sh.tx + Math.cos(ang)*d1, sh.ty + Math.sin(ang)*d1);
              ctx.stroke();
            }
          }
        } else {
          /* it went straight through and is leaving */
          var ox = sh.tx + sh.ux * q * 520, oy = sh.ty + sh.uy * q * 520;
          drawComet(ctx, ox, oy, sh, 1-q);
          ctx.globalAlpha = (1-q) * 0.28;
          ctx.strokeStyle = "hsl(" + sh.hue + " 90% 70%)";
          ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.arc(sh.tx, sh.ty, 8 + q*34, 0, 6.2832); ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    bwShotRaf = requestAnimationFrame(frame);
  }
  bwShotRaf = requestAnimationFrame(frame);
}

function drawComet(ctx, x, y, sh, fade){
  var tl = sh.size * 32;
  var g = ctx.createLinearGradient(x - sh.ux*tl, y - sh.uy*tl, x, y);
  g.addColorStop(0, "hsla(" + sh.hue + ",100%,65%,0)");
  g.addColorStop(1, "hsla(" + sh.hue + ",100%,72%," + (0.85*fade).toFixed(3) + ")");
  ctx.strokeStyle = g;
  ctx.lineWidth = sh.size * 1.5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x - sh.ux*tl, y - sh.uy*tl);
  ctx.lineTo(x, y);
  ctx.stroke();
  var hd = ctx.createRadialGradient(x, y, 0, x, y, sh.size*2.6);
  hd.addColorStop(0, "rgba(255,255,255," + (0.98*fade).toFixed(3) + ")");
  hd.addColorStop(.35, "hsla(" + sh.hue + ",100%,76%," + (0.7*fade).toFixed(3) + ")");
  hd.addColorStop(1, "hsla(" + sh.hue + ",100%,62%,0)");
  ctx.fillStyle = hd;
  ctx.fillRect(x - sh.size*2.6, y - sh.size*2.6, sh.size*5.2, sh.size*5.2);
}

/* Fired ahead of the tile turning over, so it ARRIVES on the beat. */
function bwShotFire(tileNo, isPick){
  var el = $("board").querySelector('.kt[data-t="' + tileNo + '"]');
  if (!el) return;
  var r = el.getBoundingClientRect();
  var tx = r.left + r.width/2, ty = r.top + r.height/2;
  /* THE SAME DIAGONAL THE STARFALL ACTUALLY TRAVELS. This was hand-picked at
     -0.38 while the sky averages about -0.21, so the comets cut across the
     storm at a visibly steeper angle instead of running with it. Deriving it
     from the sky's own run/rise constants means the two cannot drift apart
     again. */
  var W = window.innerWidth, H = window.innerHeight;
  var ang = Math.atan2(-H * 0.525, W * 1.125);       /* the sky's own angle */
  var ux = Math.cos(ang), uy = Math.sin(ang);
  var D = Math.max(W, H) * 1.05;
  bwShots.push({
    t0: performance.now(), fly: BW.shotFly, after: isPick ? 980 : 430,
    spin: Math.random() * 6.2832,
    x0: tx - ux*D, y0: ty - uy*D, tx: tx, ty: ty, ux: ux, uy: uy,
    /* A MISS IS STILL AN EVENT. These were half the size of a hit and
       essentially invisible, which made nine of the ten numbers arrive with
       nothing at all. Both are big now — what separates them is what happens
       when they get there, not how much you can see on the way in. */
    hue: isPick ? (140 + Math.random()*90) : (198 + Math.random()*46),
    size: isPick ? 10.5 : 8.4, pick: isPick
  });
}
/* THE SHOCKWAVE BELONGS TO THE IMPACT, NOT TO THE APPROACH. A blast with no
   inbound comet — `fly:1` puts it straight into the burst phase — and much
   larger than the ones the reveal throws, because this is the moment the
   whole event has been building toward. */
function bwBoom(x, y, size, hue){
  bwShots.push({
    t0: performance.now(), fly: 1, after: 1500,
    x0: x, y0: y, tx: x, ty: y, ux: 1, uy: 0,
    hue: hue, size: size, pick: true, spin: Math.random()*6.2832
  });
}

/* THE MESH GIVES WAY. A ring travelling outward from the impact, shoving
   each tile away from the point and shrinking it as it passes — the grid
   reads as a surface being struck rather than a picture with something
   drawn on top of it. Transforms do not affect layout, so nothing reflows;
   they are written inline and cleared at the end, and paintBoard only ever
   writes className, so a repaint mid-wave cannot wipe them. */
var bwMeshRaf = null;
/* `spatial` scales every DISTANCE in here — the throat, the travelling front,
   its width, and the pull and depth the tiles are shoved by — and defaults to
   1, which is the takeover's own wave to the pixel.

   IT IS NOT DECORATION FOR A SMALL BOARD. The throat radius is 250px and a
   2x2 board is 121px wide, so EVERY tile sits inside the throat: `well` is
   ~1 for all four, they are all pulled and sunk by the same amount, and the
   grid translates as one block. It reads as the board being zoomed, not as a
   surface being struck — the crowding that makes it a funnel needs tiles both
   inside the throat and outside it. */
function bwMeshWave(cx, cy, ms, spatial){
  var board = $("board");
  if (!board || !board.children.length) return;
  var sp0 = spatial > 0 ? spatial : 1;
  var sc = board.offsetWidth ? (board.getBoundingClientRect().width / board.offsetWidth) : 1;
  if (!(sc > 0)) sc = 1;
  var geo = [];
  for (var i=0;i<board.children.length;i++){
    var el = board.children[i], r = el.getBoundingClientRect();
    geo.push({ el: el, x: r.left + r.width/2, y: r.top + r.height/2 });
  }
  if (bwMeshRaf) cancelAnimationFrame(bwMeshRaf);
  var t0 = performance.now();
  function step(now){
    var p = (now - t0) / ms;
    if (p >= 1){
      for (var j=0;j<geo.length;j++) geo[j].el.style.removeProperty("transform");
      bwMeshRaf = null;
      return;
    }
    /* A GRAVITY WELL, NOT A DENT. A gaussian bump is a shallow, wide
       depression; the funnel it should look like is deep, narrow, and falls
       off as an inverse square, with the cells crowding hard into the throat
       and the far grid staying nearly flat.

           w = R^2 / (d^2 + R^2)

       is 1 at the centre and ~R^2/d^2 far out, which is that shape. Cells are
       pulled toward the throat by it and shrink by it, so the ones nearest
       the impact collapse almost to nothing while the outer grid barely
       moves — the crowding IS the funnel. A little extra downward drift sells
       it as sagging rather than merely converging.

       It forms fast, HOLDS at full depth for a beat, and then springs back —
       the hold is what makes it read as the fabric being pushed and letting
       go, instead of a ripple passing through. */
    var env;
    if (p < 0.10)      env = p / 0.10;                 /* punched in */
    else if (p < 0.30) env = 1;                        /* held at full depth */
    else { var q2 = p - 0.30; env = Math.exp(-q2*5.5) * Math.cos(q2*7.2); }

    var R = 250 * sp0;                                 /* throat radius, px */
    var front = Math.pow(p, 0.58) * 1250 * sp0;
    var decay = Math.pow(1 - p, 1.5);

    for (var k=0;k<geo.length;k++){
      var g = geo[k];
      var dx = g.x - cx, dy = g.y - cy;
      var d = Math.hypot(dx, dy) || 0.001;

      var well = (R*R) / (d*d + R*R) * env;            /* the funnel */
      var zz = (d - front) / (190 * sp0);
      var ring = Math.exp(-zz*zz) * decay;             /* the wave on top */

      var pull = (-well * 52 + ring * 32) * sp0;       /* in, then out */
      var depth = (well * 620 + ring * 110) * sp0;     /* AWAY from the eye */
      /* the slope of the well is what each tile leans down into. It is
         steepest partway out, not at the throat, which is exactly where a
         funnel's wall is most visible. */
      var slope = (2 * R*R * d) / ((d*d + R*R) * (d*d + R*R)) * env;
      /* NEGATED. rotate3d about (-ny, nx) by a POSITIVE angle tips the edge
         nearest the throat toward the viewer, which is the funnel inside
         out — the tile leans out of the hole instead of down into it. */
      var tilt = -Math.max(-44, Math.min(44, slope * 7400));
      var nx = dx/d, ny = dy/d;

      if (Math.abs(pull) < 0.4 && depth < 0.6 && Math.abs(tilt) < 0.25){
        if (g.el.style.transform) g.el.style.removeProperty("transform");
        continue;
      }
      g.el.style.transform =
        "translate3d(" + (nx*pull/sc).toFixed(2) + "px," +
        (ny*pull/sc).toFixed(2) + "px," + (-depth).toFixed(1) + "px)" +
        " rotate3d(" + (-ny).toFixed(3) + "," + nx.toFixed(3) + ",0," +
        tilt.toFixed(2) + "deg)";
    }
    bwMeshRaf = requestAnimationFrame(step);
  }
  bwMeshRaf = requestAnimationFrame(step);
}
function bwMeshStop(){
  if (bwMeshRaf){ cancelAnimationFrame(bwMeshRaf); bwMeshRaf = null; }
  var board = $("board");
  if (board) for (var i=0;i<board.children.length;i++)
    board.children[i].style.removeProperty("transform");
}

function bwShotsStop(){
  if (bwShotRaf){ cancelAnimationFrame(bwShotRaf); bwShotRaf = null; }
  bwShots = []; bwParts = []; bwPartLast = 0;
  var cv = $("bwShots");
  if (cv && cv.getContext) cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
}

function bwSkyStop(){
  if (bwSkyRaf){ cancelAnimationFrame(bwSkyRaf); bwSkyRaf = null; }
  var vEl = $("bwVeil"); if (vEl) vEl.style.opacity = 0;
  bwSkyT0 = 0;
  var cv = $("bwSky");
  if (cv && cv.getContext) cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
}

/* THE GEM WINDS UP AS ITS NUMBER CLIMBS. JS drives the spin for this stretch
   rather than CSS, because accelerating a CSS animation means rewriting
   animation-duration mid-flight and it visibly jumps every time you do. A
   transform per frame does not. #ballFx is a zero-size anchor whose children
   translate outward, so scaling it makes every spark reach further. */
/* ══════════════ THE CUE THAT SAYS IT IS ABOUT TO HAPPEN ═══════════════
   Synthesised, not sampled: no asset to ship, no licence to worry about, and
   it starts on the same clock as everything else instead of after a fetch.

   The texture is the obvious one to borrow — a low unresolved chord under an
   accelerating pulse. It works because the pulse is doing the talking: it
   starts slow enough to ignore and ends too fast to, so you know something is
   coming before you have been told anything. The chord underneath deliberately
   never resolves (root, fifth, octave, and a suspended fourth on top), so the
   tension has nowhere to go until the win itself pays it off. */
var bwVoices = [];
function bwVoice(ac, type, freq, t0, dur, peak, attack){
  var o = ac.createOscillator(), g = ac.createGain();
  var rel = Math.min(1.4, dur * 0.35);
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + Math.min(attack, dur - rel));
  g.gain.setValueAtTime(peak, t0 + dur - rel);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
  bwVoices.push(o);
}

function bwPrelude(){
  if (S.muted) return;
  var ac = audio(); if (!ac) return;
  if (ac.state === "suspended") ac.resume();
  var t = ac.currentTime + 0.02, LEAD = 9.5;

  /* the floor it all stands on */
  bwVoice(ac, "sine", 55.00, t,        LEAD,       0.155, 2.0);
  bwVoice(ac, "sine", 82.41, t + 0.10, LEAD - 0.1, 0.085, 2.4);

  /* the chord that asks a question and never answers it */
  bwVoice(ac, "triangle", 110.00, t + 0.15, LEAD - 0.2, 0.072, 2.6);
  bwVoice(ac, "triangle", 164.81, t + 0.35, LEAD - 0.4, 0.055, 2.9);
  bwVoice(ac, "sine",     220.00, t + 0.55, LEAD - 0.6, 0.048, 3.2);
  bwVoice(ac, "sine",     293.66, t + 1.05, LEAD - 1.1, 0.040, 3.4);   /* sus4 */

  /* THE CLOCK — 1.7 a second up to about nine */
  var at = 0.05, gap = 0.58;
  while (at < LEAD - 0.7){
    tone(1174.66, at,        0.055, 0.030, "sine");
    tone(587.33,  at + 0.004, 0.080, 0.021, "triangle");
    at += gap;
    gap *= 0.893;
    if (gap < 0.108) gap = 0.108;
  }

  /* and something climbing over the top of it */
  var sw = ac.createOscillator(), sg = ac.createGain();
  sw.type = "sine";
  sw.frequency.setValueAtTime(330, t + 0.4);
  sw.frequency.exponentialRampToValueAtTime(1760, t + LEAD * 0.82);
  sg.gain.setValueAtTime(0.0001, t + 0.4);
  sg.gain.linearRampToValueAtTime(0.024, t + LEAD * 0.58);
  sg.gain.exponentialRampToValueAtTime(0.0001, t + LEAD);
  sw.connect(sg); sg.connect(ac.destination);
  sw.start(t + 0.4); sw.stop(t + LEAD + 0.05);
  bwVoices.push(sw);
}
function bwAudioStop(){
  for (var i=0;i<bwVoices.length;i++){ try { bwVoices[i].stop(); } catch(e){} }
  bwVoices = [];
}

/* THE MULTIPLIER RUNS ON A CLOCK, NOT ON THE TILES.

   It was driven by absorptions — each square that arrived raised a target and
   the number lurched toward it. Two things were wrong with that and both were
   visible: between arrivals the figure sat completely still, and the floor
   added to stop it stalling ran on its own schedule, so it could reach the
   final number while a square was still in the air.

   A constant rate has neither problem. The tiles are what it looks like; the
   clock is what it is. LINEAR, not eased — an ease is exactly the "stuck at
   certain values" complaint in a politer form, because it crawls at both
   ends. */

function bwGemRamp(ms, mult){
  var art = $("ballArt"), fx = $("ballFx"), lab = $("ballMultText");
  if (!art || !fx || !lab) return;
  art.style.animation = "none";
  fx.style.animation  = "none";
  var t0 = 0, last = 0, aArt = 0, aFx = 0;
  function step(now){
    if (!t0){ t0 = now; last = now; }
    var dt = Math.min(64, now - last); last = now;
    var e = Math.min(1, (now - t0) / ms);
    lab.textContent = Math.round(mult * e).toLocaleString() + "×";
    /* FAST FROM THE MOMENT IT LANDS, faster with every tile it eats.
       This was `40 + 960*e*e`, and `e` starts at zero — so a gem that had
       just punched a crater in the board then turned at 40 degrees a second,
       one revolution every nine seconds, until the multiplier had climbed far
       enough for the squared term to bite. It read as stalled.

       380 is already better than a revolution a second at the instant of
       impact, and it is LINEAR in `e` now rather than squared, so each square
       absorbed shows up as its own step in the spin instead of being lost in
       a curve that stays flat for the first half. */
    var spin = 380 + 1500 * e;                          /* degrees a second */
    aArt = (aArt + spin * dt / 1000) % 360;
    aFx  = (aFx  + spin * 0.42 * dt / 1000) % 360;
    art.style.transform = "rotate(" + aArt.toFixed(1) + "deg)";
    fx.style.transform  = "rotate(" + aFx.toFixed(1) + "deg) scale(" +
                          (0.5 + 0.95 * e).toFixed(3) + ")";
    fx.style.opacity = (0.45 + 0.55 * e).toFixed(3);
    bwGemRaf = requestAnimationFrame(step);            /* holds at full after */
  }
  bwGemRaf = requestAnimationFrame(step);
}
/* ═══════════ THE GEM DOES NOT FIRE ONCE AND THEN SIT THERE ════════════
   The impact was six shells and then nothing, while the multiplier wound up
   and four seconds of money counted underneath a gem that had gone still.
   This keeps it throwing shells the whole way, growing as the number climbs,
   and stops shortly before the count does so the last beat can land clean.

   Deliberately much lighter than the impact — that one is ~925 projectiles
   in six waves inside 700ms, and repeating anything near it for seven
   seconds would bury the frame rate. Position is read live because the gem
   is moving while this runs. */
var bwPulseTimer = null;
function bwGemPulseStart(runMs){
  bwGemPulseStop();
  var t0 = performance.now();
  bwPulseTimer = setInterval(function(){
    var el = $("ball");
    if (!el || el.hidden){ bwGemPulseStop(); return; }
    var r = el.getBoundingClientRect();
    if (!r.width){ return; }
    var p = Math.min(1, (performance.now() - t0) / runMs);
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    bwBoom(cx, cy, 9 + 17 * p, Math.random() * 360);
    bwBurst(cx, cy, Math.round(35 + 85 * p));
    if (performance.now() - t0 >= runMs) bwGemPulseStop();
  }, 235);
}
function bwGemPulseStop(){
  if (bwPulseTimer){ clearInterval(bwPulseTimer); bwPulseTimer = null; }
}

/* ═══════════ AND THE BOARD MOVES UNDER THE PLATE WHILE IT COUNTS ══════
   MOVE THE CAMERA, NOT THE GEM. Translating `#ball` alone centred the gem and
   left the grid behind, so it floated off its own tile and sat over its
   neighbours. What belongs under the plate is the TILE it landed on, with
   everything still attached.

   DRIVEN BY requestAnimationFrame, NOT A CSS TRANSITION, and that is the
   whole reason this works. Two earlier attempts did not move the board at
   all: the first changed `--bwdx` and relied on `transition:transform` to
   notice, which it does not reliably do when the transform is BUILT from the
   var; the second wrote `transform` inline and transitioned that, which was
   fine but made every measurement taken straight afterwards read the START of
   a 3.2s interpolation — so it looked identical to doing nothing, twice.

   Writing the transform every frame removes both questions. `bwGemRamp` is
   already an rAF loop over exactly this window, so the cost is one more
   assignment per frame.

   Horizontal only: `#bwPop` is `left:50%` and nothing else about it moves, so
   X is all of the alignment. Dragging Y would only pull the grid off the
   vertical centre it was carefully put on. */
/* ═══════════ THE BOARD IS EATEN BY THE GEM ════════════════════════════
   Every number the draw took flies into the gem, one after another, and each
   one it swallows pushes the multiplier further up. The board ends as a
   single tile with everything else's worth folded into it.

   Positions come from LAYOUT — `offsetLeft`, not `getBoundingClientRect` —
   for the same reason `bwGemCenter` does: `bwMeshWave` has inline transforms
   on these tiles and a rect would report where the gravity well shoved them,
   not where they live. Layout is transform-proof, and the offsets are already
   in the board's own coordinate space, which is exactly what a transform on
   the tile needs.

   Starts AFTER the mesh is finished (`BALL_CRASH_GEM` + 1150ms) so the two
   are never writing the same tile's transform in the same frame. */
var bwEatTimers = [];
/* FIXED PACE, NOT A WINDOW TO FILL. Two squares take two seconds and nine
   take eight; the count decides how long it lasts, not how fast each one
   moves. Dividing a window between them meant a lone survivor sat on the
   board for thirteen seconds waiting on a clock before it deigned to move,
   which is the one thing this must never look like.

   The flight is longer than the gap, so the next is always already on its
   way before the last has landed — that holds at any count, because neither
   number depends on it. */
/* ── PACED FOR SIX, BECAUSE SEVEN DOES NOT HAPPEN ─────────────────────
   Ten picks against ten drawn from forty is hypergeometric, and the gem eats
   every hit except the tile it landed on. Computed exactly:

       0 absorbed  16.9%      3 absorbed  14.7%
       1 absorbed  31.1%      4 absorbed   4.2%
       2 absorbed  28.8%      5 absorbed   0.7%

   Mean 1.54. Six or more is 1 in 1,672 draws, and more than six is 1 in
   42,647 — before the 1-in-4,000 for the gem itself. So the sizing question
   is "how slow can six be", not nine, and that buys a much longer flight.

   3.25s in the air, 2.6s apart: one square takes 3.25s, two 5.85s, six
   16.25s — just inside the 16.31s window. The 650ms overlap means the next
   is always already moving.

   COMPRESSED IF THE IMPOSSIBLE HAPPENS. At seven or more this would run past
   the end of the celebration and `bwClear` would cut squares off mid-flight,
   so the pace tightens to fit rather than being truncated. */
var BW_EAT_GAP = 2600, BW_EAT_FLY = 3250, BW_EAT_WINDOW = 16310;
function bwGemEatStart(fromTiles, gemTile){
  bwGemEatStop();
  var board = $("board");
  if (!board || !fromTiles.length) return;
  var gem = board.querySelector('.kt[data-t="' + gemTile + '"]');
  if (!gem) return;
  var gx = gem.offsetLeft + gem.offsetWidth / 2,
      gy = gem.offsetTop  + gem.offsetHeight / 2;
  var n = fromTiles.length, each = BW_EAT_GAP, fly = BW_EAT_FLY;
  var want = (n - 1) * each + fly;
  if (want > BW_EAT_WINDOW){                      /* 1 in 42,647; scale, do not truncate */
    var k = BW_EAT_WINDOW / want;
    each *= k; fly *= k;
  }

  for (var i = 0; i < n; i++){
    (function(no, idx){
      bwEatTimers.push(setTimeout(function(){
        var el = board.querySelector('.kt[data-t="' + no + '"]');
        if (!el) return;
        var dx = gx - (el.offsetLeft + el.offsetWidth / 2),
            dy = gy - (el.offsetTop  + el.offsetHeight / 2);
        el.style.transition = "transform " + fly + "ms cubic-bezier(.5,-0.2,.7,1), opacity " +
                              fly + "ms ease-in";
        el.style.transform = "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) +
                             "px) scale(.18) rotate(180deg)";
        el.style.opacity = "0";
        bwEatTimers.push(setTimeout(function(){
          /* it has arrived: take it off the board, and pay for it */
          if (bwKnocked) bwKnocked[no] = 1;
          el.style.removeProperty("transition");
          el.style.removeProperty("transform");
          el.style.removeProperty("opacity");
          paintBoard();
          var r = el.getBoundingClientRect();
          var b = board.getBoundingClientRect();
          var cx = b.left + gx * (b.width / (board.offsetWidth || 1));
          var cy = b.top  + gy * (b.height / (board.offsetHeight || 1));
          bwBoom(cx, cy, 16 + 10 * (idx / n), Math.random() * 360);
          bwBurst(cx, cy, 90 + Math.round(60 * (idx / n)));
          if (!S.muted) ping(idx + 1, 3);
        }, fly));
      }, Math.round(idx * each)));
    })(fromTiles[i], i);
  }
}
function bwGemEatStop(){
  for (var i = 0; i < bwEatTimers.length; i++) clearTimeout(bwEatTimers[i]);
  bwEatTimers = [];
  var board = $("board");
  if (board) for (var q = 0; q < board.children.length; q++){
    board.children[q].style.removeProperty("transition");
    board.children[q].style.removeProperty("opacity");
  }
}

var bwCentreRaf = null;
function bwGemCenter(ms){
  bwGemCenterStop();
  var card = $("boardCard"), board = $("board");
  if (!card || !board || !activeBall) return;
  var tile = board.querySelector('.kt[data-t="' + activeBall.tile + '"]');
  if (!tile) return;
  var br = board.getBoundingClientRect();
  if (!br.width || !board.offsetWidth) return;

  /* ── MEASURE THE TILE FROM LAYOUT, NOT FROM ITS RECT ─────────────────
     `bwMeshWave` runs for 1150ms from the impact and this fires 460ms into
     that, so every tile is carrying an inline transform when we look — the
     gravity well shoves them outward by as much as 300px. A
     `getBoundingClientRect` therefore reports where the tile has been PUSHED
     to, not where it lives, and centring on that put the board somewhere
     nobody asked for. It read as "still off centre", which is exactly what
     it was.

     `offsetLeft` and `offsetWidth` are layout values and transforms do not
     touch them, so they give the tile's real home. Map it through the
     board's own rect to get screen pixels. */
  var gsc = br.width / board.offsetWidth;
  var tileCentre = br.left + (tile.offsetLeft + tile.offsetWidth / 2) * gsc;

  var dy = parseFloat(card.style.getPropertyValue("--bwdy")) || 0;
  var sc = parseFloat(card.style.getPropertyValue("--bwscale")) || 1;
  var from = parseFloat(card.style.getPropertyValue("--bwdx")) || 0;
  var to = from + (window.innerWidth / 2 - tileCentre);
  if (Math.abs(to - from) < 1) return;
  /* the CSS rule builds the transform from the vars; writing it inline
     overrides that, so the two must not both be in play */
  card.style.removeProperty("transition");

  /* ── AND THE PLATE COMES DOWN TO MEET IT ─────────────────────────────
     `bwFitBoard` anchors the plate to the top of the GRID, which is the
     right answer while the grid is full and the wrong one by the time the
     amount appears — every tile but this one has migrated away, so the plate
     was left hanging over empty space with the gem far below it.

     Anchored to the multiplier label instead, so it sits just above the
     number it belongs to and follows the gem to whatever row it landed on.
     Clamped so it still cannot leave the top of the screen. */
  var lab = $("ballMultText"), pop = $("bwPop");
  if (lab && pop){
    var lr = lab.getBoundingClientRect();
    if (lr.height){
      var want = Math.round(lr.top - 34);
      var floor = pop.offsetHeight + 20;
      document.documentElement.style.setProperty("--bwpoptop",
        Math.max(floor, want) + "px");
    }
  }

  var t0 = 0;
  function step(now){
    if (!t0) t0 = now;
    var p = Math.min(1, (now - t0) / ms);
    var e = p * p * (3 - 2 * p);                 /* same ease as the wind-up */
    var x = from + (to - from) * e;
    card.style.transform = "translate(" + x.toFixed(1) + "px," + dy +
                           "px) scale(" + sc + ")";
    if (p < 1) bwCentreRaf = requestAnimationFrame(step);
    else { bwCentreRaf = null; card.style.setProperty("--bwdx", Math.round(to) + "px"); }
  }
  bwCentreRaf = requestAnimationFrame(step);
}
function bwGemCenterStop(){
  if (bwCentreRaf){ cancelAnimationFrame(bwCentreRaf); bwCentreRaf = null; }
}

function bwGemStop(){
  if (bwGemRaf){ cancelAnimationFrame(bwGemRaf); bwGemRaf = null; }
  var art = $("ballArt"), fx = $("ballFx");
  if (art){ art.style.removeProperty("animation"); art.style.removeProperty("transform"); }
  if (fx){ fx.style.removeProperty("animation"); fx.style.removeProperty("transform");
           fx.style.removeProperty("opacity"); }
}

function bwCountUp(target, ms){
  var el = $("bwAmt"), t0 = null;
  /* requestAnimationFrame DOES NOT RUN IN A BACKGROUND TAB — and unlike
     setTimeout it is not merely throttled, it is suspended outright. The
     money is awarded by settle() either way, but without this the plate
     would sit reading $0.00 for anyone whose tab was not focused when the
     ball landed. The timer is the guarantee; the animation is the nicety. */
  bwTimers.push(setTimeout(function(){ el.textContent = money(target); }, ms));
  function step(ts){
    if (!t0) t0 = ts;
    var p = Math.min(1, (ts - t0) / ms);
    var e = 1 - Math.pow(1 - p, 2.2);          /* sprints, then lands */
    el.textContent = money(Math.round(target * e));
    if (p < 1) bwRaf = requestAnimationFrame(step);
  }
  bwRaf = requestAnimationFrame(step);
}

/* Measured BEFORE body.bw grows anything, and measured on the GRID: the
   card carries dead chrome above and below that must not get a vote in
   either the scale or the centring. Scaling about the grid's own centre
   keeps it still under the scale, so the translate that follows lands it
   exactly on the middle of the screen. */
function bwFitBoard(){
  /* HIDE THE SCROLLBAR BEFORE MEASURING, NOT AFTER. body.bw sets
     overflow:hidden, which widens the content area by the scrollbar and
     shifts centred content right by half of it — measure first and the board
     lands 8px off centre. Same scrollbar trap as before, one step earlier. */
  document.body.style.overflow = "hidden";
  var card = $("boardCard"), grid = $("board"), st = card.style;
  st.removeProperty("--bwdx"); st.removeProperty("--bwdy");
  st.removeProperty("--bwscale"); st.removeProperty("--bwox"); st.removeProperty("--bwoy");
  var g = grid.getBoundingClientRect(), c = card.getBoundingClientRect();
  if (!g.width || !c.width) return;
  /* THE GRID IS CENTRED, FULL STOP. Reserving a strip above it pushed the
     board visibly low for the whole event, and the plate that strip existed
     for is only on screen for the last few seconds — the thing you spend
     thirty seconds looking at should not sit off-centre to make room for
     something that is not there yet. The plate anchors to the grid's top
     edge instead, clamped so it cannot leave the screen; on a short window it
     rides closer to the first row, which is the right thing to give up. */
  var pad = 104;
  var H = window.innerHeight;
  var sc = Math.min(2.2, (H - pad) / g.height,
                         (window.innerWidth - pad) / g.width);
  if (!(sc > 1)) sc = 1;
  var gx = g.left + g.width / 2, gy = g.top + g.height / 2;
  var midY = H / 2;
  var gridTop = midY - (g.height * sc) / 2;
  /* THE CLAMP HAS TO KNOW HOW TALL THE PLATE IS. `#bwPop` is anchored by its
     BOTTOM edge — `translate(-50%,-100%)` — so it grows upward out of this
     number, and a floor of 96px was only ever safe while the type was 42px.
     At the size it is now the whole amount hung off the top of the screen.

     Measured rather than assumed, because the type is `clamp(...vw...)` and
     therefore different on every window. The element is laid out but
     `opacity:0` until `.on`, so this reads a real height without showing
     anything — that is why `hidden` comes off at the start of the sequence
     rather than when the plate appears. */
  var pop = $("bwPop");
  var popH = pop ? pop.offsetHeight : 0;
  /* +40 INTO the grid, not 22px clear of it. The plate does not appear until
     the count starts, and by then every tile except the gem's has migrated
     away — so the top of the grid is empty space and clearing it left the
     amount stranded at the top of the screen with a void beneath it. It can
     sit lower now precisely because there is nothing left up there to cover. */
  document.documentElement.style.setProperty("--bwpoptop",
    Math.max(popH + 20, Math.round(gridTop + 40)) + "px");
  st.setProperty("--bwox", (((gx - c.left) / c.width)  * 100).toFixed(2) + "%");
  st.setProperty("--bwoy", (((gy - c.top)  / c.height) * 100).toFixed(2) + "%");
  st.setProperty("--bwscale", sc.toFixed(3));
  st.setProperty("--bwdx", Math.round(window.innerWidth  / 2 - gx) + "px");
  st.setProperty("--bwdy", Math.round(midY - gy) + "px");
}

function bwClear(){
  bwSkyStop();
  bwShotsStop();
  bwMeshStop();
  bwKnocked = null;
  bwGemStop();
  bwGemPulseStop();
  bwGemCenterStop();
  bwGemEatStop();
  (function(){
     var b = $("ball");
     if (b){ b.style.removeProperty("transition"); b.style.removeProperty("transform"); }
     var c = $("boardCard");
     if (c){ c.style.removeProperty("transition"); c.style.removeProperty("transform"); }
   })();
  bwAudioStop();
  /* THE SCORE IS TORN DOWN HERE TOO, so the watchdog path puts the bed back
     as surely as the ordinary ending does. Leaving the cue running after a
     stranded takeover would be a thirty-second orchestral swell over an
     ordinary board with no way to stop it.

     The cue does not normally need stopping: it is 31.01s long and started
     `20.16 - landAt` seconds in, so it has `landAt + 10.85` seconds left —
     which is exactly the sequence's own remaining runtime at every pick
     count. It ends as the interface returns. This is for the other paths. */
  musicGemStop();
  /* not underneath a cue that is still ringing out — the bed comes back
     on its own when the buffer ends */
  if (!musicGemRinging()) musicBedStart();
  for (var i=0;i<bwTimers.length;i++) clearTimeout(bwTimers[i]);
  bwTimers = [];
  if (bwRaf){ cancelAnimationFrame(bwRaf); bwRaf = null; }
  document.body.classList.remove("bw");
  document.body.classList.remove("bwcover");
  document.body.classList.remove("bwinstant");
  document.body.classList.remove("bwsky");
  document.body.classList.remove("bwbig");
  document.body.classList.remove("bwout");
  $("bigwin").className = ""; $("bigwin").hidden = true;
  $("bwPop").className = ""; $("bwPop").hidden = true;
  document.body.style.removeProperty("overflow");
  var card = $("boardCard");
  card.className = "card";
  var v = ["--bwdx","--bwdy","--bwscale","--bwox","--bwoy"];
  for (var q=0;q<v.length;q++) card.style.removeProperty(v[q]);
}
function bwAt(ms, fn){ bwTimers.push(setTimeout(fn, ms)); }

function bigWinSequence(ball, d, hits, mult, payCents, done){
  bwSkyStart({ ramp: BW.ramp, peakHold: BW.peakHold, clear: BW.clear });
  bwShotsStart();
  $("bigwin").hidden = false;
  $("bwAmt").textContent = money(0);
  /* LAID OUT FROM THE START, INVISIBLE UNTIL ITS MOMENT. `hidden` is
     `display:none`, and an element with no box has no height for
     `bwFitBoard` to clamp against. Without `.on` it is still `opacity:0`,
     so nothing is shown early — only measurable. */
  $("bwPop").hidden = false;

  /* 1. THE ONLY THING THAT CHANGES IS THE SKY. Sound starts, streaks begin
        over the ordinary board — the interface is untouched and still lit.
        Nothing fades, because watching the room come apart is exactly what
        made the old opening look cheap.

        THE SCORE STARTS HERE, WITH THE STARS, and it is the whole of the
        sound now — `bwPrelude()` is the FALLBACK, not the opening act. The
        two cannot both have the first ten seconds: the prelude's pulse sits
        at 587 and 1175 Hz and its riser sweeps 330 to 1760 straight through
        anything the music puts there, and the version of this that ducked
        the music 16 dB to make room simply meant you could not hear it.

        So when the cue is loaded the music plays full-range from frame one,
        and when it is not — a blocked fetch, a slow decode, a muted game —
        the synthesised prelude carries the opening exactly as it always did.
        The takeover is never silent either way.

        WHAT THIS COSTS is the accelerating tick, 1.7 a second climbing to
        nine, which is the thing that said something was winding up. The
        music has no equivalent. If it is missed, the answer is to keep the
        pulse from `bwPrelude` and drop only its chord and riser, rather than
        to duck the music again. */
  var mine = S.picks.slice();
  var per = Math.max(240, Math.min(640, BW.pickWave / Math.max(1, mine.length)));
  var landAt = BW.ramp + BW.peakHold + BW.clear + BW.settle + BW.storm +
               BW.stormRest + mine.length * per + 260;
  /* `landAt` is when the gem SETS OFF; it reaches the board BALL_CRASH_GEM
     later, and that is what the bass was cut to land on. */
  var scored = musicGemPlay((landAt + BALL_CRASH_GEM) / 1000);
  /* 2.6s, not 1.2 — the cue ramps up over 1.5s from silence, so a bed
     that has already gone leaves a hole where the handover should be.
     Overlapping them is what makes it a crossfade rather than a cut. */
  if (scored) musicBedStop(2.6); else bwPrelude();

  document.body.classList.add("bwsky");
  document.body.classList.add("bwcover");        /* sky in FRONT for now */

  /* 2. inside the white, everything changes at once and none of it is seen */
  var swapAt = BW.ramp + Math.round(BW.peakHold * 0.35);
  bwAt(swapAt, function(){
    bwFitBoard();                                /* measure while still small */
    document.body.classList.add("bwinstant");    /* no transitions across this */
    document.body.classList.add("bw");
    document.body.classList.add("bwbig");
    document.body.classList.remove("bwcover");   /* and the sky drops behind */
    $("bigwin").className = "on";
  });
  bwAt(swapAt + 90, function(){ document.body.classList.remove("bwinstant"); });

  /* 3. the veil thins onto the new board, and then NOTHING HAPPENS for a
        beat — the starfall is back to its ordinary rate and you are simply
        somewhere else. The event has to be allowed to land before it
        continues. */

  /* 4. THE STORM CLEARS THE BOARD. One comet for every number you did NOT
        choose, and each takes its number with it. By the end the board holds
        only your picks, outlined, with nothing else on it at all. */
  /* stormFrom, mine, per and landAt are all computed at the top of this
     function now, because the score has to be started before any of the
     rest of it runs. Only `theirs` is new here. */
  var stormFrom = BW.ramp + BW.peakHold + BW.clear + BW.settle;
  bwKnocked = {};
  var theirs = [];
  for (var t=1;t<=40;t++) if (S.picks.indexOf(t) === -1) theirs.push(t);
  shuffle(theirs);
  var each = BW.storm / Math.max(1, theirs.length);
  for (var q=0;q<theirs.length;q++){
    (function(tile, at){
      bwAt(at, function(){ bwShotFire(tile, false); });
      bwAt(at + BW.shotFly, function(){
        bwKnocked[tile] = 1;
        paintBoard();                 /* updates in place, so nothing restarts */
      });
    })(theirs[q], stormFrom + q*each);
  }

  /* THE DRAW IS REORDERED so the numbers you own come last. Everything else
     has already been swept off, so revealing it changes nothing on screen —
     which lets the reveal spend all of its time on the part that matters. */
  var dOrder = d.slice().sort(function(x, y){
    return (S.picks.indexOf(x) !== -1 ? 1 : 0) - (S.picks.indexOf(y) !== -1 ? 1 : 0);
  });
  S.last.drawn = dOrder;
  var hidden = 0;
  for (var w=0;w<dOrder.length;w++) if (S.picks.indexOf(dOrder[w]) === -1) hidden++;

  /* 5. then one comet per number you kept. It LANDS if the draw took that
        number and PUNCHES THROUGH if it did not, which is the whole result
        of the draw told in four throws instead of ten. */
  var revealFrom = stormFrom + BW.storm + BW.stormRest;
  bwAt(revealFrom - 80, function(){ S.revealUpto = hidden; paintBoard(); });
  for (var m=0;m<mine.length;m++){
    (function(tile, idx){
      var hit = d.indexOf(tile) !== -1;
      bwAt(revealFrom + idx*per - BW.shotFly, function(){ bwShotFire(tile, hit); });
      bwAt(revealFrom + idx*per, function(){
        if (!hit){
          /* THE COMET PUNCHED THROUGH, SO THE TILE GOES WITH IT. It was
             left standing before, which meant the board finished holding
             a mix of winners and misses with nothing to tell them apart
             — the storm had already established that a tile a meteor
             takes is a tile that leaves. Ending on winners only is the
             same rule applied to your own numbers. */
          bwKnocked[tile] = 1;
          paintBoard();
          return;
        }
        S.revealUpto = Math.min(dOrder.length, S.revealUpto + 1);
        paintBoard();
        /* the top voice always, whatever the player has bought — the score
           under this moment is the same score for everybody */
        ping(idx + 1, 3);
      });
    })(mine[m], m);
  }
  /* landAt is already known — see the top of the function. Recomputing it
     here is how the score and the sequence would drift apart. */

  /* 5. the gem lands, showing nothing yet */
  bwAt(landAt, function(){
    S.revealUpto = null;
    paintBoard();
    dropBall(ball, function(){}, true);          /* label starts at zero */
  });

  /* 6. it winds up: the number climbs, the gem spins harder, the sparks
        reach further */
  bwAt(landAt + BW.dropFor, function(){
    /* the climb and the payout are the same length now, so the multiplier
       arrives at its figure as the money arrives at its own */
    bwGemRamp(BW.mult + BW.count, ball.mult);
    /* THE DRIFT TAKES AS LONG AS THE MEAL DOES. At `BW.mult` the gem reached
       centre at 28.06s and then sat there for ten more seconds while tiles
       were still flying into it. It now arrives exactly as the last tile
       lands and the payout finishes — one slow migration to the middle of the
       screen, eating the board on the way, all three finishing together.

       `mult + count - 400` because the absorptions start 690ms after this
       does and end 400ms before the money; the two spans work out to the same
       finishing instant. */
    bwGemCenter(BW.mult + BW.count);
  });
  /* THE BOARD FEEDS THE GEM. Every number the draw took migrates in and pays
     for itself; the gem's own tile stays, because it is what they are moving
     toward. Held until the gravity well has finished — the mesh owns these
     tiles' transforms until then and the two must not overlap.

     If the draw took nothing but the gem's tile there is nothing to migrate,
     so the multiplier is handed its figure directly rather than waiting for
     absorptions that will never come. */
  bwAt(landAt + BALL_CRASH_GEM + 1150, function(){
    var eat = [];
    for (var z = 0; z < mine.length; z++){
      var t = mine[z];
      if (t !== ball.tile && d.indexOf(t) !== -1) eat.push(t);
    }
    if (!eat.length) return;
    bwGemEatStart(eat, ball.tile);
  });
  /* shells from just after the impact until the count is nearly done */
  bwAt(landAt + BALL_CRASH_GEM + 620, function(){
    /* 0.95, not 0.82 — the shells were stopping nearly two seconds before
       the money did, which left the gem sitting still while the number was
       still climbing. They now run to just short of the final figure. */
    bwGemPulseStart(BW.dropFor + BW.mult + BW.count * 0.95 - BALL_CRASH_GEM - 620);
  });

  /* 7. only once the multiplier has arrived does the money count */
  var payAt = landAt + BW.dropFor + BW.mult;
  bwAt(payAt, function(){
    $("bwPop").className = "on";
    bwCountUp(payCents, BW.count);
  });

  /* 8. down, then colour, then the interface — see body.bwout */
  var endAt = payAt + BW.count + BW.hold;
  bwAt(endAt, function(){
    $("bigwin").className = "";
    $("bwPop").className = "";
    /* THE INLINE TRANSFORM MUST GO BEFORE THE SHRINK. `bwGemCenter` writes
       `transform` straight onto the card, and an inline transform outlives the
       class that is being removed here — the board would sit centred and
       scaled with nothing able to animate it back. */
    var _c = $("boardCard");
    _c.className = "card";
    bwGemCenterStop();                 /* or the next frame writes it straight back */
    _c.style.removeProperty("transform");
    document.body.classList.add("bwout");
    /* THE GLOW SURVIVES THE EVENT. Set here rather than in `bwClear`, which
       strips every other takeover class — this one is meant to outlive it,
       and it is cleared by the next draw. */
    document.body.classList.add("bwafter");
    document.body.classList.remove("bwsky");
    document.body.classList.remove("bwbig");
    document.body.classList.remove("bw");
  });
  /* THE MUSIC IS NOT TORN DOWN WITH THE REST OF IT. The cue runs twelve
     seconds past the end of the takeover, and the moment the win finishes
     counting is the last moment to go quiet on it. */
  bwAt(endAt + BW.fade, function(){ musicGemLetRing(); bwClear(); done(); });
}

/* ═══════════════ NOTHING MAY LEAVE THE BOARD STUCK ════════════════════
   `animating` gates Play AND auto-play, so any path that raises it and then
   fails to lower it soft-locks the whole game. That is not hypothetical: the
   ball raised it, showed itself, called a sound, and only THEN scheduled the
   timer that would lower it again — so a throw in the sound left the ball
   sitting on the board with Play dead and no way back but a reload.

   Two defences, because one was clearly not enough. Releases are armed
   before anything that can fail, and a watchdog lowers the flag anyway if
   some future path forgets entirely. A stuck animation should cost a second,
   never a session. */
var activeBall = null;
var ANIM_MAX_MS = 8000, animGuard = null;
function beginAnim(ms){
  S.animating = true;
  if (animGuard) clearTimeout(animGuard);
  animGuard = setTimeout(function(){
    animGuard = null;
    if (!S.animating) return;
    S.animating = false; S.revealUpto = null;
    bwClear();                              /* never strand the takeover */
    hideBall(); paint();
    if (S.autoOn) startAuto();
  }, ms || ANIM_MAX_MS);
}
function endAnim(){
  S.animating = false;
  if (animGuard){ clearTimeout(animGuard); animGuard = null; }
}


/* ═══════════════════ what each prize looks like ══════════════════════
   The prize decides the object, so you know roughly what you got before
   reading the number. Bearings warm as they climb, marbles deepen, and the
   top three are round brilliants that spin, throw streaks, and swap the
   tile's amber ring for a turning rainbow one. */
var BALL_ART = {
  10:  { kind:"bearing", a:"#f2f4f8", b:"#9aa3b0", c:"#4d5560", d:"#2b3038", rim:"#dfe5ec" },
  25:  { kind:"bearing", a:"#f8f4ec", b:"#a8a294", c:"#5a5348", d:"#33302a", rim:"#e8e2d4", band:"#fff" },
  50:  { kind:"bearing", a:"#ffeccf", b:"#c99a5e", c:"#7a5a2a", d:"#3d2c12", rim:"#ffdca8" },
  75:  { kind:"bearing", a:"#fff4d4", b:"#ffc66b", c:"#9c6b12", d:"#4a3208", rim:"#fff0cc", band:"#fff8e0" },
  100: { kind:"marble", a:"#fff6e6", b:"#ffc978", c:"#8f5312", rim:"#ffe6bf" },
  125: { kind:"marble", a:"#fff2d8", b:"#ffb454", c:"#7a3f08", rim:"#ffdca8" },
