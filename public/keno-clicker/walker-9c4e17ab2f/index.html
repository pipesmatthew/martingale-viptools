  150: { kind:"marble", a:"#ffe9c4", b:"#ff8c3a", c:"#6b2c04", rim:"#ffcf94", second:1 },
  200: { kind:"gem", label:"blue", streaks:24, r0:22, r1:88, w:2, h:14, dur:1.6,
         fxspin:7, gemspin:13, ringspin:4,
         deep:"#04142c", rim:"#8fc4f5", line:"#020a18", table:"#5fa8e0",
         facets:["#8fc4f5","#2b6fae","#6aa8e0","#1a4d80","#7fb6ee","#123a63","#4d8fc8","#0d2b4d"] },
  500: { kind:"gem", label:"purple", streaks:45, r0:24, r1:116, w:2.2, h:18, dur:1.4,
         fxspin:3.4, gemspin:7, ringspin:2.6,
         deep:"#15042c", rim:"#c9a4ef", line:"#0c0119", table:"#a86fe0",
         facets:["#c9a4ef","#6b2fb0","#9b6ad8","#4a1580","#b98ae8","#3a0f6b","#7d3fc4","#2a0850"] },
  1000:{ kind:"gem", label:"rain", streaks:90, r0:26, r1:156, w:2.4, h:24, dur:1.2,
         fxspin:1.5, gemspin:2.8, ringspin:1.4,
         deep:"#1a1030", rim:"#ffffff", line:"#120a24", table:"#fff6fb", rainbow:1 }
};

function artBearing(g){
  return '<svg viewBox="0 0 44 44"><defs><linearGradient id="bMet" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0" stop-color="' + g.a + '"/><stop offset="34%" stop-color="' + g.b + '"/>' +
    '<stop offset="55%" stop-color="' + g.c + '"/><stop offset="78%" stop-color="' + g.b + '"/>' +
    '<stop offset="100%" stop-color="' + g.d + '"/></linearGradient></defs>' +
    '<circle cx="22" cy="22" r="19" fill="url(#bMet)" stroke="' + g.rim + '" stroke-width="1.1"/>' +
    '<ellipse cx="15.5" cy="12.4" rx="6.6" ry="4" fill="#fff" opacity=".85" transform="rotate(-28 15.5 12.4)"/>' +
    (g.band ? '<path d="M5 25.5a19 19 0 0 0 34 0" fill="none" stroke="' + g.band + '" stroke-width="1.6" opacity=".55"/>' : '') +
    '</svg>';
}
function artMarble(m){
  return '<svg viewBox="0 0 44 44"><defs><radialGradient id="bGl" cx="38%" cy="30%" r="80%">' +
    '<stop offset="0" stop-color="' + m.a + '" stop-opacity=".95"/>' +
    '<stop offset="40%" stop-color="' + m.b + '" stop-opacity=".68"/>' +
    '<stop offset="100%" stop-color="' + m.c + '" stop-opacity=".96"/></radialGradient></defs>' +
    '<circle cx="22" cy="22" r="19" fill="#1d1508"/><circle cx="22" cy="22" r="19" fill="url(#bGl)"/>' +
    '<circle cx="22" cy="22" r="19" fill="none" stroke="' + m.rim + '" stroke-width="1.5"/>' +
    '<ellipse cx="15.6" cy="13" rx="7" ry="4.6" fill="#fff" opacity=".8" transform="rotate(-32 15.6 13)"/>' +
    (m.second ? '<ellipse cx="28" cy="30" rx="5" ry="3" fill="#fff" opacity=".3" transform="rotate(-30 28 30)"/>' : '') +
    '</svg>';
}
/* A round brilliant seen from above: sixteen facets around an octagonal
   table, alternating light and dark so it scintillates as it turns. */
function artGem(g){
  var GX = 22, GY = 22, GR = 19.4, GT = 7.6;
  function pt(r, deg){ var a = deg * Math.PI / 180; return [GX + r * Math.cos(a), GY + r * Math.sin(a)]; }
  function dd(p){ return p.map(function(x, i){ return (i ? "L" : "M") + x[0].toFixed(2) + " " + x[1].toFixed(2); }).join("") + "Z"; }
  var table = [], girdle = [];
  for (var i = 0; i < 8; i++)  table.push(pt(GT, i * 45 + 22.5));
  for (var i = 0; i < 16; i++) girdle.push(pt(GR, i * 22.5 + 11.25));
  var s = '<svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="' + GR + '" fill="' + g.deep + '"/>';
  for (var i = 0; i < 16; i++){
    var f = g.rainbow ? "hsl(" + (i * 22.5) + " 92% " + (i % 2 ? 72 : 58) + "%)" : g.facets[i % 8];
    s += '<path d="' + dd([girdle[i], girdle[(i + 1) % 16], table[Math.round(i / 2) % 8]]) +
         '" fill="' + f + '" stroke="' + g.line + '" stroke-width=".45" stroke-opacity=".5"/>';
  }
  s += '<path d="' + dd(table) + '" fill="' + g.table + '" stroke="' + g.line + '" stroke-width=".6" stroke-opacity=".6"/>';
  s += '<circle cx="22" cy="22" r="' + GR + '" fill="none" stroke="' + g.rim + '" stroke-width="1.3"/>';
  s += '<path d="M13 11.5 L18 11.5 L14.6 16 Z" fill="#fff" opacity=".8"/></svg>';
  return s;
}
function ballStreaks(g){
  var out = "";
  for (var i = 0; i < g.streaks; i++){
    var deg = i * (360 / g.streaks), hue = deg % 360;
    out += '<i style="--rot:' + deg.toFixed(1) + 'deg;--r0:-' + g.r0 + 'px;--r1:-' + g.r1 +
           'px;--dur:' + g.dur + 's;width:' + g.w + 'px;height:' + g.h + 'px;margin:-' +
           (g.h / 2) + 'px 0 0 -' + (g.w / 2) + 'px;background:hsl(' + hue.toFixed(0) +
           ' 96% 64%);animation-delay:' + ((i % 9) * 0.07).toFixed(2) + 's"></i>';
  }
  return out;
}

function dropBall(ball, done, zeroLabel){
  var el = $("ball"), board = $("board");
  var tile = board.querySelector('.kt[data-t="' + ball.tile + '"]');
  if (!tile){ done(); return; }                 /* board repainted under us */
  var br = board.getBoundingClientRect(), tr = tile.getBoundingClientRect();
  var g = BALL_ART[ball.mult] || BALL_ART[10];
  /* DECLARED HERE, NOT WHERE IT WAS. `var` hoists: reading it above its own
     assignment gives undefined, so `if (!isGem)` was true for every ball and
     the guard below did nothing at all. */
  var isGem = g.kind === "gem";

  /* SIZED TO THE LIVE TILE, because the board is a percentage width and a
     hard-coded size would drift with the viewport.

     MEASURE IN SCREEN PIXELS, ASSIGN IN LOCAL ONES. getBoundingClientRect is
     post-transform; the styles we set here are pre-transform, because #ball
     lives inside the board and inherits any scale it carries. Nothing scales
     the board today, so this ratio is 1 — but when the big-win takeover did
     scale it, the ball came out that much too big and landed short of its
     own tile. Kept as a guard so a future transform cannot repeat it. */
  var sc = board.offsetWidth ? (br.width / board.offsetWidth) : 1;
  if (!(sc > 0)) sc = 1;
  var size = Math.round(Math.min(tr.width, tr.height) / sc);
  el.style.width = size + "px"; el.style.height = size + "px";
  /* OFFSET FROM THE BALL'S OWN CONTAINING BLOCK, NOT FROM THE BOARD.
     `#ball` is absolutely positioned and its nearest positioned ancestor is
     `.gamewrap`, so `left`/`top` are measured from there — but this subtracted
     the BOARD's rect, which is a different origin the moment the two stop
     sharing an edge.

     They shared one for as long as the board was `width:100%` of the wrapper.
     Since the board became as wide as its own columns and centred itself, the
     wrapper is the full middle column and the board is a few hundred pixels
     narrower, so every ball landed exactly half that difference to the LEFT of
     the tile it was promised — out in the black beside the board.

     Reading offsetParent rather than naming `.gamewrap` means it cannot drift
     again if something else is ever positioned in between. */
  var host = el.offsetParent || board.parentElement;
  var hr = host.getBoundingClientRect();
  el.style.left = ((tr.left - hr.left + tr.width / 2) / sc) + "px";
  el.style.top  = ((tr.top  - hr.top  + tr.height / 2) / sc) + "px";

  $("ballArt").innerHTML = g.kind === "gem" ? artGem(g)
                         : g.kind === "marble" ? artMarble(g)
                         : artBearing(g);
  $("ballArt").className = g.kind === "gem" ? "gem" : "";

  var fx = $("ballFx"), ring = $("ballRing");
  if (g.kind === "gem"){
    fx.innerHTML = ballStreaks(g);
    fx.className = "spin";
    fx.style.setProperty("--fxspin", g.fxspin + "s");
    el.style.setProperty("--gemspin", g.gemspin + "s");
    /* NO RING. It was here to replace the amber tile highlight back when
       tiles had backgrounds — now the tile under it already carries a
       cycling rainbow outline, so this was a second square drawn on top of
       the first and the gem looked boxed in. */
    ring.className = ""; ring.innerHTML = "";
  } else {
    fx.innerHTML = ""; fx.className = "";
    ring.className = ""; ring.innerHTML = "";
  }

  var lab = el.querySelector(".ballmult");
  lab.className = "ballmult" + (g.label ? " " + g.label : "");
  /* the takeover starts this at nothing and winds it up to the real figure */
  $("ballMultText").textContent = zeroLabel ? "0\u00d7"
                                : ball.mult.toLocaleString() + "\u00d7";

  activeBall = ball;
  /* the amber ring would fight a rainbow one, so gems take the tile over */
  if (g.kind !== "gem") tile.classList.add("ballspot");
  /* NOT FOR A GEM. `ballflash` throws an amber box-shadow ring around the
     whole grid and runs it twice — which on the ordinary board is a nice
     acknowledgement, and during the takeover is a tan rectangle fading in
     and out around a starfield for no reason anyone can see. The gem has a
     shockwave and a gravity well to announce itself with. */
  if (!isGem) board.classList.add("ballhit");
  /* NO SEPARATE BANNER. It existed to help when the ball was a small amber
     circle; with the tiered art and a topmost solid label it was a second
     element shouting the same number, and the faint one made the readable
     one harder to find rather than easier. */
  el.hidden = false;
  el.className = "drop" + (isGem ? " gem" : " plain");
  /* ARMED FIRST. Whatever else happens below, the board comes back. */
  var CRASH = isGem ? BALL_CRASH_GEM : BALL_CRASH_PLAIN;
  setTimeout(function(){ el.className = "land" + (isGem ? " gem" : " plain"); }, CRASH);
  /* THE MOMENT IT LANDS, not before: the blast and the dent both fire on the
     same frame the gem stops moving. */
  if (isGem){
    setTimeout(function(){
      var rr = el.getBoundingClientRect();
      var cx = rr.left + rr.width/2, cy = rr.top + rr.height/2;
      /* IN WAVES, NOT ONE BANG. Four bursts a seventh of a second apart,
         each smaller than the last — because they start at different times
         their rings are already at different radii, so they read as
         successive shells leaving the impact rather than one expanding
         circle. */
      var WAVES = [[34,240],[30,200],[26,165],[22,135],[18,105],[15,80]];
      for (var wv=0; wv<WAVES.length; wv++){
        (function(spec, at){
          setTimeout(function(){
            bwBoom(cx, cy, spec[0], Math.random()*360);
            bwBurst(cx, cy, spec[1]);
          }, at);
        })(WAVES[wv], wv * 115);
      }
      bwMeshWave(cx, cy, 1150);
      /* THE SCORE HAS ITS OWN IMPACT AT THIS EXACT FRAME. Playing the
         synthesised thud over it is two bass hits a few milliseconds
         apart, which reads as a flam rather than a blow. It still fires
         when the music is not carrying the event. */
      try { if (!S.muted && !musicGemActive()) thud(210, 30, 1.3, 0.34); } catch (e) {}
    }, CRASH);
  }
  setTimeout(done, BALL_DWELL_MS);
  /* Same for the cabinet fanfare: the cue is already announcing this.
     Ordinary balls keep their chime — nothing is scoring those. */
  try {
    if (!S.muted){
      if (g.kind === "gem"){ if (!musicGemActive()) bigWinFanfare(); }
      else chime();
    }
  } catch (e) {}
}

function hideBall(){
  var el = $("ball");
  if (el && !el.hidden){
    el.hidden = true; el.className = "";
    $("ballFx").innerHTML = ""; $("ballFx").className = "";
    $("ballRing").className = ""; $("ballRing").innerHTML = "";
  }
  var bd = $("board"); if (bd) bd.classList.remove("ballhit");
  activeBall = null;
  var sp = document.querySelectorAll('.kt.ballspot');
  for (var i=0;i<sp.length;i++) sp[i].classList.remove("ballspot");
}

function settle(){
  var r = S.last, D = derived();
  S.draws += 1;
  S.stageDraws += 1;
  /* NOTHING IS SUBTRACTED HERE. This is the whole economy. */
  if (r.payCents > 0){ S.cents += r.payCents; S.wonCents += r.payCents; }
  /* THE HISTORY RECORDS EVERY DRAW, batch included. A catch-up settles in
     bulk with no animation and no popup, which is exactly when the counter
     appears to jump for no reason — the list is where those draws go so the
     jump has something to point at. */
  S.history.unshift({ h: r.hits, k: D.picks, m: r.mult, p: r.payCents,
                      b: r.ball ? r.ball.mult : 0 });
  /* `while`, NOT `if`. One pop per draw exactly matches one unshift per draw,
     so a list that is ALREADY over the cap is a fixed point — it never grows
     and it never shrinks either. It cannot happen in play, because history is
     not saved and every load starts empty; it happened immediately in a test
     harness that seeded the list by hand. A loop costs one word and makes the
     panel exactly HISTORY_MAX from any starting state. */
  while (S.history.length > HISTORY_MAX) S.history.pop();

  /* INSIDE A CATCH-UP BATCH NOBODY IS WATCHING. Repainting and popping a
     win banner per draw would mean thirty of each to arrive at one final
     state; the pump paints once when the batch ends. */
  if (autoQuiet){ maybeMine(); save(); return; }
  paint(); save();
  /* THE MINE TAKES PRECEDENCE. A draw that sets one off still pays a couple of
     cents, and the note would land under a board that is being blown open. */
  var mined = maybeMine();
  if (!mined && r.payCents > 0) showWin(r.payCents);
  if (!mined) maybeShock(r.hits);
  if (manualQueued && !S.animating){
    manualQueued = false;
    setTimeout(function(){ play(false); }, 0);   /* out of this call stack */
  }
}

/* ═══════════════════════════ autoplay's clock ═════════════════════════
   THE PATTERN IS MARTINGALE'S, and for its reasons. It runs on WALL-CLOCK
   TIME rather than on timer fires: a hidden tab's timers are clamped to
   roughly one fire a second, and one a minute after five, so a loop that
   assumed it was woken on schedule would quietly run slow with nothing on
   screen to say so. Each fire asks how much time actually passed and plays
   the draws that time bought, which turns throttling into fewer, larger
   batches instead of a lower rate.

   The catch-up is BOUNDED. AUTO_MAX_CATCHUP_SEC of debt is honoured and the
   rest dropped, so a laptop that slept for an hour does not wake and replay
   the hour.

   WHILE A DRAW IS TURNING OVER, TIME IS NOT BANKED — the clock is simply
   moved up. Owing that time would make autoplay burst afterwards to catch up
   on time it deliberately sat out.

   There is no stop button, unlike martingale's: there, autoplay spends real
   stake and you must be able to halt it. Here a draw costs nothing, so
   stopping it could only ever lose you money. */
var AUTO_MAX_CATCHUP_SEC = 90;
var autoTimer = null, autoLast = 0, autoOwed = 0, autoQuiet = false;

function autoSecs(){ return S.autoOn ? autoSecsAt(upLevel("autoSpeed")) : 0; }
function autoSps(){ var t = autoSecs(); return t > 0 ? 1 / t : 0; }
function autoReady(){ return !S.animating && S.picks.length === derived().picks; }

function autoPump(){
  autoTimer = null;
  var sps = autoSps();
  if (!sps) return;                          /* not bought - stop pumping */
  var now = (window.performance && performance.now) ? performance.now() : 0;

  if (!autoReady()){
    autoLast = now;                          /* mid-draw, or numbers not chosen */
  } else {
    autoOwed += (now - autoLast) / 1000 * sps;
    autoLast = now;
    var n = Math.floor(autoOwed);
    autoOwed -= n;
    var cap = Math.max(1, Math.ceil(sps * AUTO_MAX_CATCHUP_SEC));
    if (n > cap){ n = cap; autoOwed = 0; }
    if (n > 1) autoQuiet = true;             /* a batch: no reveal, no popups */
    try {
      for (var i = 0; i < n; i++){
        if (!autoReady()) break;
        play(true);
      }
    } finally {
      if (autoQuiet){ autoQuiet = false; paint(); }
    }
  }
  var wait = Math.max(50, Math.round(1000 / sps));
  autoNextAt = ((window.performance && performance.now) ? performance.now() : 0) + wait;
  autoTimer = setTimeout(autoPump, wait);
}
/* CLEARING THE FLAG IS NOT STOPPING IT. A pump was already scheduled, and
   the owed-time accumulator still holds whatever the clock banked — leave
   either behind and auto-play gets one more draw in after you switched it
   off, which is exactly what it was doing. */
function stopAuto(){
  if (autoTimer !== null){ clearTimeout(autoTimer); autoTimer = null; }
  autoOwed = 0;
  autoNextAt = 0;
}
function startAuto(){
  if (autoSps() <= 0 || autoTimer !== null) return;
  autoLast = (window.performance && performance.now) ? performance.now() : 0;
  autoOwed = 0;
  autoNextAt = ((window.performance && performance.now) ? performance.now() : 0) + 100;
  autoTimer = setTimeout(autoPump, 100);
}
/* Coming back to the tab should not wait out a timer scheduled a minute ago.
   The pump is idempotent about time — it plays whatever the clock says is
   owed — so firing early costs nothing. */
document.addEventListener("visibilitychange", function(){
  if (!document.hidden && autoTimer !== null){
    clearTimeout(autoTimer); autoTimer = null;
    autoPump();
  }
});

/* PRESSING PLAY TAKES THE BOARD BACK. Auto stops, and if a draw is already
   turning over the manual one waits for it rather than being swallowed — a
   press that silently does nothing because the board was busy reads as a
   broken button. */
var manualQueued = false;
function requestPlay(){
  lastPlayAt = Date.now();
  if (S.autoOn){ S.autoOn = false; stopAuto(); paint(); save(); }
  if (S.animating){ manualQueued = true; return; }
  play(false);
}

/* AUTO COMES BACK ON ITS OWN AFTER FIVE SECONDS. Pressing BET takes the board
   back, which is right — but the cost of that is a game that sits completely
   still the moment someone stops clicking, which for an idle game is the
   wrong resting state. Any press pushes the deadline out again, so it only
   fires when you have actually stopped.

   TWENTY SECONDS -> FIVE on 2026-08-26. Twenty was long enough that stopping
   felt like the game had stopped too, and the countdown at the foot of the
   screen spent most of its life reading a number nobody was waiting on. Five
   is short enough that letting go IS the interaction rather than a pause
   before one.

   THE FLOOR IS A DRAW, NOT A SECOND. At the fastest auto speed a draw takes
   about a quarter of a second, so five seconds is twenty draws of grace —
   there is no risk of it treading on a player who is still clicking, because
   any press resets it.

   Guarded on a complete pick set, because auto cannot draw without one, and
   on `animating` so it never lands in the middle of a takeover. */
var IDLE_AUTO_MS = 5000;
/* THE NOTE HOLDS BACK FOR THE FIRST SECOND. Every manual bet resets the
   deadline, so at any ordinary clicking pace the countdown was starting over
   at five again and again — and the line fading in and out under every single
   press was flicker, not information. It now appears when the count reads
   FOUR, which is a second of genuine idle: spam-clicking never reaches it, and
   a player who has actually stopped still gets a four-second runway. */
var AUTO_NOTE_AFTER_MS = 1000;
var lastPlayAt = Date.now();
/* FOUR TIMES A SECOND, NOT ONCE — it draws the countdown as well as firing
   it now, and a 1Hz clock showing seconds visibly stutters because its ticks
   and the number's are not in step. The trigger only got more precise. */
starSchedule();

setInterval(function(){
  paintAutoTime();
  if (window.Boss && Boss.isLive()) return;   /* see play() */
  if (S.autoOn || S.animating) return;
  if (Date.now() - lastPlayAt < IDLE_AUTO_MS) return;
  if (S.picks.length !== derived().picks) return;
  S.autoOn = true;
  startAuto();
  if (autoTimer === null){ S.autoOn = false; return; }   /* nothing to run */
  paint(); save();
}, 250);

/* ═══════════════════════════════ buying ═══════════════════════════════ */
function applyBuy(id, free){
  var u = upDef(id); if (!u) return false;
  var lvl = upLevel(id);
  if (lvl >= u.max) return false;
  if (u.gate && !u.gate()) return false;
  var cost = u.cost(lvl);
  if (!free){
    if (S.cents < cost) return false;
    S.cents -= cost;
  }
  S.upgrades[id] = lvl + 1;
  /* A NEW NUMBER MEANS A NEW BOARD. The tiles on screen were scored against
     the old selection and the paytable has just changed underneath them. */
  if (id === "extraPicks") S.last = null;
  if (id === "autoSpeed" && autoTimer !== null){
    /* the pump reschedules off the rate it read last, so nudge it */
    clearTimeout(autoTimer); autoTimer = null; autoPump();
  }
  return true;
}
/* THE BED IS OWED FROM THREE NUMBERS ON, and buying the third is the
   moment it becomes owed. Without this it would not arrive until the next
   thing that happens to call `musicBedStart` — the end of a takeover, or a
   reload — which is a long silence after the upgrade that was supposed to
   turn it on. `musicBedStart` re-checks the gate itself, so calling it on
   every purchase costs nothing and cannot start it early. */
function buy(id){ if (applyBuy(id, false)){ paint(); flush(); musicBedStart(); } }

/* ═══════════════════════════ developer tools ══════════════════════════
   Hidden behind a keystroke rather than a build flag, because the thing
   worth testing is the live page. Everything here writes through the same
   functions the game uses, so a state reached with these is a state the
   game could have reached on its own. */
var DEV = /[?&]dev\b/.test(location.search);

function paintDev(){
  var D = derived(), html = "";
  for (var i=0;i<UPGRADES.length;i++){
    var u = UPGRADES[i], lvl = upLevel(u.id);
    html += '<button data-dev="lvl" data-id="' + u.id + '" data-d="-1">&minus;</button>' +
            '<button data-dev="lvl" data-id="' + u.id + '" data-d="1">+</button>' +
            '<button data-dev="max" data-id="' + u.id + '">' + u.id + ' ' + lvl + '/' + u.max + '</button>';
  }
  $("devUps").innerHTML = html;

  var sel = $("devForce"), want = S.dev.forceHits;
  var opts = '<option value="">force hits…</option>';
  for (var h=0; h<=D.picks; h++){
    opts += '<option value="' + h + '"' + (want === h ? " selected" : "") + '>' +
            h + ' of ' + D.picks + '</option>';
  }
  sel.innerHTML = opts;

  /* ONE BUTTON PER PRIZE. Ten objects with three different art treatments
     between them, and a select meant picking a value then pressing a second
     button to see it — this way every one is a single click. */
  var bb = $("devBalls");
  if (bb && !bb.children.length){
    var o = "";
    for (var q=0;q<BALL_PRIZES.length;q++){
      var m = BALL_PRIZES[q].m, k = (BALL_ART[m]||{}).kind;
      o += '<button data-dev="ballnow" data-m="' + m + '" class="bq ' + k + '" title="' +
           k + '">' + m.toLocaleString() + '×</button>';
    }
    o += '<button data-dev="ballnow" data-m="0">random</button>';
    /* THE TAKEOVER IN CONTEXT. Firing it from a standing start tells you
       nothing about the thing that actually matters — how it feels to be
       mid-session, watching ordinary draws, when one of them turns out not
       to be ordinary. Five normal draws first, then the gem. */
    o += '<button data-dev="rehearse" data-m="1000">5 draws &rarr; 1,000×</button>';
    o += '<button data-dev="rehearse" data-m="200">5 draws &rarr; 200×</button>';
    bb.innerHTML = o;
  }
  $("devInstant").textContent = "Instant: " + (S.dev.instant ? "on" : "off");
  $("devInstant").className = S.dev.instant ? "on" : "";
  $("devTabSmooth").className  = S.table === "smooth"  ? "on" : "";
  $("devTabJackpot").className = S.table === "jackpot" ? "on" : "";
  paintRate();
}
/* ── what clicking is actually worth, per hour ──────────────────────────
   THE ASSUMPTION IS ON SCREEN, not buried: a draw costs the reveal plus
   however long a person takes to press Play again, and that gap is a guess.
   Printing the draws-per-hour it implies means the guess can be argued with
   instead of silently deciding whether the pacing looks right.

   Income per draw needs no simulation. The paytable is solved so that k
   numbers returns exactly k times the bet, so the expected draw is
   bet x picks - exact, not estimated. */
var CLICK_GAP_MS = 400;   /* was 350 — slowed 15% */

/* ── what a purchase is worth, per hour ────────────────────────────────
   DEV ONLY, shown against every buy so the shop reads as a set of competing
   investments rather than a list of prices. It is the honest marginal gain:
   income after the purchase minus income now, at the CURRENT click speed —
   so it moves when you toggle instant reveal, because it should. */
function drawsPerHourNow(){
  return 3600000 / ((S.dev.instant ? 0 : REVEAL_TOTAL) + CLICK_GAP_MS);
}
function clickCentsPerHour(betCents, picks){
  return drawsPerHourNow() * betCents * kenoTargetRTP(picks);
}
/* What auto-play alone is worth — the rate the board holds with nobody at
   the keyboard. */
function autoCentsPerHour(betCents, picks){
  return autoSps() * 3600 * betCents * kenoTargetRTP(picks);
}
/* The board's real throughput: clicking and auto do not add, they compete
   for the same board, so it runs at whichever is faster. */
function boardDrawsPerHour(){ return Math.max(drawsPerHourNow(), autoSps() * 3600); }
function boardCentsPerHour(betCents, picks){
  return boardDrawsPerHour() * betCents * kenoTargetRTP(picks);
}
function upgradeGainPerHour(id, lvl){
  var D = derived();
  if (id === "betSize")
    return boardCentsPerHour(betAt(lvl+1), D.picks) - boardCentsPerHour(betAt(lvl), D.picks);
  if (id === "extraPicks")
    return boardCentsPerHour(D.betCents, lvl+2) - boardCentsPerHour(D.betCents, lvl+1);
  /* AUTO-PLAY'S VALUE IS NOT MEASURED AGAINST SOMEBODY CLICKING. Against the
     assumed manual rate it buys nothing at all — it is slower — so scoring it
     that way would price it at zero. What it actually buys is the rate the
     board keeps once you walk away, which before this purchase is nothing. */
  if (id === "autoSpeed")
    return (1/autoSecsAt(lvl+1) - 1/autoSecsAt(lvl)) * 3600 * D.betCents * kenoTargetRTP(D.picks);
  return 0;
}
function gainTag(cents){
  return (cents > 0) ? '<span class="devgain">+' + money(Math.round(cents)) + '/hr</span>' : "";
}
function fmtDur(hours){
  if (!isFinite(hours) || hours <= 0) return "now";
  var s = hours * 3600;
  if (s < 90)     return Math.round(s) + "s";
  if (s < 5400)   return Math.round(s/60) + "m";
  if (s < 172800) return (s/3600).toFixed(1) + "h";
  if (s < 31536000 * 2) return (s/86400).toFixed(1) + "d";
  return (s/31536000).toFixed(1) + "y";
}
function paintRate(){
  var D = derived();
  var msPerDraw = (S.dev.instant ? 0 : REVEAL_TOTAL) + CLICK_GAP_MS;
  var perHour = 3600000 / msPerDraw;
  /* bet x k(k+3)/4, not bet x k — the return stopped being the pick count
     when every match became worth k+3. Exact; see kenoExact(). */
  var centsPerDraw = D.betCents * kenoTargetRTP(D.picks);
  var centsPerHour = boardCentsPerHour(D.betCents, D.picks);

  var hiredPerHour = streamerCentsPerSec() * 3600;
  var totalPerHour = centsPerHour + hiredPerHour;

  var lines = [
    "<b>" + money(Math.round(totalPerHour)) + "/hr total</b>",
    "board    " + money(Math.round(centsPerHour)) + "/hr  ·  " + money(centsPerDraw) +
      "/draw  ·  " + Math.round(boardDrawsPerHour()).toLocaleString() + " draws/hr" +
      (autoSps() > 0 ? "  (auto " + (1/autoSps()).toFixed(0) + "s)" : ""),
    "auto     " + money(Math.round(autoCentsPerHour(D.betCents, D.picks))) + "/hr" +
      (autoSps() > 0 ? "" : "  (not bought)"),
    "hired    " + money(Math.round(hiredPerHour)) + "/hr  ·  " +
      money(Math.round(streamerCentsPerSec())) + "/s",
    "paytable " + S.table + "  ·  " + (function(){
        var ok = true;
        for (var k2=1;k2<=10;k2++){ var e2=kenoExact(k2); if (e2.got !== e2.want) ok=false; }
        return ok ? "exact at every count" : "NOT EXACT - check the table";
      })() + "  ·  " + rtpText(D.picks) + "x the bet per draw",
    "assumes " + msPerDraw + "ms a draw (" + (S.dev.instant ? "instant" : REVEAL_TOTAL + "ms reveal") +
      " + " + CLICK_GAP_MS + "ms to click)"
  ];
  for (var i=0;i<UPGRADES.length;i++){
    var u = UPGRADES[i], lvl = upLevel(u.id);
    if (lvl >= u.max){ lines.push(u.id + ": maxed"); continue; }
    var need = Math.max(0, u.cost(lvl) - S.cents);
    /* PAYBACK, not just price. A price that looks sensible can still be a
       bargain or a trap depending on what it buys, and payback is the number
       that says which — it is what exposed the bet track's sawtooth. */
    var gain = upgradeGainPerHour(u.id, lvl);
    lines.push(u.id + " next " + money(u.cost(lvl)) +
               "  ·  pays back in " + fmtDur(u.cost(lvl) / gain) +
               "  ·  " + fmtDur(need / totalPerHour) + " away");
  }
  /* PAYBACK IS THE NUMBER THAT DECIDES WHETHER A HIRE IS WORTH IT, and it
     is the one the shop cannot show without becoming a spreadsheet. */
  for (var s=0;s<STREAMERS.length;s++){
    var def = STREAMERS[s], st = S.streamers[def.id];
    var owned = st ? st.n : 0, cost = hireCost(def, owned);
    var probe = st || { n:0, smart:0, bet:0, picks:0 };
    var addPerHour = sRate(def, probe) * sBet(def, probe) * kenoTargetRTP(sPicks(def, probe)) * 3600;
    lines.push(def.id + " x" + owned + " next " + money(cost) +
               "  ·  pays back in " + fmtDur(cost / addPerHour) +
               "  ·  " + fmtDur(Math.max(0, cost - S.cents) / totalPerHour) + " away");
  }
  $("devRate").innerHTML = lines.join("\n");
}

function setDev(on){
  DEV = on;
  $("devCard").hidden = !on;
  /* dev hint text removed */
  if (on) paintDev();
}
/* Ordinary draws, then the one that is not. Chains on S.animating rather
   than on a fixed delay, because a draw's length depends on the reveal speed
   and on whether a ball happens to turn up in it. */
var rehearseTimer = null;
function devRehearse(n, mult){
  if (rehearseTimer){ clearInterval(rehearseTimer); rehearseTimer = null; }
  var left = n;
  (function next(){
    if (left <= 0){
      devSay("and now the " + mult.toLocaleString() + "×");
      S.dev.forceBall = true; S.dev.ballMult = mult;
      requestPlay();
      return;
    }
    devSay("rehearsing — " + left + " ordinary draw" + (left === 1 ? "" : "s") + " to go");
    left--;
    S.dev.forceBall = false;
    requestPlay();
    rehearseTimer = setInterval(function(){
      if (S.animating) return;
      clearInterval(rehearseTimer); rehearseTimer = null;
      setTimeout(next, 420);                 /* a beat between draws */
    }, 100);
  })();
}

function devSay(msg){ var el = $("devOut"); if (el) el.textContent = msg; }

/* Runs draws with no animation and no repaint, then banks the lot. The
   observed return is the check that matters: it should converge on the
   pick count, because that is what the paytable was solved for. */
function simulate(n){
  var D = derived();
  if (S.picks.length !== D.picks){ devSay("Pick " + D.picks + " number(s) first."); return; }
  n = clamp(int(n, 0), 1, 1000000);
  var tab = pays()[D.picks] || {}, gained = 0, spread = {};
  for (var i=0;i<n;i++){
    var d = draw10(), h = 0;
    for (var j=0;j<10;j++) if (S.picks.indexOf(d[j]) !== -1) h++;
    gained += D.betCents * (tab[h] || 0);
    spread[h] = (spread[h] || 0) + 1;
  }
  S.cents += gained; S.wonCents += gained; S.draws += n;
  var observed = gained / (n * D.betCents);
  var lines = ["ran " + n.toLocaleString() + " draws on " + S.table + ", " + D.picks + " number(s)",
               "won " + money(gained),
               "return  " + observed.toFixed(4) + "x   (exact " + D.picks + ".0000x)"];
  var hs = Object.keys(spread).sort(function(a,b){ return a-b; });
  var sp = [];
  for (var q=0;q<hs.length;q++) sp.push(hs[q] + ":" + (spread[hs[q]]/n*100).toFixed(1) + "%");
  lines.push("hits    " + sp.join("  "));
  paint(); flush();
  devSay(lines.join("\n"));
}

$("devCard").addEventListener("click", function(e){
  var b = e.target.closest("[data-dev]"); if (!b) return;
  var what = b.getAttribute("data-dev");

  /* ── auditioning the tile pings ──────────────────────────────────────
     TEN NOTES, 260ms APART, which is what the takeover's pick wave really
     does at ten numbers — one comet per number you kept, `BW.pickWave`
     divided between them. Hearing a single ping tells you almost nothing;
     what matters is whether the run accumulates into a chord or a pile-up,
     and that only shows up at the spacing it will actually be played at.

     Pressing one also LOCKS that voice for ordinary play and the takeover
     both, so you can leave it set and go and hit a real gem with it. */
  if (what.indexOf("ping") === 0){
    if (what === "pingfree"){
      S.dev.pingVoice = null;

             PING_NAMES[pingVoice()] + " at " + upLevel("extraPicks") + " numbers bought");

    devPingTimers = [];
    for (var pn = 1; pn <= 10; pn++){

        devPingTimers.push(setTimeout(function(){ ping(n); }, (n - 1) * 260));
      })(pn);
    }
    devSay("tile pings LOCKED to " + PING_NAMES[pv] +
           " — ten hits at the pick wave's own spacing. “Follow progress” to unlock.");
    return;
  }

  if (what === "setcash"){
    var raw = $("devCash").value.replace(/[$,\s]/g, "");
    var dollars = Number(raw);
    if (!isFinite(dollars) || dollars < 0){ devSay("Not a number: " + $("devCash").value); return; }
    S.cents = Math.round(dollars * 100);
    devSay("cash = " + money(S.cents));
  }
  else if (what === "add"){ S.cents += int(b.getAttribute("data-v"), 0); devSay("cash = " + money(S.cents)); }
  else if (what === "mul10"){ S.cents = Math.min(S.cents * 10, Number.MAX_SAFE_INTEGER); devSay("cash = " + money(S.cents)); }
  else if (what === "broke"){ S.cents = 0; devSay("cash = $0.00"); }
  else if (what === "lvl"){
    var id = b.getAttribute("data-id"), u = upDef(id), d = int(b.getAttribute("data-d"), 0);
    if (d > 0) applyBuy(id, true);
    else if (upLevel(id) > 0){
      S.upgrades[id] = upLevel(id) - 1;
      if (id === "extraPicks"){
        S.picks = S.picks.slice(0, derived().picks);
        S.last = null;      }
    }
    devSay(id + " = level " + upLevel(id));
  }
  else if (what === "max"){
    var id2 = b.getAttribute("data-id"), u2 = upDef(id2);
    while (applyBuy(id2, true)) {}
    devSay(id2 + " = level " + upLevel(id2) + " (free)");
  }
  else if (what === "armmine"){
    /* TEMPORARY, FOR LOOKING AT THE ARC. Serves the dwell instantly rather
       than firing the mine, so the 1-in-200 that follows is still the real
       thing. */
    S.stageDraws = mineArmAt(S.stage);
    devSay("dwell served — mine armed at stage " + (S.stage + 1));
  }
  else if (what === "boss" || what === "bossskip"){
    /* THE ONLY WAY IN, FOR NOW. The fight has no unlock condition yet — it will
       hang off the stage ladder, the way the mine does. Until then this is how
       you get to the arena, and ESC is how you leave it. */
    if (!window.Boss){ devSay("boss.js did not load"); }
    else { Boss.start(what === "bossskip"); devSay("arena — WASD, SPACE shoots, SHIFT blocks, ESC leaves"); }
  }
  else if (what === "bossend"){
    if (window.Boss) Boss.stop();
    devSay("left the arena");
  }

    else devSay(Boss.jump(+what.slice(8)));
  }

    /* TEMPORARY, UNTIL THE MINI-BOSS EXISTS TO DO IT. */

  }
  else if (what === "hire1" || what === "hire10"){

  else if (what === "smartmax"){

  else if (what === "boardmax"){
    for (var s3=0;s3<STREAMERS.length;s3++){
      while (upgradeStreamer(STREAMERS[s3].id, "bet", true)) {}
      while (upgradeStreamer(STREAMERS[s3].id, "picks", true)) {}
    }
    paintStreamersFull();
    devSay("every streamer board maxed");
  }
  else if (what === "firethem"){
    S.streamers = {};
    paintStreamersFull();
    devSay("everybody is fired");
  }
/* PURE ANIMATION, NO MONEY. "Force a ball" waits for a real paying draw,
     which is the honest test but a slow one when what you want to look at is
     the drop itself. This one just throws a ball at the board. */
  /* THE WHOLE SEQUENCE, PAYOUT INCLUDED — arms a ball and presses Play, so
     you see the drop, the draw it guarantees, and the money. */
  else if (what === "ballnow"){
    if (S.animating){ devSay("a draw is still turning over"); return; }
    if (S.picks.length !== derived().picks){ devSay("choose your numbers first"); return; }
    var m = int(b.getAttribute("data-m"), 0);
    S.dev.forceBall = true;
    S.dev.ballMult = m;
    requestPlay();
    devSay(m ? ("dropping " + m.toLocaleString() + "× (" + (BALL_ART[m]||{}).kind + ")")
             : "dropping a random prize");
    return;
  }
  else if (what === "rehearse"){
    if (S.animating){ devSay("a draw is still turning over"); return; }
    if (S.picks.length !== derived().picks){ devSay("choose your numbers first"); return; }
    devRehearse(5, int(b.getAttribute("data-m"), 1000));
    return;
  }
  else if (what === "clearforce"){ S.dev.forceHits = null; devSay("next draw is random again"); }
  else if (what === "instant"){ S.dev.instant = !S.dev.instant; devSay("instant reveal " + (S.dev.instant ? "on" : "off")); }
  else if (what === "table"){
    var id3 = b.getAttribute("data-v");
    if (TABLES[id3]){
      S.table = id3;
      var e2 = kenoExact(derived().picks);
      devSay("paytable = " + id3 + "  ·  exact: " + (e2.got === e2.want));
    }
  }
  else if (what === "sim"){ simulate(b.getAttribute("data-v") || $("devSim").value); return; }

  paint(); flush();
});
$("devForce").addEventListener("change", function(){
  var v = this.value;
  S.dev.forceHits = v === "" ? null : int(v, null);
  devSay(v === "" ? "next draw is random" : "next draw will land " + v + " hit(s)");
});

/* ═══════════════════════════════ input ════════════════════════════════ */
$("board").addEventListener("click", function(e){
  if (S.animating) return;
  var t = e.target.closest(".kt"); if (!t) return;
  var v = +t.getAttribute("data-t"), at = S.picks.indexOf(v);
  var D = derived();
  if (at !== -1) S.picks.splice(at, 1);          /* click it again to take it off */
  else if (S.picks.length < D.picks) S.picks.push(v);
  else return;                                   /* the board is full - drop one first */
  S.picks.sort(function(a,b){ return a-b; });
  /* CHANGING YOUR NUMBERS CLEARS THE LAST DRAW. Those ten tiles were scored
     against the selection you just abandoned. */
  S.last = null;
  hideBall();
  paint(); save();
});

$("shop").addEventListener("click", function(e){
  var b = e.target.closest("[data-buy]"); if (!b) return;
  buy(b.getAttribute("data-buy"));
});

$("tabShop").addEventListener("click", function(){
  S.showShop = !S.showShop; paintPanels(); save();
});
$("tabHelp").addEventListener("click", function(){
  S.showHelp = !S.showHelp; paintPanels(); save();
});
$("btnPlay").addEventListener("click", requestPlay);
$("btnMute").addEventListener("click", function(){
  S.muted = !S.muted;
  this.innerHTML = S.muted ? "&#10005;" : "&#9834;";
  this.title = S.muted ? "Unmute" : "Mute";
  /* THE SCORE NEEDS DUCKING, NOT A GUARD. Every synthesised effect checks
     S.muted before it makes a node, so muting simply stops them being born.
     The bed is already playing by then and would carry on underneath — a
     mute button that silences the beeps and leaves the music is worse than
     no mute button at all. */
  musicMuted(S.muted);
  save();
});
$("btnWipe").addEventListener("click", function(){
  if (!confirm("Erase your save and start over? This fires the hired help too, and cannot be undone.")) return;
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  wipeProgress();
  hidePeek();
  shopSig = null; rowSig = null;               /* force both shops to redraw */
  paintStreamersFull();
  paint(); flush();
});
function typing(){
  var a = document.activeElement;
  return !!a && (a.tagName === "INPUT" || a.tagName === "SELECT" || a.tagName === "TEXTAREA");
}
document.addEventListener("keydown", function(e){
  if (e.key === "`"){ if (typing()) return; e.preventDefault(); setDev(!DEV); return; }
  /* TEMPORARY, FOR LOOKING AT THE FEATURE. Five ordinary draws and then the
     gem, because what needs judging is the moment it interrupts a normal
     session — not the animation on its own. */
  if (e.key === "l" || e.key === "L"){
    if (typing()) return;
    e.preventDefault();
    if (S.animating) return;
    if (S.picks.length !== derived().picks) return;
    devRehearse(5, 1000);
    return;
  }
  /* TEMPORARY, ALONGSIDE L. Arms the mine for the next settled draw, so it is
     judged as an interruption rather than from a standing start. */
  if (e.key === "m" || e.key === "M"){
    if (typing()) return;
    e.preventDefault();
    if (S.animating || S.stage >= LAST_STAGE) return;
    S.dev.forceMine = true;
    if (S.picks.length === derived().picks) requestPlay();
    return;
  }
  if (e.key === " " || e.key === "Enter"){
    if (typing()) return;
    if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
    if (document.activeElement && document.activeElement.classList.contains("kt")) return;
    e.preventDefault(); requestPlay();
  }
});
/* THE TWO EVENTS THAT ACTUALLY FIRE WHEN A PAGE GOES AWAY. beforeunload is
   not reliable on mobile - a backgrounded tab can be killed without it - so
   the visibility change is the one carrying the weight. */
document.addEventListener("visibilitychange", function(){ if (document.hidden) flush(); });
window.addEventListener("pagehide", flush);

var had = load();
$("btnMute").innerHTML = S.muted ? "&#10005;" : "&#9834;";
/* the save note was removed; load() still runs for its return value */
setDev(DEV);
paintStreamersFull();
initStreamers();
startAuto();
paint();
/* ARMED, NOT STARTED. No browser will open an AudioContext without a user
   gesture, so the score cannot begin on load however much we would like it
   to — "music from the moment you log in" is really "from the first click".
   `musicArm` waits for that first touch, then fetches, decodes and starts. */
musicArm();
</script>
