<script>
/* ═══════════════════════════════════════════════════════════════════════
   KENO IDLE — milestone 2, plus developer tools.

   1. THE STAKE IS NEVER DEDUCTED. `bet` scales the payout and nothing
      else, so a draw that pays zero costs nothing and the counter can
      never go down. Upgrades cost money; playing does not.

   2. NO FRACTIONAL CENTS, EVER. Money is an integer number of cents and
      every multiplier is a whole number, so a payout is integer x integer.
      Nothing rounds, so nothing drifts — floats never touch the balance.

   3. NO HOUSE EDGE. k numbers returns EXACTLY k times the bet per draw:
      one number is exactly 100%, two is exactly 200%, and so on, in both
      paytables. Exact in integer arithmetic — see kenoExact().
   ═══════════════════════════════════════════════════════════════════════ */
function $(id){ return document.getElementById(id); }
function int(v, d){ var n = Math.floor(Number(v)); return isFinite(n) ? n : d; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* ═══════════════ THE BOARD IS A SIZE, NOT A CONSTANT ══════════════════
   THE GAME USED TO BE 40 TILES AND 10 DRAWN, WRITTEN AS LITERALS in six
   places. It now opens at 2x2 and is blown open a stage at a time, so both
   numbers are state and every formula that used to divide by four divides by
   the tile count instead.

   THE ONE IDENTITY THAT SURVIVES ALL OF IT. A draw of D from N with k picked
   averages exactly k*D/N hits, so a table paying (k+1) a hit returns

       RTP(k) = k(k+1) * D/N

   at ANY board size. `SMOOTH` never needs re-solving, and payouts stay whole
   because every multiplier is whole. What the old code called "the quarter"
   is just D/N at 10 of 40; nothing was special about it except that it was
   fixed. See kenoTargetRTP().

   D/N IS THE ONLY THING GROWTH CAN PAY WITH. Every quarter-preserving size
   returns exactly the same RTP -- 4x1, 8x2, 12x3 and 40x10 all pay 1.5 at two
   numbers -- so a board that grows on the quarter pays NOTHING for growing
   and is only a gate on how many numbers fit. Stage 2 therefore takes a
   second ball as well as a column: 6 tiles with 1 drawn would pay 1.0 where
   2x2 paid 1.5, and the biggest event in the early game would make the player
   poorer. With 2 drawn it pays 2.0. The rule for every future stage is that
   D/N must not fall.

   ONLY STAGES 1 AND 2 ARE DESIGNED. The rest carry a plausible size, a `tbd`
   flag, and the smallest ball count that does not let D/N fall -- integer
   rounding at 16 and 20 tiles ratchets it to two fifths and it stays there.

   THE LAST STEP IS THE ONE DROP IN THE ARC, AND IT IS THE OPEN QUESTION.
   0.400 -> 0.250 at 40 tiles is a 37% cut to board income at the moment the
   board finishes growing. It is left in because the final row is TODAY'S BOARD
   -- 40 tiles, 10 balls, the geometry the whole 2026-08-25 rebalance was
   measured against -- and moving it silently would retune the endgame as a
   side effect of building the opening. The arc cannot both rise above the
   quarter early and end at 40x10; one of the two has to give, and which one
   is a decision, not a cleanup. Note that it is nearly free either way: the
   board is about 5% of income by hour 48, so even a 60% swing in the endgame
   board moves total income by ~3%. */
var STAGES = [
  { cols:2, rows:2, drawn:1 },                      /* 4 tiles,  D/N 0.250 */
  { cols:3, rows:2, drawn:2 },                      /* 6 tiles,  D/N 0.333 */
  { cols:3, rows:3, drawn:3, tbd:true },            /* 9         0.333 */
  { cols:4, rows:3, drawn:4, tbd:true },            /* 12        0.333 */
  { cols:4, rows:4, drawn:6, tbd:true },            /* 16        0.375 */
  { cols:5, rows:4, drawn:8, tbd:true },            /* 20        0.400 */
  { cols:5, rows:5, drawn:10, tbd:true },           /* 25        0.400 */
  { cols:6, rows:5, drawn:12, tbd:true },           /* 30        0.400 */
  { cols:7, rows:5, drawn:14, tbd:true },           /* 35        0.400 */
  { cols:8, rows:5, drawn:10 }                      /* 40        0.250  TODAY -- see below */
];
var LAST_STAGE = STAGES.length - 1;

/* READ BY EVERY KENO FUNCTION, and deliberately NOT read off `S`. These are
   called from load-time code paths where `S` is still hoisted-undefined, and
   a geometry that silently read `undefined.stage` would come out as 40 tiles
   without ever throwing. setStage() is the only writer. */
var BOARD = { stage:0, cols:2, rows:2, tiles:4, drawn:1 };
var POOL = [];
function setStage(i){
  i = clamp(int(i, 0), 0, LAST_STAGE);
  var st = STAGES[i];
  BOARD.stage = i; BOARD.cols = st.cols; BOARD.rows = st.rows;
  BOARD.tiles = st.cols * st.rows;
  BOARD.drawn = Math.min(st.drawn, BOARD.tiles);
  POOL.length = 0;
  for (var t = 1; t <= BOARD.tiles; t++) POOL.push(t);
}
setStage(0);

/* THE PICK CAP IS THE BOARD, NOT THE SHOP. Picking every tile but the ones
   that cannot be drawn is a guaranteed win with no variance -- on 2x2 with one
   ball, four numbers pays 5x every single draw -- so the cap is the largest k
   that can still miss. It binds only at the opening; from stage 2 on, the
   price of the next number binds first. */
function maxPicks(){ return Math.max(1, Math.min(9 + 1, BOARD.tiles - BOARD.drawn)); }

/* ── exact keno, N tiles, D drawn, k picked ─────────────────────────── */
function C(n,k){ if (k < 0 || k > n) return 0; var r=1; for (var i=0;i<k;i++) r = r*(n-i)/(i+1); return r; }
function kenoP(k, h){ return C(BOARD.drawn,h) * C(BOARD.tiles-BOARD.drawn,k-h) / C(BOARD.tiles,k); }

/* ═══════════════════════ the two paytables ════════════════════════════
   THESE ARE THE SAME TRADE, PRICED TWO WAYS, and there is no third option
   that dodges it. A draw of 10 from 40 with k picked averages k/4 hits, so
   paying 4 per hit returns exactly 4 x k/4 = k — the SMOOTH table below,
   which spends the entire budget and leaves nothing for a jackpot. That is
   not a tuning accident: with every tier at 4h the budget is exactly
   consumed, so ANY jackpot has to be funded by paying some other tier LESS
   than it paid at a lower pick count.

   SMOOTH pays 4 x hits at every pick count. Nothing ever pays less than it
   did before — one match is 4x whether you play one number or ten — and
   nothing ever pays big either. 10 of 10 is 40x.

   JACKPOT sells the common tiers down to fund the top one. The exchange
   rate is terrible early and absurd late: at 2 numbers, cutting a match
   from 4x to 1x buys a 28x top; at 10 numbers, the same kind of cut buys
   over a million. That is why its low rows look mean and its top rows look
   ridiculous.

   Both return exactly k. The difference is entirely where the money sits. */
/* EVERY MATCH IS WORTH k+3, so h matches pay (k+3)*h. One number pays 4 a
   match, two pays 5, three pays 6, and so on up to 13 at ten numbers.

   The point of the +1 is that adding a number RAISES EVERY ROW AT ONCE. A
   single match is 2x on one number and becomes 3x on two — nothing on the
   board ever pays less than it did before, which a flat per-hit table could
   not manage without also being unable to grow. */
var SMOOTH = (function(){
  var t = {};
  for (var k=1;k<=10;k++){ t[k] = {}; for (var h=1;h<=k;h++) t[k][h] = (k+1)*h; }
  return t;
})();
/* THE SAME BUDGET, SHAPED AS A JACKPOT. Re-solved against k(k+3)/4 so that
   switching tables changes where the money sits and not how much there is —
   a toggle that also moved the total would be comparing two things at once.
   Tiers three and up are left exactly where SMOOTH puts them; only the one
   and two match rows are sold down, because they are the only rows common
   enough to fund a top tier worth having. */
var JACKPOT = {
  1:  {1:2},
  2:  {1:3, 2:6},
  3:  {1:1, 2:3,  3:177},
  4:  {1:2, 2:10, 3:15, 4:600},
  5:  {1:2, 2:3,  3:18, 4:24, 5:10905},
  6:  {1:1, 2:2,  3:21, 4:28, 5:35, 6:111228},
  7:  {1:1, 2:5,  3:24, 4:32, 5:40, 6:48, 7:934262},
  8:  {1:1, 2:2,  3:27, 4:36, 5:45, 6:54, 7:63, 8:13119672},
  9:  {1:1, 2:2,  3:30, 4:40, 5:50, 6:60, 7:70, 8:80, 9:217576215},
  10: {1:1, 2:2,  3:33, 4:44, 5:55, 6:66, 7:77, 8:88, 9:99, 10:6698347610}
};
var TABLES = { smooth: SMOOTH, jackpot: JACKPOT };
function pays(){ return TABLES[S.table] || SMOOTH; }

function kenoTiers(k){
  var tab = pays()[k] || {}, out = [];
  for (var h = 0; h <= k; h++) if (tab[h]) out.push({ hits: h, pay: tab[h], p: kenoP(k, h) });
  return out;
}
/* THE CHECK THAT THE TABLE IS WHAT IT CLAIMS, done in integers — sum of
   C(10,h)*C(30,k-h)*payout against k*C(40,k) — because the whole point is
   that these are exact and a float comparison could not tell. */
/* THE BUDGET, AND WHERE IT COMES FROM. A draw of 10 from 40 with k picked
   averages exactly k/4 hits (hypergeometric mean, k * 10/40), so a table
   paying k+1 a hit returns exactly k(k+1)/4 times the bet — 0.5 at one
   number, climbing to 27.5 at ten. The board is deliberately weak on its own
   now; the hired help are where the money is.

   The numerator is an integer at every k even though the RTP itself is
   sometimes a half — which matters, because a half-cent RTP is fine (it is
   an average) while a half-cent PAYOUT would not be. Payouts stay whole
   because every multiplier is whole. */
function kenoTargetRTP(k){ return k * (k+1) * BOARD.drawn / BOARD.tiles; }
function kenoExact(k, tab){
  tab = (tab || pays())[k] || {};
  var s = 0;
  for (var h=0; h<=k; h++) if (tab[h]) s += Math.round(C(BOARD.drawn,h)*C(BOARD.tiles-BOARD.drawn,k-h)) * tab[h];
  return { got: s, want: kenoTargetRTP(k) * Math.round(C(BOARD.tiles,k)) };
}
function kenoRTP(k){ return kenoExact(k).got / Math.round(C(BOARD.tiles,k)); }
function rtpText(k){
  var r = kenoTargetRTP(k);
  return (r % 1 === 0) ? String(r) : r.toFixed(1);
}

function shuffle(a){
  for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), x=a[i]; a[i]=a[j]; a[j]=x; }
  return a;
}
/* KEPT UNDER ITS OLD NAME because sixteen call sites say draw10() and the
   thing it does has not changed -- it draws the board's ball count, which
   happens to have been ten. */
function draw10(){
  var a = POOL.slice(), n = BOARD.tiles, d = BOARD.drawn;
  for (var i=0;i<d;i++){
    var j = i + Math.floor(Math.random()*(n-i));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a.slice(0,d);
}

/* ═══════════════════════════════ upgrades ═════════════════════════════
   UPGRADES ARE DATA, NOT CODE. Adding one is adding a row: the shop, the
   costs, the developer panel and the save all read this array. */
/* ═══════════════════════════ the bet ladder ═══════════════════════════
   THE STEP COARSENS AS THE BET GROWS, so raising the bet never turns into
   a hundred identical purchases. A penny at a time up to a dime, then five
   at a time to fifty, then ten to a dollar, then quarters — and from a
   dollar up it repeats that same 1 / 2.5 / 5 shape once per decade.

       $0.01 → $0.10   a cent a step
       $0.10 → $0.50   five cents
       $0.50 → $1.00   ten cents
       $1.00 → $2.50   twenty-five cents
       $2.50 → $5.00   fifty cents
       $5.00 → $10.00  a dollar          ... and so on, x10 each decade
   ═══════════════════════════════════════════════════════════════════════ */
var BET_BANDS = (function(){
  var b = [ {from:1, step:1}, {from:10, step:5}, {from:50, step:10} ];

    b.push({ from:d,     step:d/4 });          /* $1.00 → quarters   */
    b.push({ from:d*2.5, step:d/2 });          /* $2.50 → half       */
    b.push({ from:d*5,   step:d   });          /* $5.00 → whole      */

function betStepAt(v){
  var step = 1;
  for (var i=0;i<BET_BANDS.length;i++) if (v >= BET_BANDS[i].from) step = BET_BANDS[i].step;
  return step;
}
var BET_LADDER = (function(){
  var out = [1], v = 1;
  while (v < 1e8){ v += betStepAt(v); out.push(v); }   /* stops at $1,000,000 a draw */
  return out;
})();
function betAt(lvl){ return BET_LADDER[clamp(lvl, 0, BET_LADDER.length - 1)]; }
/* How fast the bet track slows itself down. Payback time for one purchase

var BET_COST_POWER = 0.5;

/* How often auto-play draws once bought. BASE because the speed track that
   should follow it is a separate upgrade row and is not built yet. */
var AUTO_BASE_SECONDS = 5;
/* AUTO-PLAY IS FREE AND RUNS FROM THE FIRST SECOND, at a deliberately
   miserable one draw every five seconds — slower than anyone clicking, so
   it never competes with playing, it only means the board is never idle.
   What you buy is the SPEED: a quarter-second off the gap each time, floor
   0.25s, nineteen purchases from crawling to four draws a second. */
var AUTO_STEP_SECONDS = 0.25, AUTO_MIN_SECONDS = 0.25;
var AUTO_SPEED_MAX = Math.round((AUTO_BASE_SECONDS - 0.25) / 0.25);   /* 19 */
function autoSecsAt(lvl){
  return Math.max(AUTO_MIN_SECONDS, AUTO_BASE_SECONDS - AUTO_STEP_SECONDS * lvl);

/* The click pace prices are quoted against. Deliberately NOT the live rate:
   the dev panel's instant-reveal toggle must not reprice the shop. */
var REVEAL_TOTAL_REF = 715, CLICK_GAP_REF = 400;

/* ═══════════════════════ every price is a payback ═════════════════════
   THE OLD CURVES PRICED OFF THE WRONG THING. `extraPicks` cost 160 x 4^level
   — a fixed ladder — while what it BUYS scales with your bet, so the tenth
   number cost the same whether you were betting a cent or a thousand
   dollars. Measured, it returned 11,598 cents/hr per dollar early and 70,788
   late: it got BETTER the further you went. Every worker track had the same
   shape, anchored to the streamer's hire price while its value scaled with
   their rate and their bet.

   purchase earns in an hour, times how many hours it must take to repay
   itself — and payback is then the single dial, comparable across every
   track in the game. Wanting the hired help to overtake manual clicking is
   expressible directly: give your own board a payback that climbs steeply

   flipping instant reveal in the dev panel would silently reprice the shop. */
var PRICE_DRAWS_PER_HOUR = 3600000 / (REVEAL_TOTAL_REF + CLICK_GAP_REF);
function priceFor(gainPerHour, hours){ return Math.max(1, Math.round(gainPerHour * hours)); }

/* ── what you can see ──────────────────────────────────────────────────
   A shop listing everything at once is a wall of prices you cannot read.
   Anything you are not within a fifth of stays out of sight, so the shop is
   only ever the handful of things actually in play.

   KEYED ON THE HIGHEST BALANCE YOU HAVE EVER HELD, not on current cash.
   Against current cash a row would vanish the instant you spent, which is
   precisely when you just proved you were near it — the shop would flicker
   every purchase. Peak only ever rises, so a reveal is permanent.

function revealed(costCents){ return S.peakCents >= costCents * REVEAL_FRACTION; }

/* ═══════════════════ EVERY PRICE IN THIS GAME IS STATIC ═══════════════
   COOKIE CLICKER'S RULE, AND IT IS NOT NEGOTIABLE: a building costs its base
   price times 1.15 per one owned, and an upgrade costs what it costs. Nothing
   is ever re-quoted against how much you happen to be earning.

   This game had it dynamic for a while — the numbers and speed tracks priced
   as a share of total income — and it produced exactly the defect you would
   expect: buying a bet upgrade doubled the board's earnings and doubled the
   price of "play 2 numbers" along with it. $1.60 became $3.20 for doing
   something unrelated. A price that moves while you are saving for it is
   indefensible however good the pacing argument behind it, and the pacing is
   the thing to tune, not the price tag.

   So the ladders below are computed ONCE from constants and never consult
   the game state again. Pacing is tuned by choosing the growth factors and
   measuring the result. */
/* YOUR OWN BOARD CLIMBS STEEPLY. One board can only ever be one board, so
   pouring money into it should stop making sense early and leave hiring as
   the way forward. Payback rises with the bet itself, not the level index,
   so it cannot be outrun by the ladder's step sizes. */
/* ── BOARD_PAYBACK_BASE IS NOT A DIAL. IT CANCELS OUT. ────────────────
   It reads like the one number that sets early pacing, and it sets nothing.
   BET_COST_SCALE below is solved so the first bet upgrade costs exactly
   BET_FIRST_COST, and that solve divides by boardPaybackHours(1) — which is
   this constant. So it appears once in the numerator and once in the
   denominator of every price and vanishes:

       cost = gain x BASE x bet^POWER x shape x (anchor / BASE)

   Measured 2026-08-25: 0.027, 0.27 and 2.7 all give the identical ladder,
   with BET_COST_SCALE moving 5.736e-1, e-2, e-3 to absorb it. Change it and
   nothing happens. **The dials that do move the board are BET_FIRST_COST
   (the whole ladder, linearly) and BOARD_PAYBACK_POWER (its steepness).**
   Kept because the formula still reads correctly with it in place. */
var BOARD_PAYBACK_BASE  = 0.0270;            /* hours - see above, inert */
/* 0.90 -> 0.55 on 2026-08-25. The board used to climb steeply enough that
   it buried the hired help: by the time you could afford a streamer your own
   board was earning so much that the hire was a rounding error, and the help
   only ever caught up because they scale without limit. A shallower curve
   keeps the board's late rungs affordable, so it holds a steady ~5% of
   income instead of collapsing to nothing and then rebounding to a fifth. */
var BOARD_PAYBACK_POWER = 0.55;
function boardPaybackHours(betCents){
  return BOARD_PAYBACK_BASE * Math.pow(betCents, BOARD_PAYBACK_POWER);
}

/* ── the floor Cookie Clicker never needs ──────────────────────────────
   EVERY BUILDING IN COOKIE CLICKER COSTS x1.15 MORE THAN THE LAST, FOREVER.
   The factor is per purchase COUNT, so it never decays no matter what the
   building produces.

   Ours is priced off the bet, and inside a band the step is fixed, so the
   ratio is (b2/b1)^0.9 — which slides toward 1 as the bet climbs. Measured
   across one band: 1.87, 1.44, 1.30, 1.22, 1.18, 1.15, 1.13, 1.11. By the
   end of a band each purchase cost 11% more than the last and the prices
   felt static, which is exactly what they were.

/* THE BET LADDER'S PRICES, BUILT ONCE. Quoted at one number (RTP 1.0) so the
   figure never depends on how many numbers you happen to be playing — the

/* DERIVED FROM THE ANCHOR, not typed in. The ladder's shape comes out of the
   payback curve, but its absolute size has to hit a price somebody chose —
   and a hand-tuned constant silently drifts the moment anything upstream
   moves. A hardcoded 0.5 produced $0.44 here, because the reference click
   rate had changed by 15% in the same pass. Solve for it instead. */
/* $0.50 -> $14.00 on 2026-08-25, AND BACK TO $0.50 ON 2026-08-26. It moves
   the WHOLE ladder with it, linearly: BET_COST_SCALE is solved to anchor the
   first rung here, so every bet price in the game is this number times a
   fixed shape. There is no way to make only the first one cheaper.

   WHY IT WENT UP: at $0.50 the board compounded every ninety-seven seconds
   and hiring your first Lurker raised income by 1.4% — the first hire, which
   is supposed to be a moment, was a rounding error. $14.00 made it +59%.

   WHY IT CAME BACK DOWN: at $14.00 the first bet was twenty minutes from a
   new game, and the user's call was that this reads as unattainable rather
   than as expensive. It is the second purchase in the game and the first one
   that costs real time.

   WHAT IT COSTS, MEASURED by the timeline tool — impatient policy, full run,
   not estimated by hand:

                 first bet   first hire   help @48h
       $14.00       20.8m       1.34h        94.9%
       $0.50         4.3m       1.19h        78.9%

   So the hired help end up carrying four fifths of income rather than
   nineteen twentieths. THAT IS A REAL LOSS AGAINST THE 2026-08-25 TARGET of
   95%, and it is the price of the opening being reachable. If the late game
   starts feeling like the board again rather than the roster, this is the
   number that did it — and the fix is not to raise it back without also
   solving the opening it leaves behind. */
var BET_FIRST_COST = 50;                     /* $0.50 */
var BET_COST_SCALE = (function(){
  var step = BET_LADDER[1] - BET_LADDER[0];
  var raw = PRICE_DRAWS_PER_HOUR * step * boardPaybackHours(BET_LADDER[0]) * (BET_COST_SHAPE[0] || 1);

var BET_COSTS = (function(){

   income runs away with the hired help, so the last four numbers cost a
   rounding error and arrived within half an hour of each other. Measured:
   seven numbers at 4.9h and ten at 5.4h.

   Quoting the price as a share of TOTAL income makes each purchase cost a
   fixed amount of TIME instead of a fixed amount of money — however rich the
   streamers make you, the tenth number is still days of saving away, because
   the price grew with the wallet. That is the only way to pace something in
   hours rather than dollars. */
/* NINETEEN PURCHASES ACROSS THE WHOLE GAME, each a milestone. Priced in
   hours of TOTAL income like the numbers track, not against the board — the
   board's contribution is capped by how fast one board draws, so a price
   pinned to it would be loose change once the hired help arrive. The first
   one lands on exactly $100. */
var AUTOSPEED_BASE   = 10000;                /* $100 flat, for the first one */
var AUTOSPEED_GROWTH = 3.4;                  /* tuned by simulation, see below */
var PICKS_BASE   = 100;                      /* $1.00 flat, for the first one */
/* TUNED BY SIMULATION, NOT BY FEEL. Greedy play, buying numbers the instant
   they are affordable and reinvesting everything else. Measured:
     x14 -> ten numbers in 2.4 days     x20 -> 5.7 days
     x26 -> 14.7 days                   x34 -> 37 days
   x20 gives 5 numbers at 2.1h, 8 at 22.5h, 9 at 2.4d, 10 at 5.7d. */
var PICKS_GROWTH = 20;

var UPGRADES = [
  {
    id: "betSize",
    basic: true,
    max: BET_LADDER.length - 1,
    cost: function(lvl){ return BET_COSTS[Math.min(lvl, BET_COSTS.length - 1)]; },
    name: function(lvl){ return "Bet " + money(betAt(lvl + 1)); },
    desc: function(lvl){ return "Every draw pays on " + money(betAt(lvl + 1)) +
                                " instead of " + money(betAt(lvl)); },
    done: "Betting $1,000,000.00 a draw"
  },
  {
    id: "autoSpeed",
    max: AUTO_SPEED_MAX,
    cost: function(lvl){ return Math.round(AUTOSPEED_BASE * Math.pow(AUTOSPEED_GROWTH, lvl)); },
    name: function(lvl){ return "Auto-play every " + autoSecsAt(lvl+1).toFixed(2) + "s"; },
    desc: function(lvl){ return "A draw every " + autoSecsAt(lvl+1).toFixed(2) +

    done: "Auto-play at four draws a second"

  {
    id: "extraPicks",
    basic: true,
    max: 9,                                    /* 1 + 9 = the ten-tile cap */

       into it. It binds only at the opening: from stage 2 on the price of the
       next number arrives long before the room for it runs out. */
    gate: function(){ return upLevel("extraPicks") + 2 <= maxPicks(); },
    cost: function(lvl){ return Math.round(PICKS_BASE * Math.pow(PICKS_GROWTH, lvl)); },
    name: function(lvl){ return "Play " + (lvl + 2) + " numbers"; },
    /* Sold on the multiplier rather than the return, because the multiplier
       is the number on the board in front of you. */
    desc: function(lvl){ return "Every match pays " + (lvl + 3) + "× instead of " + (lvl + 2) + "×"; },
    done: "Playing all ten numbers"
  }
];
function upDef(id){ for (var i=0;i<UPGRADES.length;i++) if (UPGRADES[i].id===id) return UPGRADES[i]; return null; }
function upLevel(id){ return S.upgrades[id] || 0; }

/* ═══════════════════════════════ state ════════════════════════════════
   UPGRADE LEVELS ARE THE SAVE FILE. Nothing derived is stored — bet and
   pick allowance are recomputed from levels every time they are read. */
/* ONE DEFINITION OF "A NEW GAME", used both to boot and to wipe. Erasing
   used to re-list these fields by hand, which meant it quietly missed
   whatever had been added since: the hired help survived the wipe, kept
   earning, and got written straight back to disk by the save on the next
   line. A field added here now cannot be forgotten by the reset. */
function freshState(){
  return {
    cents: 0, peakCents: 0,
    history: [],
    upgrades: { betSize: 0, autoSpeed: 0, extraPicks: 0 },
    autoOn: true,
    picks: [], last: null,
    revealUpto: null, animating: false, muted: false,
    draws: 0, wonCents: 0, firstBall: 0,
    /* THE BOARD'S SIZE IS PROGRESS, so it is saved and it is wiped. `mineDraws`

       one can be guaranteed rather than merely likely — see MINE_ODDS. */
    /* `stageDraws` counts draws played on the CURRENT board and resets every
       time it grows; `mineDraws` counts draws since the mine armed. They are
       two different clocks — one paces the arc, the other floors the roll. */
    stage: 0, mineDraws: 0, stageDraws: 0,

       progress — but it is what the readout prints and what the first enemy
       will read. */
    lastShock: 0,
    /* WHICH SIDE PANELS ARE OPEN. Saved, because a player who closed the shop
       to look at the board meant it, and having it reopen on reload would be
       the game arguing with them. */
    showShop: true, showHelp: true,
    /* THE HIRED HELP DOES NOT EXIST YET. Not "is not affordable" — does not
       exist: no panel, no tab, no hint that a roster is coming. It is unlocked
       by the mini-boss, and until something calls unlockHelp() this half of
       the game is not part of the game. Progress, so it is saved and wiped. */
    helpUnlocked: false,
    table: "smooth",
    streamers: {},                             /* id -> {n,smart,bet,picks,board,last} */
    /* pingVoice is a dev override for the tile ping's four voices — null

/* Wipes progress in place — mutating rather than replacing S, because other

function wipeProgress(){
  document.body.classList.remove("bwafter");
  var muted = S.muted, table = S.table, dev = S.dev;
  var f = freshState();
  for (var k in f) if (Object.prototype.hasOwnProperty.call(f, k)) S[k] = f[k];

/* THE ONE PLACE THE BET IS RESOLVED. It reads the ladder, not the level

   which meant the shop sold a $0.40 bet and the board kept paying on
   $0.15: the display was wrong AND every payout was short. */

function money(cents){

  if (d >= 1e6)  return "$" + (d/1e6).toFixed(2) + "M";

/* ═══════════════════════════════ the save ═════════════════════════════ */
/* SANDBOXED SAVE - its own key, so opening this link cannot touch the live

var SAVE_KEY = "kenoidle.save.walker-preview", saveTimer = null;
function saveNow(){
  saveTimer = null;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 1, cents: S.cents, peakCents: S.peakCents, upgrades: S.upgrades, picks: S.picks,
      autoOn: S.autoOn,
      draws: S.draws, wonCents: S.wonCents, firstBall: S.firstBall,
      stage: S.stage, mineDraws: S.mineDraws, stageDraws: S.stageDraws,
      showShop: S.showShop, showHelp: S.showHelp,
      helpUnlocked: S.helpUnlocked,

function save(){ if (saveTimer === null) saveTimer = setTimeout(saveNow, 600); }
/* FLUSH ALWAYS WRITES, pending timer or not. Guarding it on a pending save

   writes through flush() and usually has no debounced save outstanding. */
function flush(){
  if (saveTimer !== null){ clearTimeout(saveTimer); saveTimer = null; }
  saveNow();
}

/* EVERY FIELD IS RECHECKED ON THE WAY IN. A save is a string in a store the
   player can edit, and a bad one should degrade to a fresh game rather than
   a broken one - an out-of-range pick count would put the board in a state
   Play can never satisfy. */
function load(){
  var raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  if (!raw) return false;
  var o = null;
  try { o = JSON.parse(raw); } catch (e) { return false; }
  if (!o || o.v !== 1) return false;

  S.cents    = Math.max(0, int(o.cents, 0));
  /* never below the balance itself, or a hand-edited save could hide rows
     you have already unlocked */
  S.peakCents = Math.max(S.cents, int(o.peakCents, 0));
  S.draws    = Math.max(0, int(o.draws, 0));
  /* A save written before the scripted ball existed has no flag, so a player
     already past the 250th draw gets theirs on the next one. That is the
     right way round: they may well never have seen a ball, and the cost of
     being wrong is one sub-100x drop. */
  S.firstBall = o.firstBall ? 1 : 0;
  S.wonCents = Math.max(0, int(o.wonCents, 0));
  S.muted    = !!o.muted;
  S.autoOn   = (o.autoOn === undefined) ? true : !!o.autoOn;
  S.table    = TABLES[o.table] ? o.table : "smooth";
  /* THE STAGE IS RESTORED BEFORE ANYTHING ELSE IS VALIDATED. Tile numbers,
     pick counts and streamer boards are all only meaningful against a board
     size, so reading them first would check them against 2x2 and throw away
     a legitimate late save. A save from before the board grew has no stage
     and starts at the opening, which is correct: it also has no upgrades. */
  S.stage = clamp(int(o.stage, 0), 0, LAST_STAGE);
  setStage(S.stage);
  S.mineDraws = Math.max(0, int(o.mineDraws, 0));

    ? Math.max(0, int(o.draws, 0)) : Math.max(0, int(o.stageDraws, 0));

     must read as OPEN rather than as closed — otherwise the upgrade shop

  S.showShop = (o.showShop === undefined) ? true : !!o.showShop;
  S.showHelp = (o.showHelp === undefined) ? true : !!o.showHelp;

  S.streamers = {};
  var sv = (o.streamers && typeof o.streamers === "object") ? o.streamers : {};
  for (var q=0;q<STREAMERS.length;q++){
    var def = STREAMERS[q], raw = sv[def.id];
    if (!raw) continue;
    var n = Math.max(0, int(raw.n, 0));
    if (n <= 0) continue;
    var st = {
      n: n,
      smart: clamp(int(raw.smart, 0), 0, MAX_SMART),
      bet:   clamp(int(raw.bet,   0), 0, MAX_SBET),
      picks: clamp(int(raw.picks, 0), 0, maxPicksFor(def)),
      draws: Math.max(0, int(raw.draws, 0)),
      /* the carried quarter-cents are worth keeping across a reload; anything
         outside 0..3 is not a carry, it is a tampered save */
      centsCarry: clamp(int(raw.centsCarry, 0), 0, 3),
      carry: 0, last: null, board: null
    };
    var want = Math.min(10, def.picks + st.picks), seen2 = {}, bd = [];
    var arr2 = Array.isArray(raw.board) ? raw.board : [];
    for (var b=0;b<arr2.length && bd.length<want;b++){
      var bv = int(arr2[b], 0);
      if (bv >= 1 && bv <= BOARD.tiles && !seen2[bv]){ seen2[bv] = 1; bd.push(bv); }
    }
    st.board = bd.length === want ? bd.sort(function(a,b2){ return a-b2; }) : rollBoard(want);
    S.streamers[def.id] = st;
  }
  return true;
}

/* ═══════════════════════════════ sound ════════════════════════════════ */
var AC = null;
function audio(){
  if (AC === null){
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { AC = false; }
  }
  return AC;
}
function tone(freq, at, len, peak, shape){
  var ac = audio(); if (!ac) return;
  var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at;
  o.type = shape || "triangle";
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + len + 0.02);
}
/* THE BALL'S SOUND. It was being CALLED and never defined — brought over from
   martingale along with tone() and ping(), except this one was not. Every
   unmuted ball drop therefore threw a ReferenceError, and because that call
   sat ahead of the timer that lowers `animating`, it locked the board with
   the ball frozen on it. A rising arpeggio, because the ball only ever
   arrives with good news. */
/* A LOW BODY THAT FALLS IN PITCH. Both drop sounds are built on one of
   these — it is the part you feel rather than hear, and it is what makes a
   landing read as weight instead of sparkle. */
function thud(from, to, dur, peak){
  var ac = audio(); if (!ac) return;
  var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = "sine";
  o.frequency.setValueAtTime(from, t);
  o.frequency.exponentialRampToValueAtTime(to, t + dur * 0.72);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
}

/* THE ORDINARY BALL LANDING. This was three rising bell tones in a major
   shape, which is a nice sound and entirely the wrong one — it congratulated
   you before the draw had finished happening. Now it lands: a falling body
   under a tritone, the interval that refuses to settle, with one cold ring
   above so it is not just mud. */
function chime(){
  if (S.muted) return;
  var ac = audio(); if (!ac) return;
  if (ac.state === "suspended") ac.resume();
  thud(140, 42, 0.55, 0.22);
  tone(146.83, 0.010, 0.58, 0.070, "triangle");   /* D3  */
  tone(207.65, 0.022, 0.56, 0.052, "triangle");   /* G#3 - a tritone up */
  tone(1108.7, 0.030, 0.40, 0.026, "sine");
  tone(1661.2, 0.055, 0.28, 0.016, "sine");
}

/* ═══════════════════════ THE BIG WIN NOISE ═══════════════════════════
   A cabinet fanfare, built out of the same oscillator everything else uses.
   Three parts, because that is what the shape is made of: a fast ascending
   run that says something is happening, a held major triad that says it is
   good, and a low thump underneath so it has a floor. The run climbs two
   octaves in half a second — slower and it reads as a menu chime, faster and
   the notes stop resolving.

   Reserved for the gem tiers. If every ball played this, none of them would
   mean anything. */
/* THE GEM LANDING. Also a rising major run before, which on top of a
   sixteen-second build read as a cartoon. This is the same idea as the cue
   that opened the event: something large arriving, in a minor shape, that
   does not resolve — the resolution is the money, and that has not been
   counted yet. */
function bigWinFanfare(){
  if (S.muted) return;
  var ac = audio(); if (!ac) return;
  if (ac.state === "suspended") ac.resume();
  thud(190, 33, 1.15, 0.30);
  /* low stabs, then a fall of a major third rather than a climb */
  tone(110.00, 0.000, 0.90, 0.100, "sawtooth");   /* A2 */
  tone(130.81, 0.018, 0.90, 0.072, "sawtooth");   /* C3  - minor */
  tone(164.81, 0.036, 0.90, 0.058, "sawtooth");   /* E3 */
  tone( 87.31, 0.300, 1.15, 0.090, "triangle");   /* F2  - it drops */
  tone(103.83, 0.320, 1.15, 0.064, "triangle");   /* G#2 */
  /* and a cluster overhead that hangs instead of landing */
  tone(880.00, 0.10, 1.70, 0.028, "sine");
  tone(932.33, 0.14, 1.70, 0.022, "sine");        /* a semitone off it */
  tone(1396.9, 0.19, 1.45, 0.018, "sine");
}

/* each hit in a draw rings a step higher, the way keno games do */
/* ═══════════════ THE TILE PING, AND WHY IT HAS FOUR VOICES ════════════
   IT WAS A WHOLE-TONE RUN FROM C5 ON A BARE TRIANGLE — C, D, E, F#, G#, A#
   — which is the arcade bing, and against the score it is simply the wrong
   music. The takeover is A minor with a suspended fourth; whole tone leaves
   that key on its fourth step, when the F# arrives, and never comes back.

   THE FIX IS NOT TO REPLACE IT. The game opens as a stark black desktop
   tool and ends as a cathedral, and starting arcade is what gives the
   ending somewhere to have come from. So the bing is the FIRST RUNG of a
   ladder rather than a mistake, and what changes is the voice.

   Tiers ride `extraPicks`, which is already the progression gate and is
   literally how many pings you hear per draw, so the voice grows with the
   thing that makes more of it.

   THE TAKEOVER ALWAYS USES THE TOP VOICE regardless of progress, because
   the takeover always has the same score under it. A tier-0 player hitting
   a gem should not get arcade beeps over a pipe organ.

   PENTATONIC AT THE TOP, NOT THE FULL MINOR SCALE. During the pick wave a
   comet lands every 260ms and the release is 700ms, so three or four notes
   ring together. A natural minor stacked that way gives semitone clashes —
   B against C, E against F. A minor pentatonic (A C D E G) has no semitone
   anywhere in it, so every combination that can occur is consonant, and the
   run accumulates into a chord instead of a pile-up. */
var PING_PENTA = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22];   /* A minor pentatonic */
/* ONE DIAL FOR ALL FOUR VOICES. They were mixed against the synthesised
   effects alone; with a score underneath they sat 40% too loud, and
   trimming each voice separately would only invite them to drift apart.
   Every peak below is multiplied by this. */
var PING_GAIN = 0.60;

var PING_NAMES = ["arcade", "warmer", "organ", "cathedral"];
var devPingTimers = null;

function pingVoice(){
  var lvl = upLevel("extraPicks");
  if (lvl <= 2) return 0;                    /* arcade - exactly what shipped */
  if (lvl <= 5) return 1;                    /* warmer */
  if (lvl <= 8) return 2;                    /* organ */
  return 3;                                  /* cathedral */
}

function ping(step, voice){
  if (S.muted) return;
  var ac = audio(); if (!ac) return;
  if (ac.state === "suspended") ac.resume();
  /* THE DEV LOCK BEATS EVERYTHING, including the explicit 3 the takeover
     passes — the whole point of it is to hear one voice against the score
     and compare, and an override the takeover ignores could not do that. */
  var v = (S.dev.pingVoice !== null && S.dev.pingVoice !== undefined) ? S.dev.pingVoice
        : (voice === undefined) ? pingVoice() : voice;
  var n = Math.min(step, 10);

  if (v === 0){ tone(523.25 * Math.pow(2, n * 2 / 12), 0, 0.26, 0.16 * PING_GAIN); return; }
  if (v === 1){ tone(261.63 * Math.pow(2, n * 2 / 12), 0, 0.45, 0.13 * PING_GAIN); return; }
  if (v === 2){
    var f = 261.63 * Math.pow(2, n * 2 / 12);
    tone(f, 0, 0.60, 0.10 * PING_GAIN);
    tone(f * 2 / 3, 0.004, 0.60, 0.055 * PING_GAIN, "sine");   /* a fifth beneath */
    return;
  }
  /* cathedral: A minor pentatonic from A3, with an octave under it for the
     weight the organ has and a triangle cannot.

     `n - 1`, BECAUSE THE FIRST HIT IS step 1, NOT step 0. Indexing straight
     off `n` starts the run on the second degree and the root never sounds at
     all — which is the same off-by-one the arcade voice has, where
     `523.25 * 2^(1*2/12)` means its "C5" run has always actually begun on
     D5. That one is left alone because it is what shipped and players know
     the sound; this one is new and should start where it says it does. */
  var semis = PING_PENTA[Math.min(n - 1, PING_PENTA.length - 1)];
  var hz = 220.0 * Math.pow(2, semis / 12);
  tone(hz, 0, 0.70, 0.060 * PING_GAIN);
  tone(hz / 2, 0.006, 0.80, 0.032 * PING_GAIN, "sine");
}

/* ═══════════════════════════════ painting ═════════════════════════════ */
/* THE TILES ARE UPDATED IN PLACE, NEVER REBUILT.

   `innerHTML = html` throws away all forty elements and makes forty new ones,
   which restarts every CSS animation running on them. During the takeover a
   tile turns over every 667ms, so the picked tiles' 3.4s hue cycle was reset
   five times before it could get a fifth of the way round — the rainbow never
   arrived, it just flickered near one colour. The board's structure never
   changes between growths (it is tiles 1 to BOARD.tiles), so there is nothing
   to rebuild; only classes and labels move. A STAGE CHANGE IS THE ONE TIME A
   REBUILD IS RIGHT — the structure genuinely changed — and growBoardTo() owns
   the animation across it. Clicks are delegated on #board, so no
   listeners are lost either way.

   Writing className unconditionally would restart them just the same, hence
   the compare-before-write on every attribute. */
function paintBoard(){
  var all = (S.last && S.last.drawn) ? S.last.drawn : [];
  var drawn = S.revealUpto === null ? all : all.slice(0, S.revealUpto);
  var newest = S.revealUpto === null ? -1 : all[S.revealUpto - 1];
  var board = $("board");

  /* WRITTEN ON THE CARD, NOT THE BOARD, so the play row inherits it too and
     can solve to the same width. */
  var card = $("boardCard");
  if (card){
    if (card.style.getPropertyValue("--bcols") !== String(BOARD.cols))
      card.style.setProperty("--bcols", String(BOARD.cols));
  }

  if (board.children.length !== BOARD.tiles){
    var html = "";
    for (var q=1;q<=BOARD.tiles;q++){
      /* EACH TILE ENTERS THE RAINBOW AT ITS OWN POINT. Every winning square
         ran `bwcyc` from the same zero, so forty tiles cycled in perfect
         lockstep and the board was one flat colour that changed together.
         A negative delay starts the animation partway through, so spreading
         it across the cycle by tile number lays a spectrum over the grid —
         SCATTERED, NOT RAMPED. A linear `-(q/40)*3.4s` walks the spectrum in
         board order, and a row is eight consecutive numbers — 680ms of a
         3.4s cycle, which is 72 degrees. So every row came out as one colour
         with the next row a shade along, which is a gradient, not a scatter.

         The golden-ratio conjugate is what fixes it: `(q * 0.6180339887) % 1`
         is a low-discrepancy sequence, so consecutive tiles land far apart
         and — unlike actual randomness — no two ever bunch up. Deterministic,
         so a tile keeps its colour across repaints.

         SET AS A CUSTOM PROPERTY, NOT AS `animation-delay`. A blanket inline
         delay would also hit `ktpop` and `kthit`, the ordinary board's
         one-shot 0.2s and 0.34s pops — a -1.2s delay on a 0.2s animation
         means it is over before it is seen. `--kd` is read only by the rules
         that cycle. */
      var kd = -(((q * 0.6180339887) % 1) * 3.4);
      html += '<div class="kt" data-t="' + q + '" role="button" tabindex="0"' +
              ' style="--kd:' + kd.toFixed(3) + 's">' + q + '</div>';
    }
    board.innerHTML = html;
  }

  for (var t=1;t<=BOARD.tiles;t++){
    var el = board.children[t-1];
    var isPick = S.picks.indexOf(t) !== -1, isDrawn = drawn.indexOf(t) !== -1;
    /* the ball's tile stays ringed while the draw comes in, so you can watch
       the number it promised actually arrive — gems take the tile over
       instead, because an amber ring would fight a rainbow one */
    var abPlain = activeBall && activeBall.tile === t &&
                  (BALL_ART[activeBall.mult] || {}).kind !== "gem";
    var cls = "kt" + (isPick ? " pick" : "") + (isDrawn ? " drawn" : "") +
              (abPlain ? " ballspot" : "") + (t === newest ? " just" : "") +
              (bwKnocked && bwKnocked[t] ? " out" : "") +
              /* THE BOSS SMASHED THIS ONE. Folded in here rather than written
                 by the fight, because this function rewrites className on every
                 repaint and would undo anything set from outside — the same
                 reason `bwKnocked` is read here instead of being applied by the
                 storm that causes it. */
              (window.bossDead && window.bossDead[t] ? " bossdead" : "");
    if (el.className !== cls) el.className = cls;
    var lab = "Tile " + t + (isPick ? ", picked" : "");
    if (el.getAttribute("aria-label") !== lab) el.setAttribute("aria-label", lab);
    if (el.getAttribute("aria-pressed") !== String(isPick)) el.setAttribute("aria-pressed", String(isPick));
  }
  board.classList.toggle("revealing", S.animating);
}

/* Rebuilt only when a draw has actually landed — paintLive runs ten times a
   second and this list changes at most as often as the board draws. */
var histSig = null;
/* THE HISTORY STOPS WHERE THE BOARD DOES. Left to itself the list just grows
   down the page and drags the whole layout with it; measured against the
   board it stays a panel beside the game rather than a column of its own.
   Measured rather than guessed at a constant, because the board is a
   percentage width and its height moves with the viewport. */
/* sizeHistory() USED TO LIVE HERE, clamping the list's max-height to the
   board's so the two cards lined up and the overflow scrolled. Both halves of
   that are gone: there are only ever four cells, and the board's height is no
   longer a constant to match — it grows. */

/* NEW CELLS ARE PREPENDED; EXISTING ONES ARE NEVER TOUCHED.

   `innerHTML = html` rebuilt all of them on every single draw, which
   restarted the gem cell's hue cycle from red every time — the rainbow could
   never get past its first frame because a draw lands more often than the
   3.4s animation takes. (Exactly the bug the board tiles had, in a second
   place, for the same reason.)

   The list only ever grows at the front and is trimmed at the back, so the
   minimal update is: build a node for each entry added since the last paint,
   put those on the front, drop any overflow off the end. Every cell that was
   already there keeps its element, and therefore keeps its animation. */
function hcell(e){
  var paid = e.p > 0;
  var gem = e.b && (BALL_ART[e.b] || {}).kind === "gem";
  var d = document.createElement("div");
  d.className = "hcell" + (paid ? " won" : "") +
                (gem ? " gem" : e.b ? " ball" : e.m >= 100 ? " big" : "");
  d.title = e.h + " of " + e.k + (paid ? " · +" + money(e.p) : " · nothing") +
            (e.b ? " · ball " + e.b.toLocaleString() + "x" : "");
  d.innerHTML = '<div class="hmult">' + multText(e.b ? e.m * e.b : e.m) + 'x</div>' +
                '<div class="hhits">' + e.h + '<i></i></div>';
  return d;
}

var histDraws = -1;
function paintHistory(){
  var sig = S.draws + ":" + S.history.length;
  if (sig === histSig) return;
  histSig = sig;
  var list = $("histList");
  $("histCard").hidden = S.history.length === 0;
  if (!S.history.length){ list.innerHTML = ""; histDraws = S.draws; return; }

  /* how many entries arrived since the last paint */
  var add = (histDraws < 0 || S.draws < histDraws) ? S.history.length
                                                   : (S.draws - histDraws);
  if (add >= S.history.length || !list.children.length){
    list.innerHTML = "";                       /* nothing reusable */
    for (var i=0;i<S.history.length;i++) list.appendChild(hcell(S.history[i]));
  } else {
    for (var j=add-1;j>=0;j--) list.insertBefore(hcell(S.history[j]), list.firstChild);
    while (list.children.length > S.history.length) list.removeChild(list.lastChild);
  }
  histDraws = S.draws;
}


/* Rebuilt only when it would actually look different. paintLive runs ten
   times a second, and replacing this markup every tick would mean a click
   landing on a button destroyed between mousedown and mouseup. */
var shopSig = null;
function paintShop(){
  /* DEV and the instant toggle are in the signature because both change the
     per-hour figures without changing a single level. */
  var sig = (DEV ? "d" : "-") + (S.dev.instant ? "i" : "-") + "|";
  for (var s=0;s<UPGRADES.length;s++){
    var us = UPGRADES[s], ls = upLevel(us.id);
    var op = !us.gate || us.gate();
    var c0 = ls < us.max ? us.cost(ls) : 0;
    var vis = us.basic || ls >= us.max || revealed(c0);
    /* the PRICE is in the signature, not just whether you can afford it —
       a cost that moves without flipping affordability would sit stale */
    sig += us.id + ls + (vis?"v":"h") + (op?"o":"x") + Math.round(c0/100) +
           (op && ls < us.max && S.cents >= c0 ? "y" : "n") + "|";
  }
  if (sig === shopSig) return;
  shopSig = sig;

  var html = "";
  for (var i=0;i<UPGRADES.length;i++){
    var u = UPGRADES[i], lvl = upLevel(u.id), maxed = lvl >= u.max;
    if (!u.basic && !maxed && !revealed(u.cost(lvl))) continue;
    var open = !u.gate || u.gate();
    var cost = maxed ? 0 : u.cost(lvl), can = open && !maxed && S.cents >= cost;
    /* THE LEVEL COUNTER IS GONE. "LEVEL 0 OF 118" under "Bet $0.02" told you
       how far a ladder went, which is not a thing you act on, and put a second
       line of type under every row for it. The name already says what the
       purchase does. */
    html += '<div class="uprow' + (can ? " can" : "") + '">' +
            '<div><div class="un">' + (maxed ? u.done : u.name(lvl)) + '</div></div>' +
            '<button class="' + (can ? "primary" : "ghost") + '" data-buy="' + u.id + '"' +
            (can ? "" : " disabled") + '>' + (maxed ? "Maxed" : !open ? "Locked" : money(cost)) + '</button></div>';
  }
  $("shop").innerHTML = html;
}

/* THE TICK MUST NOT REBUILD MARKUP. paintLive() writes numbers into nodes
   that already exist; paint() replaces them. Ten repaints a second through
   paint() would fight the cursor for the hover preview and re-run the tile
   animations on a board nobody touched. */
function paintLive(){
  var D = derived();
  if (S.cents > S.peakCents) S.peakCents = S.cents;
  $("cash").textContent = money(S.cents);
  var perSec = streamerCentsPerSec();

  /* ROUGH ON PURPOSE, AND ONLY HALF OF IT IS A GUESS. The hired half is
     exact — their rate and paytable are known. The clicking half assumes
     you keep pressing Play at a steady pace, which nobody does forever, so
     the assumption is spelled out in the tooltip rather than implied by a
     confident-looking number. */
  /* ONE BOARD, ONE THROUGHPUT. Clicking and auto-play do not stack — both
     call play(), and either is blocked while the other's draw turns over —
     so the board runs at whichever is faster, not at their sum. */
  var hiredHr = perSec * 3600;
  var boardHr = boardCentsPerHour(D.betCents, D.picks);
  var autoHr  = autoCentsPerHour(D.betCents, D.picks);
  var passiveHr = autoHr + hiredHr;
  /* The note names what runs WITHOUT YOU, which is the exactly-known half —
     auto-play and the hired help both have known rates, while the clicking
     half is an assumption about how fast a person presses a button. */
  paintReadout(boardHr, hiredHr, passiveHr);

  paintShop();
  paintHistory();
  /* THE HIRE BUTTONS LIVE HERE TOO. They used to refresh only when a
     streamer drew, which needs a streamer — so with none owned nothing ever
     re-enabled them and the first hire was unbuyable at any balance. */
  paintStreamersLive();
  if (DEV) paintRate();
}

/* THE BOTTOM-LEFT READOUT. Everything the bank card used to say and stopped
   saying — the per-hour rate, the draw count, the hired trickle — at a size
   that stays out of the way. It is here to tune against, not to play against. */
function paintReadout(boardHr, hiredHr, passiveHr){
  var el = $("devReadout"); if (!el) return;
  var txt = money(Math.round(boardHr + hiredHr)) + "/hr" +
            (passiveHr > 0 ? "  ·  " + money(Math.round(passiveHr)) + "/hr idle" : "") +
            "  ·  " + S.draws.toLocaleString() + " draws" +
            (hiredHr > 0 ? "  ·  hired " + money(Math.round(hiredHr / 3600)) + "/s" : "") +
            /* UNTIL SOMETHING HAS HIT POINTS this is the only way to see the
               number the wave is carrying. It belongs in the readout, which is
               the corner for things that are being tuned rather than played. */
            (S.lastShock > 0 ? "  ·  shock " + S.lastShock.toLocaleString() : "");
  if (el.textContent !== txt) el.textContent = txt;
}

/* HOW LONG UNTIL AUTO-PLAY TAKES OVER, or -1 when nothing is counting. The
   three conditions are the same ones the idle timer itself checks — a
   countdown that ran while the timer could not fire would tick to zero and
   sit there. */
function autoIdleLeftMs(){
  if (S.autoOn || S.animating) return -1;
  if (S.picks.length !== derived().picks) return -1;
  return Math.max(0, IDLE_AUTO_MS - (Date.now() - lastPlayAt));
}
/* THE TABS AND WHAT THEY HIDE. `#colHelp` is also hidden by the game itself
   until the first streamer is affordable, so the tab only speaks for the part
   the player controls: a closed tab hides it, an open tab lets the game decide.
   Hiding the whole rail when both are closed keeps an empty bordered box from
   sitting on the edge. */
/* True if a saved roster has anybody in it. Reads the RAW save object rather
   than S, because it is asked during load() before the roster is rebuilt. */
function hasAnyHire(raw){
  if (!raw || typeof raw !== "object") return false;
  for (var k in raw){
    if (!Object.prototype.hasOwnProperty.call(raw, k)) continue;
    if (raw[k] && int(raw[k].n, 0) > 0) return true;
  }
  return false;
}

/* THE ONE DOOR IN. Call it from whatever ends the mini-boss; it is idempotent
   and it paints, so the panel and its tab appear the moment it runs. */
function unlockHelp(){
  if (S.helpUnlocked) return false;
  S.helpUnlocked = true;
  S.showHelp = true;                   /* newly given, so it opens */
  paintStreamersFull();
  paint(); flush();
  return true;
}

function helpAvailable(){ return S.helpUnlocked && helpHasRows; }

function applyHelpVisible(){
  var help = $("colHelp");
  if (help) help.hidden = !helpAvailable() || !S.showHelp;
  /* THE TAB GOES TOO, not just the panel. A tab labelled "Hired help" for a
     thing that does not exist is the same broken promise as an empty panel
     headed the same way — and it would be the only control on screen that
     opens nothing. */
  var th = $("tabHelp");
  if (th) th.hidden = !S.helpUnlocked;
}
function paintPanels(){
  var shop = $("colShop");
  if (shop) shop.hidden = !S.showShop;
  var ts = $("tabShop"), th = $("tabHelp");
  if (ts) ts.className = S.showShop ? "on" : "";
  if (th) th.className = S.showHelp ? "on" : "";
  applyHelpVisible();
}

/* HOW LONG UNTIL THE NEXT AUTO DRAW — the time until the next PUMP, recorded
   when the pump schedules itself.

   THE OBVIOUS VERSION IS WRONG AND IT MEASURES AS WRONG. `autoPump` banks owed
   time at `sps` a second, so `(1 - autoOwed) / sps` looks like the answer — but
   that assumes a draw happens the moment owed crosses 1, and it does not. The
   pump only draws when it RUNS, once every `1000 / sps` ms, taking whole owed
   units with it. Between runs owed sails past 1 and sits there: measured, the
   countdown pinned to 1 for four seconds of a five-second period and then
   jumped back to 5. A pump that lands mid-draw also resets the clock without
   drawing, which no accumulator sum can see.

   So the honest number is when the next pump fires, which is a thing the code
   already decides — it just was not writing it down. */
var autoNextAt = 0;
function autoNextDrawMs(){
  if (!S.autoOn || autoSps() <= 0 || !autoNextAt) return -1;
  var now = (window.performance && performance.now) ? performance.now() : 0;
  return Math.max(0, autoNextAt - now);
}

/* THE BET BAR REPORTS AUTO WHILE AUTO HAS THE BOARD. It is already the ghost
   colour in that state — the fill belongs to whatever you are meant to press
   next, and while auto is running that is nothing — so it may as well say what
   is happening instead of naming a stake you are not choosing to place. It is
   still live: pressing it takes the board back, which is what it did before. */
var autoTick = null;
function paintBetBar(){
  var lab = $("betlab"), amt = $("betAmt");
  if (!lab || !amt) return;
  var bar = $("btnPlay");
  if (S.autoOn){
    /* A COUNTDOWN, NOT A READOUT. Whole seconds — 5 4 3 2 1 — because that is
       a thing you watch land, where a figure sliding through 3.4, 3.1, 2.8 is
       a thing you read. The label goes entirely: with one number in the bar
       there is nothing for a word to disambiguate.

       AT THE FASTEST AUTO SPEED A DRAW IS A QUARTER OF A SECOND, so this
       floors at 1 and simply sits there. That is the honest reading — there
       is no countdown to show when the period is shorter than its own unit. */
    var ms = autoNextDrawMs();
    var n = ms < 0 ? 1 : Math.max(1, Math.ceil(ms / 1000));
    if (lab.hidden !== true) lab.hidden = true;
    bar.classList.add("counting");
    if (n !== autoTick){
      autoTick = n;
      amt.textContent = String(n);
      /* off, reflow, on — see .tick */
      amt.classList.remove("tick");
      void amt.offsetWidth;
      amt.classList.add("tick");
    }
  } else {
    autoTick = null;
    if (lab.hidden !== false) lab.hidden = false;
    bar.classList.remove("counting");
    amt.classList.remove("tick");
    if (lab.textContent !== "BET") lab.textContent = "BET";
    var t = money(derived().betCents);
    if (amt.textContent !== t) amt.textContent = t;
  }
}

/* Restarting the slide needs the class gone for a frame — the same rule as
   `.tick`, and the same reason. */
function showWin(cents){
  var el = $("winNote"); if (!el) return;
  /* NOT AFTER A TAKEOVER. That sequence counts the win up in 42px type for
     four seconds; a small figure appearing over the board as it shrinks back
     is the same redundancy `bwNoPop` used to suppress for the green banner,
     and settle() runs at the END of the takeover so the classes are still on. */
  var cl = document.body.classList;
  if (cl.contains("bw") || cl.contains("bwout")) return;
  el.textContent = "+" + money(cents);
  el.classList.remove("go");
  void el.offsetWidth;
  el.classList.add("go");
}

function paintAutoTime(){
  paintBetBar();
  var el = $("autoNote"); if (!el) return;
  var left = autoIdleLeftMs();
  /* IT COUNTS TOWARD AUTO STARTING AND NOTHING ELSE. While auto is running the
     BET bar says so with a live countdown, and two things reporting the same
     state in two places is one of them being noise. Silent, too, when auto
     cannot start at all — mid-draw, or with numbers still to pick — rather
     than counting toward something that is not going to happen. */
  var waited = left >= 0 && left <= IDLE_AUTO_MS - AUTO_NOTE_AFTER_MS;
  var html = (S.autoOn || !waited) ? ""
           : "auto in <b>" + Math.ceil(left / 1000) + "</b>s";
  if (el.innerHTML !== html) el.innerHTML = html;
  var cls = html ? "autonote show" : "autonote";
  if (el.className !== cls) el.className = cls;
}

function paint(){
  var D = derived();
  /* THE BUTTON NAMES THE STAKE. It said "Play", and the bet was a small grey
     figure off in the bank card — so the one number that decides what a press
     is worth was the furthest thing on screen from the press.

     ONLY THE TWO SPANS ARE WRITTEN, and paintBetBar owns both — it runs on the
     250ms tick as well as from here, because the auto countdown has to move
     between draws and paint() only runs when one lands. */
  $("btnPlay").disabled = S.animating || S.picks.length !== D.picks;
  /* PLAY DROPS TO GREY WHILE AUTO IS ON. The board is already being played;
     the amber belongs to whatever you are meant to press next, and while
     auto-play is running that is nothing. It still works — pressing it is
     just how you go faster than the timer. */
  $("btnPlay").className = S.autoOn ? "ghost" : "primary";
  paintAutoTime();
  var _hint = null; if (_hint) _hint.textContent = S.animating ? ""
    : S.picks.length < D.picks ? "Choose " + (D.picks - S.picks.length) + " more."
    : S.autoOn ? "Auto-play every " + autoSecs().toFixed(2) + "s — press Play to go faster."
    : "Auto-play is off. Keep pressing Play.";
  paintBoard();
  paintPanels();
  paintLive();
  if (DEV) paintDev();
}

/* ═══════════════════════════════ one draw ═════════════════════════════ */
var REVEAL_TOTAL = 715;   /* was 620 — slowed 15% */
/* WHAT IS KEPT IS WHAT IS SHOWN. The panel is a 2x2 of the four most recent
   draws, and nothing else reads S.history — it is not saved and no statistic
   is computed from it — so holding sixty entries to display four was only
   ever work. Changing this number changes the panel; the grid is 2x2 in CSS,
   so raising it past four would fill a fifth cell nothing can see. */
var HISTORY_MAX = 4;

/* ═══════════════════════════════ the ball ═════════════════════════════
   Once in every BALL_ODDS PAYING draws a ball rolls in, lands on one of the
   numbers that just came in, and multiplies what the draw was about to pay.

   IT ONLY FIRES ON DRAWS THAT ALREADY PAID, and that is a deliberate
   restriction. Rolled against every draw instead, most balls would land on a
   zero — at one number three draws in four pay nothing — so the game would
   routinely play its biggest animation over a payout of nothing. A 1000x on
   nothing is still nothing, and it is the worst possible moment to show
   somebody a jackpot.

   PLAYER BOARD ONLY. The hired help settle in bulk against an exact
   expectation, and a rare multiplier does not survive being averaged. Their
   arithmetic stays exact; this is a thing that happens where you can see it. */
/* 1 IN 4,000, NOT 1 IN 500. Simulated both: at 1-in-500 the balls only made
   ten numbers 1% faster overall — the board is the minor channel once the
   hired help arrive, so the MULTIPLIERS were never the problem. Two other
   things were, and both are frequency:

     at max auto speed 1-in-500 fired every TWO MINUTES — 29 an hour. A
     jackpot animation that regular is wallpaper, not a jackpot.

     and the spike runs backwards: a 1000x is worth 4,000 draws of income at
     the opening but only 400 late, so it disrupts hardest exactly when you
     are least equipped for it.

   1-in-4,000 is ~74 minutes between balls while clicking, ~17 at four draws
   a second, and drops the aggregate effect under half a percent — without
   touching prizes the art was designed around. */
/* ── HOW LONG THE BALL IS IN THE AIR ──────────────────────────────────
   THE FALL AND THE LANDING ARE NOT THE SAME MOMENT, and the difference is
   the whole of this constant. `dropBall` is CALLED when the gem begins its
   dive; the shockwaves, the gravity well and the `thud` all fire this many
   milliseconds later, when it actually reaches the board.

   It lives out here because the score has to know it. The music was cut to
   land its bass on the impact and was lined up against the call instead —
   which put it 440ms early, on `bigWinFanfare()`, the flourish that plays as
   the gem sets off. It read as landing on the wrong thing because it was.
   A local `var` in `dropBall` could not be seen by `bigWinSequence`, so
   there was nothing to line up against but the wrong number. */
var BALL_CRASH_GEM = 440, BALL_CRASH_PLAIN = 820;

var BALL_ODDS = 4000;
var BALL_DWELL_MS = 1500;      /* it now sits through the reveal as well */
var BALL_PRIZES = [
  { m:  10, w: 30 }, { m:  25, w: 22 }, { m:  50, w: 16 },
  { m:  75, w: 11 }, { m: 100, w:  8 }, { m: 125, w:  5 },
  { m: 150, w:  4 }, { m: 200, w: 2.5 }, { m: 500, w: 1.2 },
  { m:1000, w: 0.3 }
];
var BALL_WEIGHT_TOTAL = (function(){ var t=0; for (var i=0;i<BALL_PRIZES.length;i++) t+=BALL_PRIZES[i].w; return t; })();
function rollBallPrize(){
  var r = Math.random() * BALL_WEIGHT_TOTAL;
  for (var i=0;i<BALL_PRIZES.length;i++){ r -= BALL_PRIZES[i].w; if (r <= 0) return BALL_PRIZES[i].m; }
  return BALL_PRIZES[0].m;
}
/* ROLLED BEFORE THE DRAW, and it lands on one of YOUR numbers — the draw is
   then built to contain that number. So a ball guarantees at least one hit,
   which guarantees the multiplier has something to multiply. Both paytables
   pay on a single hit at every pick count, so a ball can never come up
   empty. */
/* ── THE FIRST ONE IS GUARANTEED ───────────────────────────────────────
   A 1-in-4,000 mechanic is one most players will never meet. At the click
   pace the shop is priced against that is a ball every seventy-four minutes,
   and the ball is the best thing in the game — it should not be something
   you find out about by accident an hour in, if at all.

   So the first ball is scripted, on the 250th draw of your own board. It is
   also CAPPED BELOW THE GEM TIERS: the takeover has to stay the thing that
   has never happened before, and spending it on the tutorial would leave
   the real one with nothing left to be.

   IT ALSO HAS A JOB IN THE PACING. The board is deliberately weak for the
   first two hours now, which leaves a long gap early with nothing to buy —
   and the fix for a gap cannot be another upgrade, because anything that
   raises income there undoes the reason the board is weak. A ball is
   content rather than compounding: a real moment that changes almost no
   money. `S.draws` counts only your own board, so hiring cannot skip it. */
/* 500 DRAWS, WHICH IS WHERE THE HOLE IS. At the reference click pace that is
   about nine minutes — the empty stretch runs 3.7m to 20.8m, and a filler
   belongs in the middle of a gap rather than at its edge. Early enough that
   a player who quits in the first ten minutes has still seen one.

   It does not close the gap on its own; one drop is seconds and the hole is
   a quarter of an hour. It breaks it in half. */
var FIRST_BALL_AT = 500;
var FIRST_BALL_MAX = 100;                    /* below the 200x gem tier */
function firstBallPrize(){
  var pool = BALL_PRIZES.filter(function(p){ return p.m < FIRST_BALL_MAX; });
  var total = 0, i;
  for (i = 0; i < pool.length; i++) total += pool[i].w;
  var r = Math.random() * total;
  for (i = 0; i < pool.length; i++){ r -= pool[i].w; if (r <= 0) return pool[i].m; }
  return pool[0].m;
}
function rollBall(){
  if (!S.picks.length) return null;
  var scripted = !S.firstBall && S.draws >= FIRST_BALL_AT;
  if (!scripted && !S.dev.forceBall && Math.floor(Math.random() * BALL_ODDS) !== 0) return null;
  S.dev.forceBall = false;
  var mult = S.dev.ballMult ? S.dev.ballMult :
             (scripted ? firstBallPrize() : rollBallPrize());
  S.dev.ballMult = 0;
  /* marked BEFORE the drop, not after: the flag is what stops it firing on
     every draw from the 250th onward, and the drop is asynchronous */
  if (scripted) { S.firstBall = 1; save(); }
  /* KEEP IT AWAY FROM THE EDGES. A gem's sparks throw well past its own
     tile, and from a border tile half of them land on the multiplier label,
     the MAXIMUM WIN plate, or nothing at all. Rows 1-3 and columns 3-6 leave
     clear board on every side. It still has to be a number the player owns —
     that guarantee is the whole point of the ball — so the zone is a
     preference, not a rule: if none of their picks sit in it, any pick will
     do rather than no ball at all. */
  var safe = [];
  for (var i=0;i<S.picks.length;i++) if (inBallZone(S.picks[i])) safe.push(S.picks[i]);
  var pool = safe.length ? safe : S.picks;
  return { tile: pool[Math.floor(Math.random() * pool.length)], mult: mult };
}
/* ROWS 2-4, COLUMNS 3-6. Row 1 had to go: the gem's multiplier label sits
   above its own tile, and with the MAXIMUM WIN plate now parked over the grid a
   gem in the top row printed its label straight through the payout. Rows 2
   to 4 keep clear board on every side for the sparks AND clear air above for
   the plate. Twelve tiles, same as before, one row lower. */
/* ═══════════════════════ THE SHOCKWAVE ════════════════════════════════
   A HIT OF TWO OR MORE PUSHES A RING OFF THE BOARD, and that ring carries
   damage. There is nothing to damage yet — enemies are the next piece — so
   what exists here is the gate, the number, and the wave that carries it.

   THREE GATES, ALL OF THEM PURCHASES:
     - two numbers or more   (the first upgrade in the game)
     - a stake of $0.04      (rung three, about $2.14 of bet upgrades in)
     - two hits in the draw  (the thing you were going to do anyway)
   So it opens a little after the board first grows, and it opens because you
   BOUGHT your way to it rather than because a timer expired.

   THE DAMAGE SCALES ON ALL THREE, and it is deliberately the same shape as a
   payout — stake times numbers times hits. A draw that pays well hits hard;
   the mechanic cannot drift away from the economy because it is made of the
   same parts.

       damage = betCents x picks x hits

   SHOCK_PER IS A PLACEHOLDER AND IT WILL BE WRONG. Nothing has hit points
   yet, so there is nothing to calibrate against; this is one multiplier to
   turn when the first enemy has a health bar. At the gate minimum the number
   is 16 and at the endgame it is ten billion, which is the same range the
   economy already spans — enemies will have to scale with it, not against it.

   IT RIDES THE STAR CANVAS. That layer is already the field around the board:
   behind the cards, in front of the page, covering the whole window. ENEMIES
   SHOULD LIVE ON IT TOO — a wave that has to reach them and a thing it has to
   reach belong on one surface, or the reaching becomes a coordinate problem
   between two. */
var SHOCK_MIN_PICKS = 2;
var SHOCK_MIN_BET   = 4;        /* cents — $0.04, rung three */
var SHOCK_MIN_HITS  = 2;
var SHOCK_PER       = 1;        /* damage per cent, per number, per hit */
var SHOCK_MS        = 900;
var shocks = [];

function shockArmed(){
  var D = derived();
  return D.picks >= SHOCK_MIN_PICKS && D.betCents >= SHOCK_MIN_BET;
}
function shockDamage(betCents, picks, hits){
  return Math.round(SHOCK_PER * betCents * picks * hits);
}

/* THE RING SATURATES, THE DAMAGE DOES NOT. A stake runs from a cent to a
   million dollars, so a radius proportional to damage would be off the screen
   before the first hire — it grows on a log and stops. What the player reads
   is "bigger than last time"; what an enemy reads is the number. */
function shockReach(dmg){
  return 1 + Math.min(2.2, Math.log(1 + dmg / 16) / Math.LN10);
}

function shockFire(dmg){
  var cv = $("starFx"); if (!cv || !cv.getContext) return null;
  var bd = $("board"); if (!bd) return null;
  var r = bd.getBoundingClientRect();
  var half = Math.max(r.width, r.height) / 2;
  var ring = {
    t0: performance.now(), ms: SHOCK_MS,
    x: r.left + r.width / 2, y: r.top + r.height / 2,
    r0: half * 0.92, r1: half * 0.92 + 150 * shockReach(dmg),
    dmg: dmg
  };
  shocks.push(ring);
  if (!starRaf) starRaf = requestAnimationFrame(starStep);
  return ring;
}

/* Rolled where the win note is, for the same reasons: after the draw has
   settled, not during a catch-up batch nobody is watching, and never under
   the takeover — which is already doing something much louder. */
function maybeShock(hits){
  if (hits < SHOCK_MIN_HITS || !shockArmed()) return 0;
  var cl = document.body.classList;
  if (cl.contains("bw") || cl.contains("bwout")) return 0;
  var D = derived();
  var dmg = shockDamage(D.betCents, D.picks, hits);
  S.lastShock = dmg;
  shockFire(dmg);
  return dmg;
}

/* ═══════════════════════ A STAR GOES BY ═══════════════════════════════
   ONE COMET, ABOUT EVERY TWO MINUTES, CROSSING BEHIND THE BOARD. It reuses
   drawComet — the same head and tail the takeover's storm throws — on its own
   canvas and its own loop.

   ITS OWN CANVAS AND NOT `#bwShots`, WHICH IS THE REUSE THAT WOULD HAVE COST
   SOMETHING. bwShotsStart() begins by emptying `bwShots` and bwShotsStop()
   empties it again, so an ambient star sharing that array would be wiped
   mid-flight by any mine — and far worse, a star that happened to start during
   a takeover would clear the takeover's own comets out from under it. A second
   canvas costs one element and cannot collide with anything.

   IT TRAVELS THE SKY'S DIAGONAL, derived the same way bwShotFire derives it,
   so the ambient star and the storm's comets run on one line rather than two
   hand-picked angles that drift apart. */
var STAR_EVERY_MS = 120000;
var STAR_JITTER = 0.35;                      /* +/-35%, so it is not metronomic */
var STAR_FLY_MS = 2100;
/* THE SHOWER THAT ANNOUNCES A MINE. Thirty to forty of them over five seconds,
   each smaller and quicker than the lone ambient star, so the sky fills before
   anything hits the board. */
var SHOWER_MIN = 30, SHOWER_MAX = 40, SHOWER_MS = 5000;
var SHOWER_FLY_MS = 1250;

/* ONE CANVAS, ONE LOOP, A LIST OF METEORS. It held exactly one star and a
   `starLive` slot; a shower needs a swarm, and the ambient star is simply a
   swarm of one. `starQueue` holds spawns that are due later, so a five-second
   shower is scheduled once and then drains inside the same rAF loop — no
   thirty setTimeouts to track down and cancel if the mine is torn down. */
var starRaf = null, starTimer = null, stars = [], starQueue = [];

function starSchedule(){
  if (starTimer) clearTimeout(starTimer);
  var wait = STAR_EVERY_MS * (1 + (Math.random() * 2 - 1) * STAR_JITTER);
  starTimer = setTimeout(starFire, Math.round(wait));
}

/* ONE METEOR, BUILT AND PUSHED. `spread` widens the band it may cross in — the
   ambient star hugs the board, a shower fills the sky around it. */
function starPush(small, spread, now){
  var W = window.innerWidth, H = window.innerHeight;
  var ang = Math.atan2(-H * 0.525, W * 1.125);      /* the sky's own angle */
  var ux = Math.cos(ang), uy = Math.sin(ang);
  var bd = $("board");
  var r = bd ? bd.getBoundingClientRect() : { left:W/2, top:H/2, width:0, height:0 };
  var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  /* OFFSET ALONG THE PERPENDICULAR, so it passes BESIDE the board rather than
     through its middle every time, and on a different line each pass. */
  var near = 140 + Math.random() * 230;
  var off = (small ? Math.random() * (spread || 700) + 60 : near) *
            (Math.random() < 0.5 ? -1 : 1);
  var px = cx - uy * off, py = cy + ux * off;
  var D = Math.max(W, H) * 0.95;
  /* ALONG-TRACK JITTER, so a shower does not cross one line in lockstep. */
  var slide = small ? (Math.random() - 0.5) * D * 0.7 : 0;
  px += ux * slide; py += uy * slide;

  stars.push({
    /* THE LOOP'S CLOCK, NOT A FRESH READING. rAF's timestamp is the time the
       frame began, which can be a whole frame behind performance.now() — a
       meteor born on its own reading is then already slightly in the past on
       the very step that spawned it. One clock for spawning and stepping. */
    t0: (now === undefined) ? performance.now() : now,
    fly: small ? SHOWER_FLY_MS * (0.75 + Math.random() * 0.6) : STAR_FLY_MS,
    x0: px - ux * D, y0: py - uy * D,
    x1: px + ux * D, y1: py + uy * D,
    ux: ux, uy: uy,
    hue: 250 + Math.random() * 40,             /* the game's purple, roughly */
    size: small ? (1.5 + Math.random() * 1.5) : (3.4 + Math.random() * 1.8),
    dim: small ? 0.62 : 0.85
  });
  if (!starRaf) starRaf = requestAnimationFrame(starStep);
}

/* THIRTY TO FORTY OVER FIVE SECONDS. Spawns are queued by time and drained by
   the loop, so tearing the loop down takes the rest of the shower with it. */
function meteorShower(ms){
  var cv = $("starFx"); if (!cv || !cv.getContext) return;
  var n = SHOWER_MIN + Math.floor(Math.random() * (SHOWER_MAX - SHOWER_MIN + 1));
  var now = performance.now();
  for (var i = 0; i < n; i++) starQueue.push(now + Math.random() * ms * 0.88);
  starQueue.sort(function(a, b){ return a - b; });
  if (!starRaf) starRaf = requestAnimationFrame(starStep);
  return n;
}

function starFire(){
  starSchedule();
  /* NOT WHILE THE SKY IS ALREADY FULL. The takeover throws thousands of
     streaks and the mine owns the screen for seconds; one more comet behind
     the cards would be invisible at best and noise at worst. */
  if (document.hidden || document.body.classList.contains("bw") ||
      document.body.classList.contains("mine")) return;
  var cv = $("starFx"); if (!cv || !cv.getContext) return;
  starPush(false);
}

function starStep(now){
  var cv = $("starFx");
  if (!cv || !cv.getContext){ starRaf = null; return; }
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var W = window.innerWidth, H = window.innerHeight;
  if (cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){
    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  }
  var ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  /* anything whose time has come */
  while (starQueue.length && starQueue[0] <= now){
    starQueue.shift(); starPush(true, 0, now);
  }

  ctx.globalCompositeOperation = "lighter";

  /* VERY FAINT ON PURPOSE. It is a field effect, not an event — the board
     already has a win note, a growing balance and a lit tile saying the draw
     paid. Peak alpha is 0.085; anything you actually notice here would be
     competing with all three. */
  for (var w = shocks.length - 1; w >= 0; w--){
    var sk = shocks[w];
    var sp = (now - sk.t0) / sk.ms;
    if (sp >= 1){ shocks.splice(w, 1); continue; }
    if (sp < 0) continue;
    var ease = 1 - Math.pow(1 - sp, 3);            /* fast out, slow to settle */
    var rad = sk.r0 + (sk.r1 - sk.r0) * ease;
    var a = 0.085 * (1 - sp) * Math.min(1, sp * 8);
    ctx.strokeStyle = "hsla(262,90%,72%," + a.toFixed(4) + ")";
    ctx.lineWidth = 2.5 * (1 - sp * 0.55);
    ctx.beginPath(); ctx.arc(sk.x, sk.y, rad, 0, 6.2832); ctx.stroke();
  }

  for (var i = stars.length - 1; i >= 0; i--){
    var m = stars[i];
    var p = (now - m.t0) / m.fly;
    if (p >= 1){ stars.splice(i, 1); continue; }
    if (p < 0) continue;
    /* IN AND OUT AT THE ENDS, so it does not pop into existence at full
       brightness on one edge and vanish on the other. */
    var fade = Math.min(1, Math.min(p, 1 - p) * 5);
    drawComet(ctx, m.x0 + (m.x1 - m.x0) * p, m.y0 + (m.y1 - m.y0) * p, m, fade * m.dim);
  }

  /* THE LOOP STOPS WHEN THE SKY IS EMPTY, and clears on the way out — a
     canvas left holding the last frame would keep a frozen meteor on screen. */
  if (!stars.length && !starQueue.length && !shocks.length){
    ctx.clearRect(0, 0, W, H);
    starRaf = null;
    return;
  }
  starRaf = requestAnimationFrame(starStep);
}

/* Used by the mine's teardown, so a torn-down sequence cannot leave its own
   shower still falling. */
function starClear(){
  stars = []; starQueue = []; shocks = [];
  if (starRaf){ cancelAnimationFrame(starRaf); starRaf = null; }
  var cv = $("starFx");
  if (cv && cv.getContext) cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
}

/* ═══════════════════════════ THE MINE ═════════════════════════════════
   THE EVENT THAT GROWS THE BOARD. It arms the moment a second number is
   bought — which is the first purchase in the game, at $1.00 and about four
   minutes in — and from then on rolls once per settled draw.

   ONE IN TWO HUNDRED, WITH A FLOOR. The mean wait is 200 draws, about 3m40s
   of hand-clicking, which lands the first mine around seven minutes in: inside
   the dead stretch the timeline tool flags as the worst in the run — nothing
   between 3.7m and 20.8m, because the next purchase is the $14 bet. A bare
   1-in-200 has a long tail, though: a tenth of players would still be waiting
   at 8m30s and a hundredth at seventeen minutes, with NOTHING else to look at.
   So the roll is floored the same way the first plinko ball is (FIRST_BALL_AT)
   — guaranteed at MINE_GUARANTEE draws since arming.

   THE COUNTER RESETS AT EVERY MINE, so the floor covers every stage and not
   just the first one. */
/* THE FIRST ONE IS EIGHT TIMES LIKELIER. Stage 1 -> 3x2 is the mine that
   teaches the player mines exist, and at 1-in-200 it was a mean of 200 draws —
   about three and a half minutes of clicking, in a stretch where nothing else
   happens. At 1-in-25 the mean is 25 draws, under thirty seconds, so the board
   grows while they are still looking at it having just bought their second
   number. Every stage after that keeps the long odds: by then it is a thing
   that happens to you, not a thing being introduced. */
var MINE_ODDS_FIRST = 25;
var MINE_ODDS = 200;
function mineOdds(){ return S.stage === 0 ? MINE_ODDS_FIRST : MINE_ODDS; }
var MINE_GUARANTEE = 400;
/* How long the struck surface is given before the board opens. Handed to
   bwMeshWave AND used as the delay before growth, so the two cannot drift. */
var MINE_MESH_MS = 900;
/* THE BLAST BELONGS TO THE BOARD IT IS BREAKING. bwBoom and bwBurst are tuned
   for the takeover, where the gem lands on one tile of forty; fired unchanged
   at a 2x2 board they throw debris past the edge of the screen and the ring
   swallows the whole card — an effect four times the size of the thing it is
