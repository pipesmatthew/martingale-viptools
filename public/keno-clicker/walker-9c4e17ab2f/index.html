<!-- AZERET MONO, NOT JETBRAINS. JetBrains puts a DOT inside its zero, and at
     11px in the history and the auto line that dot reads as dirt on the screen
     rather than as a letterform. Azeret's zero is a plain oval. Compared
     against the game's own strings at the game's own sizes in
     keno-idle/mockups/font-looks.html. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Azeret+Mono:wght@400;600;700&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════════════════
   THE PALETTE IS THE HOUSE PALETTE, lifted from martingale.viptools.gg,
   which lifted it from vipzone.css. Square corners, dark only, and a
   colour never means two things on one screen:
       amber   the house colour - active, and a tile that is yours AND drawn
       green   it paid
       cream   this one is yours
       red     developer tools - not part of the game
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  color-scheme: dark;
  /* DARKENED 2026-08-26. These were #131316 / #1b1b1f — a grey page under a
     lighter grey card, which put the brightest large area of the screen
     directly around the board. The board's own interior is #0d0b13, so the
     card it sits in was reading as a light mount around a dark picture. The
     hierarchy is kept, just moved down: page darkest, card a step up, wells a
     step up from that. */
  --bg:#08080a; --bg-deep:#0f0f13; --card:#111116; --border:#26262d;
  --button:#1e1e24; --button-hover:#2a2a32; --track:#3a3a42;
  --fg:#f0f0f2; --fg-2:#e6e6ea; --muted:#a4a4ad; --faint:#8b8b93;
  /* THE ACCENT IS PURPLE. It was #ffb454 everywhere — board, buttons, shop,
     streamer counts — and it is one value, so this is the only line that
     decides the colour of the game.

     THREE TONES, BECAUSE ONE CANNOT DO THE JOB AMBER DID. Amber is a LIGHT
     colour: it worked as a fill under near-black text and as text on a near
     black ground, both at high contrast. Purple is a DARK colour and can only
     do the first. So a fill keeps `--accent` and takes white text, while
     anything that was amber TEXT on the dark takes `--accent-lit` — at
     #7c3aed on #131317 body text sits near 3:1 and reads as muddy, which is
     exactly the sort of thing that looks like a rendering problem rather than
     a decision. `--accent-tint` is the dark purple ground that goes behind a
     lit element, and replaces the amber-tinted #26241d / #241b09 / #4a3a20
     that were scattered as literals. */
  --accent:#7c3aed; --accent-lit:#c9b0ff;
  --accent-tint:#1c1230; --accent-tint-h:#251a3d; --accent-edge:#3a2470;
  --live:#e53935; --cream:#e8e2c4; --teal:#4d9de0;
  --green:#4ade80; --danger:#e06c5a;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  /* THE FALLBACKS MATTER MORE THAN USUAL. Every figure in this game is
     tabular and most sit in slots solved to a width — a fallback that is not
     monospaced would not just look wrong, it would make the balance and the
     auto countdown twitch as digits change. All three below are fixed-pitch. */
  --mono:"Azeret Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
/* THE PAGE CENTRES IN THE WINDOW. It used to sit against the top with the
   whole lower half empty, which was fine when the board was a fixed 8x5 and
   wrong now that it grows from 2x2 — the thing you are looking at moved
   further from the middle of the screen the more of it there was.

   `margin:auto` on the child, NOT `align-items:center` on the parent. They
   centre identically until the content is taller than the window, at which
   point centring overflows in BOTH directions and the top of the page
   becomes unreachable — there is nothing above the scroll origin to scroll
   to. Auto margins collapse to zero on the overflowing side instead. */
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
h2{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
  font-weight:700;margin:0 0 8px}
.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* THREE COLUMNS WHEN THERE IS ROOM: what just happened on the left, the
   board you play in the middle, everything you buy on the right.

   FLEX, NOT GRID, AND FOR A SPECIFIC REASON. Both side columns hide
   themselves until they have something to say, and a grid with three fixed
   tracks does not care — a hidden child is display:none, so the remaining
   two slide into tracks 1 and 2. The board ended up in the 250px history
   track and was clipped at tile 8. Flex has no tracks to fall into: whatever
   is visible sizes itself and the row stays centred. */
/* 14px OFF THE TOP, 5px EVERYWHERE ELSE. The 5px was always the wrap's own
   padding; what kept the page off the top of the window was the 42px header,
   and with that gone the first card sat five pixels under the browser chrome
   and read as clipped rather than as flush. This is the smallest gap that
   still looks deliberate — set it back to 5px for edge-to-edge. */
.wrap{max-width:1220px;width:100%;margin:auto;padding:14px 5px 5px;display:flex;gap:5px;
  align-items:flex-start;justify-content:center}
/* THE TWO FLANKS ARE THE SAME WIDTH so the board sits on the page's centre
   line and not merely in the middle of the row. Unequal flanks centre the
   ROW, which left the board 52px to the left of centre. */
/* ══════════════════ FOCUS: THE BOARD IS THE SCREEN ═══════════════════
   Chosen from the layout mockups on 2026-08-26 (`mockups/ui-looks.html` #7).
   THE BOARD AND THE BET ROW ARE THE ONLY THINGS IN FLOW; everything else is
   pinned to an edge. The board therefore centres on the WINDOW rather than in
   the gap between two panels, which is what it used to do — and what made it
   drift whenever a panel appeared or changed width.

   The three columns still exist in the markup because the takeover, the peek
   and the wipe all address them by name. They are simply taken out of the
   flex row: a fixed element is not a flex child, so `.wrap` is left holding
   `.col-mid` alone and centres it.

   > THIS IS ONE VARIABLE AWAY FROM THE BOSS ARENA (#10). `--stack-y` is where
   > the centred column sits; boss mode drops it to the lower third and frees
   > the top half for the fight. Nothing else has to move — the panels are
   > already on the edges. */
:root{ --stack-y:50%; --edge:14px; }
.col-mid  {flex:0 1 520px;min-width:0}

/* BALANCE, HEADING THE RIGHT RAIL. No frame: the board and the history are
   the framed things, and a third box up here would make the number compete
   with them instead of heading the column.

   IT IS WHERE IT IS BECAUSE OF WHAT IT IS FOR. The question the balance
   answers most often is "can I afford that", and every price it is compared
   against is the list directly beneath it. Bottom-left it was near neither the
   prices nor the board, which is the weakest of the three places it could be.

   SMALLER THAN IT WAS, because the rail is 244px and the ladder ends at
   $1,000,000.00 — thirteen characters of tabular mono. At 24px that is about
   190px and it fits; at the old 32px it did not. */
.balcorner{padding:0 2px 9px;border-bottom:1px solid var(--border);margin-bottom:9px}
.balcorner .bankbig{font-size:24px;white-space:nowrap}

/* HISTORY, MIDDLE OF THE LEFT EDGE, ALWAYS. It is a game mechanic and not a
   readout, so it does not come and go with the layout and it does not hide
   behind a tab. Centred on the left it sits at the board's own height, which
   is where your eye already is, rather than down in a corner with the
   settings. */
.col-left{position:fixed;left:var(--edge);top:50%;transform:translateY(-50%);
  z-index:12;width:auto}

/* UPGRADES AND HIRED HELP, ONE PANEL. They were two cards 340px wide with a
   gap between them; they are one 244px panel now with a rule where the gap
   was. Smaller and adjacent, because neither is the thing you are looking at. */
/* THE PANEL SITS INBOARD OF ITS OWN TABS, which are flush to the edge. */
.col-right{position:fixed;right:34px;top:50%;transform:translateY(-50%);
  z-index:12;width:244px;display:flex;flex-direction:column}
/* `.allhidden` IS GONE. The rail always holds the balance now, so there is no
   state in which it is an empty bordered box sitting on the edge. */

/* TWO TABS, ALWAYS THERE. A panel you can hide needs somewhere to come back
   from, so the tabs do not move or vanish with the thing they toggle — they
   are the one fixed point on that edge. `writing-mode` rather than a rotate:
   a rotated element keeps its unrotated box for layout, so two of them
   stacked would overlap by the difference. */
.railtabs{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:13;
  display:flex;flex-direction:column;gap:4px}
.railtabs button{font:inherit;writing-mode:vertical-rl;cursor:pointer;border-radius:0;
  padding:11px 5px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  font-weight:700;background:var(--bg-deep);border:1px solid var(--border);
  color:#55555f}
.railtabs button:hover{color:var(--accent-lit);border-color:var(--accent-edge)}
.railtabs button.on{color:var(--accent-lit);border-color:var(--accent-edge);
  background:var(--accent-tint)}
body.bw .railtabs{opacity:0;transition:opacity 900ms ease;pointer-events:none}
.col-right .card{margin:0;background:#0c0c0f}
.col-right .card + #colHelp .card,
.col-right #colHelp .card{border-top:0}
.col-right .cardbody{padding:8px}
.col-right .cardhead{padding:6px 8px}
.col-right .cardhead h2{font-size:9.5px}
.col-right .cardhead .note{display:none}
.col-right .uprow{padding:6px 8px;gap:6px}
.col-right .uprow .un{font-size:11.5px}
.col-right .uprow button{min-width:68px;font-size:11px;padding:4px 8px}
/* THE BUY COLUMN DROPS TO ITS OWN LINE. `.srow` is a three-column grid —
   icon, middle, buy — and at 244px the middle holds a name, three upgrade
   chips and nothing to spare, so the third column was being squeezed to
   nothing and its button overlapped the chips. Two columns with `.sbuy`
   spanning both underneath fits, and reads as one row rather than three
   things fighting. */
.col-right .srow{grid-template-columns:22px minmax(0,1fr);gap:6px;padding:6px 7px}
.col-right .sicon{font-size:15px}
.col-right .sname{font-size:11.5px}
.col-right .sblurb{display:none}
.col-right .strk{gap:2px;margin-top:4px}
.col-right .sbtn{min-width:0;font-size:10px;padding:2px 5px;line-height:1.25}
.col-right .sbuy{grid-column:1/-1;display:flex;align-items:center;
  justify-content:flex-end;gap:9px;margin-top:5px}
.col-right .sout{font-size:11px}

@media (max-width:1040px){
  /* THE PINS COME OFF on a narrow window — fixed panels and a centred board
     collide long before the page runs out of room, and a board you cannot see
     all of is worse than a page you have to scroll. */
  .col-left,.col-right,.autonote{position:static;transform:none;
    width:100%;max-width:560px;left:auto;right:auto;top:auto;bottom:auto;height:auto}
  .railtabs{display:none}
  .wrap{flex-direction:column;align-items:center}
  .col-mid{flex:0 0 auto;width:100%;max-width:560px}
  .col-left{order:3}
  .col-left:empty,.col-left:has(> [hidden]:only-child){display:none}
  .cornerL{position:static;text-align:center;padding:6px 0}
}
}

/* ─────────────────────────────────────────────────────────────── cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:0;margin-bottom:5px}
.card:last-child{margin-bottom:0}
.cardhead{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.cardhead h2{margin:0}
.cardhead .grow{flex:1}
.cardhead .note{font-size:11.5px;color:var(--faint)}
.cardbody{padding:10px 12px}

button.ghost,button.primary{font:inherit;cursor:pointer;border-radius:0;padding:4px 12px;
  border:1px solid var(--border);background:var(--button);color:var(--muted)}
button.ghost:hover{background:var(--button-hover);color:var(--fg)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
/* 1.18, not 1.07 — the same proportional lift is far less visible on a
   dark fill than it was on a light one. */
button.primary:hover{filter:brightness(1.18)}
button:disabled{opacity:.35;cursor:default}
button:disabled:hover{background:var(--button);color:var(--muted);filter:none}
button.primary:disabled:hover{background:var(--accent)}
button.tiny{font-size:11px;padding:2px 8px}

/* ────────────────────────────────────────────────────────── the bank ── */
/* `.bank` and `.banklabel` were the balance's row inside a card in the middle
   column. The balance is pinned top-left now and carries `.lab` like every
   other pinned label; only the figure's own type survived. */
/* THE PER-HOUR RATE AND THE bet/hired/draws TRIO USED TO LIVE HERE. The rate
   is in the bottom-left readout now and the trio is gone: the bet is on the
   button you press, and hired and draws were numbers nobody was reading. */
.bankbig{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;
  font-size:clamp(22px,3.4vw,32px);letter-spacing:-.03em;line-height:1;color:var(--cream)}

/* ──────────────────────────────────────────────────────── keno board ── */
/* THE THIRTY TILES THAT MEAN NOTHING RECEDE, so the ten that were drawn and
   the ones that are yours are the only things on the board with any weight. */
/* `--bgap`, `--bpad` AND `--bcols` LIVE ON THE CARD, NOT ON THE BOARD, so the
   play row can read them too — custom properties inherit, and both are the
   card's children. paintBoard writes `--bcols` here for the same reason. */
#boardCard{--bgap:3px;--bpad:7px;--bcols:8}
.gamewrap{position:relative}
/* THE BOARD IS AS WIDE AS ITS COLUMNS, and the tile size never changes.
   `repeat(var(--bcols),1fr)` alone would make a 2x2 board two half-width
   tiles — the board would stay the same size and only the tiles would grow,
   which is the opposite of the mechanic. The width below is exactly the width
   `--bcols` columns occupy inside an eight-column grid of the same gap
   (n tiles + n-1 gaps, where a tile is (100% - 7*gap)/8), so a tile is the
   same size at every stage and the BOARD is what grows. At eight columns it
   resolves to 100% and today's layout is untouched. */
/* THE EDGE IS A REAL BOUNDARY, not a decoration. It is going to be a
   gameplay surface — the design record already has sparks washing around the
   inside of it and bouncing off — so the board has to read as a container
   with an inside and an outside, at every size it grows through.

   `box-sizing:content-box`, DELIBERATELY AGAINST THE GLOBAL RULE. `*` is
   border-box, and under it the width below would be the OUTSIDE of the
   frame: the border and padding would eat into it and every tile would
   shrink by a few pixels the moment the edge appeared, which is exactly the
   property the width calc exists to guarantee. Content-box keeps that calc
   describing the tiles and gaps alone, and the frame is drawn outside it —
   so a tile is 59.1px at two columns and at eight, edge or no edge.

   The padding is inside the frame and outside the tiles, so the grid never
   touches its own boundary; there has to be somewhere for a spark to be. */
.board{box-sizing:content-box;
  display:grid;grid-template-columns:repeat(var(--bcols,8),1fr);
  gap:var(--bgap);margin:0 auto;padding:var(--bpad);
  border:2px solid var(--accent-edge);background:#0d0b13;
  box-shadow:0 0 0 1px #000, inset 0 2px 16px rgba(0,0,0,.55);
  width:calc((var(--bcols,8) * (100% + var(--bgap)) - 8 * var(--bgap)) / 8);
  transition:width 620ms cubic-bezier(.22,1,.3,1)}
/* A TILE THAT HAS JUST BEEN BLOWN INTO EXISTENCE. Held at zero by an inline
   style until the layout has settled, then released one at a time — see
   growBoardTo(). */
.kt.fresh{transform:scale(0);opacity:0}
.kt.settling{transition:transform 420ms cubic-bezier(.2,1.5,.4,1),opacity 300ms ease}
.kt{aspect-ratio:1/1;background:#131317;border:1px solid #1b1b21;
  display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;
  color:#474751;cursor:pointer;user-select:none;min-height:30px;
  transition:background .13s ease,border-color .13s ease,color .13s ease}
.kt:hover{background:#20202a;border-color:#2e2e38;color:var(--muted)}
@keyframes ktpop{0%{transform:scale(.82)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
/* THE RING IS PART OF THE PALETTE, not decoration on top of it. Leaving this
   amber while the tile under it went purple is exactly the trap that has bitten
   three times — a half-overridden palette leaves a stray ring in the old
   colour on every winning tile, and it is only visible for 340ms so it reads
   as a rendering glitch rather than as a rule someone forgot. */
@keyframes kthit{0%{transform:scale(.82);box-shadow:0 0 0 0 rgba(124,58,237,.62)}
                 55%{transform:scale(1.14);box-shadow:0 0 0 7px rgba(124,58,237,0)}
                 100%{transform:scale(1);box-shadow:0 0 0 0 rgba(124,58,237,0)}}
.kt.just{animation:ktpop .2s ease-out}
.kt.pick.just{animation:kthit .34s ease-out}
.board.revealing .kt{cursor:default}
/* PICKED IS AN OUTLINE. DELIVERED IS A FILL. The two states the board is for,
   and they are the same colour so the second reads as the first paying off —
   the outline fills in. */
.kt.pick{background:var(--accent-tint);border-color:var(--accent);color:var(--accent-lit)}
.kt.pick:hover{background:var(--accent-tint-h);border-color:var(--accent);color:var(--accent-lit)}
/* A NUMBER THAT CAME IN THAT YOU DID NOT PICK stays grey. It is information,
   not a result, and colouring it would put three states on the board when
   there are only two worth reading across a room. */
/* IT USED TO BE A LIGHT GREY SLAB. #41414d against a near-black board is the
   brightest thing on it after the purple, so every number you did NOT pick
   shouted louder than the ones you did. It is a lift off the ground now and
   nothing more: the tile is legible, and the two states that mean something
   are still the only two with colour. */
.kt.drawn{background:#191920;border-color:#2c2c36;color:#9a9aa4}
.kt.drawn:hover{background:#20202a;border-color:#35353f;color:#b4b4bd}
/* WHITE ON PURPLE, where the amber wanted near-black on amber. The fill went
   from a light colour to a dark one, so the text had to cross with it. */
.kt.pick.drawn,.kt.pick.drawn:hover{background:var(--accent);border-color:var(--accent);
  color:#fff;font-weight:700;box-shadow:0 0 0 2px rgba(124,58,237,.32)}

/* ═══════════════════════ THE BIG WIN TAKEOVER ════════════════════════
   Only the gem tiers get this. The storm BUILDS rather than arriving all at
   once — every streak loops forever, so spreading their start delays across
   the ramp is the whole mechanism: density climbs as more of them come in,
   then holds at full once they all have. */
#bigwin{position:fixed;inset:0;z-index:880;pointer-events:none;
  background:#000;opacity:0;transition:opacity 1400ms ease}
#bigwin.on{opacity:1}
#bwSky{position:fixed;inset:0;z-index:890;width:100%;height:100%;display:block;
  opacity:0;pointer-events:none;transition:opacity 700ms ease}
/* WHILE IT IS COVERING, THE SKY IS IN FRONT OF EVERYTHING. That is the whole
   point — the veil has to hide the board, and at z-890 it was behind it.
   Dropping back to 890 happens while the veil is opaque, so the layer flip
   is never seen. */
body.bwcover #bwSky{z-index:980}
#bwVeil{position:fixed;inset:0;z-index:995;background:#f7faff;opacity:0;
  pointer-events:none}
/* ABOVE the board, unlike the sky. These have to land ON the numbers, so they
   cannot be drawn behind them. */
#bwShots{position:fixed;inset:0;z-index:960;width:100%;height:100%;display:block;
  opacity:0;pointer-events:none}
/* ══════════════════════ THE BOSS ARENA (#10) ═══════════════════════════
   The comment on `--stack-y` promised this was one variable away, and it very
   nearly was: the three columns are already pinned to edges rather than in
   flow, so nothing has to be re-laid-out. `body.boss` drops the centred column
   to the lower third, moves the history to the corner it is drawn in during a
   fight, and takes everything else off the screen.

   THE BOARD STAYS THE REAL BOARD. It is not a picture of the board or a second
   copy — Walker smashes the element the game draws into, and rebuilding it is
   rebuilding the thing you play on. That is the only reason the fight means
   anything: he is not attacking a health bar, he is attacking your gun.

   THE STACKING ORDER IS THE STORY. Mih sits UNDER the board until the ram, so
   what the smash reveals was there the whole time; Walker sits over it, because
   he is nearer the camera rather than higher up the screen.
     850 veil · 870 Mih (910 once live) · 880 the board · 915 shards
     920 Walker · 930 effects · 940 subtitles */
body.boss{overflow:hidden}
/* THE COLUMN MOVES, NOT THE ROW — AND THE REASON IS A TRAP WORTH NAMING.
   Putting `transform` on `.wrap` is the obvious way to centre it on --stack-y,
   and it silently breaks both rails: A TRANSFORMED ANCESTOR BECOMES THE
   CONTAINING BLOCK FOR ITS position:fixed DESCENDANTS, and `.col-left` and
   `.col-right` are both inside `.wrap`. They stopped being viewport-fixed and
   started resolving `top:50%` against a row that was over a thousand pixels
   tall, which put the history a screen and a half below the fold.

   Moving `.col-mid` instead leaves `.wrap` untransformed, so the rails keep the
   positioning they already had and only the thing that should move moves. */
/* ON THE FLOOR, NOT AT A PERCENTAGE. --stack-y at 74% centred the column near
   the bottom, which is not the same as putting the board AT the bottom: the
   card carries the bet row under it, so the taller the card the further up the
   board itself floated. Anchoring the bottom edge means the board lands in the
   same place whatever is attached to it, and it frees the whole screen above
   for the fight. */
body.boss .col-mid{position:fixed;left:50%;top:auto;bottom:6px;
  transform:translateX(-50%);z-index:880;width:520px;max-width:96vw;
  transition:bottom 700ms cubic-bezier(.2,.8,.3,1)}
body.boss{--stack-y:74%}
body.boss .col-right,body.boss #colShop,body.boss .railtabs,body.boss .balcorner,
body.boss #devHint,body.boss .autonote,body.boss .corner,
body.boss .cornerL{opacity:0!important;pointer-events:none;transition:opacity 500ms ease}
/* display:none, NOT opacity — the dev panel is INSIDE `.col-mid` and it is 892
   pixels tall. Fading it leaves it in flow, and the column centres on the
   combined height, which put the board's centre at 17% of the screen while
   --stack-y was asking for 74%. Everything else on this list is pinned to an
   edge and can simply fade. */
body.boss #devCard{display:none}
/* THE HISTORY IS A GAME MECHANIC IN HERE, not a readout — which is why it moves
   to the corner rather than disappearing with the rest of the chrome. */
body.boss .col-left{top:auto;bottom:26px;transform:none;z-index:882}
/* THE BOARD IS A TARGET, NOT AN INPUT, while the fight is on. */
body.boss .board,body.boss .playrow{pointer-events:none}
body.boss .playrow{opacity:.35;transition:opacity 500ms ease}
/* AND THEN IT IS GONE. The ram destroys the board outright — there is nothing
   to rebuild into, so the frame is not a socket, it is furniture standing in
   the middle of a bullet hell. Faded rather than display:none so the tiles that
   just flew off it do not appear to come from nowhere. */
body.boss.boardgone .col-mid{opacity:0;pointer-events:none;
  transition:opacity 420ms ease 120ms}

#bossVeil{position:fixed;inset:0;z-index:850;pointer-events:none;opacity:0;
  background:radial-gradient(120% 90% at 50% 30%,rgba(8,8,10,.55),rgba(4,4,6,.93));
  transition:opacity 700ms ease}
body.boss #bossVeil{opacity:1}
/* THE ARENA IS SPACE AND IT NEEDS TO LOOK LIKE IT. This cannot be #starFx —
   that canvas is z-index -1, behind the page and therefore behind the veil
   that darkens it, and it belongs to the game's own shooting stars. This layer
   sits between the veil and the board. */
#bossSky{position:fixed;inset:0;z-index:855;width:100%;height:100%;display:block;
  pointer-events:none}
#bossStage{position:fixed;inset:0;z-index:915;pointer-events:none;overflow:hidden}
#bossFx{position:fixed;inset:0;z-index:930;width:100%;height:100%;display:block;
  pointer-events:none}
#bossVeil,#bossSky,#bossStage,#bossFx,#walker,#bossSubs{display:none}
body.boss #bossVeil,body.boss #bossSky,body.boss #bossStage,body.boss #bossFx,
body.boss #walker,body.boss #bossSubs{display:block}

/* WALKER. The transform carries an absolute viewport coordinate, so `left` is
   0 and not 50% — a percentage offset in CSS would be added on top of it. */
/* width/height are written by sizeWalker() from the viewport — a literal here
   is how the box and the maths drift apart. */
#walker{position:fixed;left:0;top:0;z-index:920;
  transform-origin:50% 50%;pointer-events:none;will-change:transform}
#walker canvas{position:absolute;inset:0;width:100%;height:100%}
/* the PNGs carry real alpha — no blend mode, which is what put a black square
   around him the first two times */

/* THE PLAYER HAS NO ELEMENT. You are a broken keno tile, drawn straight onto
   the effects canvas — no asset, no DOM, and it can carry state an image
   cannot: it tilts into its own velocity and flashes on invulnerable frames. */

/* THE BANG, parented to him so it follows and shrinks with him — with the font
   size counter-scaled in JS so it does not GROW with him, which would read as a
   zoom rather than as a shout. */
#bang{position:absolute;left:50%;bottom:100%;margin-bottom:2px;
  transform:translateX(-50%);z-index:7;pointer-events:none;opacity:0;
  font-weight:900;font-size:44px;line-height:1;letter-spacing:2px;color:#fff3d0;
  text-shadow:0 0 12px rgba(255,120,40,.9),0 0 30px rgba(255,60,0,.6),0 2px 0 #7a1500}
#bang.on{animation:bang 620ms cubic-bezier(.2,1.6,.35,1) forwards}
#bang.off{opacity:0;transition:opacity 260ms ease-out}
@keyframes bang{
  0%{opacity:0;transform:translateX(-50%) translateY(10px) scale(.35) rotate(-9deg)}
  55%{opacity:1;transform:translateX(-50%) translateY(-6px) scale(1.18) rotate(3deg)}
  100%{opacity:1;transform:translateX(-50%) translateY(-2px) scale(1) rotate(0)}
}

#bossSubs{position:fixed;left:50%;margin-left:150px;bottom:22%;width:320px;
  z-index:940;pointer-events:none;opacity:0;transition:opacity 220ms ease}
#bossSubs.on{opacity:1}
#bossSubs .who{font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;margin-bottom:5px}
#bossSubs .who.walker{color:#9fd9ff}
#bossSubs .who.you{color:#8ee6a8}
#bossSubs .who.demon{color:#ff6b4b}
#bossSubs .line{font-size:16px;line-height:1.45;color:#eee}
#bossSubs .line.demon{color:#ff8a6b;font-weight:800;letter-spacing:.4px;
  text-shadow:0 0 16px rgba(255,60,0,.55)}

/* A SHARD IS THE TILE ITSELF, cloned live, so a picked tile drifts away purple
   and there is no second set of styles to keep in sync. */
.bossshard{position:fixed;left:0;top:0;z-index:915;will-change:transform;
  box-shadow:0 0 0 1px #000,0 0 22px rgba(0,0,0,.65)}
/* THE SOCKET YOU REBUILD INTO. The tiles are marked rather than removed, because
   paintBoard() owns them and would put them straight back. */
.kt.bossdead{background:#0a0a0c!important;border-color:#171719!important;
  color:#26262b!important;box-shadow:inset 0 0 14px rgba(0,0,0,.9)!important;
  background-image:
    linear-gradient(114deg,transparent 46%,#2a1a12 46%,#2a1a12 49%,transparent 49%),
    linear-gradient(-58deg,transparent 58%,#241610 58%,#241610 60%,transparent 60%)!important}

#starFx{position:fixed;inset:0;z-index:-1;width:100%;height:100%;display:block;
  pointer-events:none}
body.bwsky #bwShots{opacity:1}
/* THE MINE BORROWS THE TAKEOVER'S CANVAS AND NOTHING ELSE. `bwsky` also drops
   the room to black and hides the interface; the mine is a three-second
   interruption, not a cabinet moment, so it lights the same layer on its own. */
body.mine #bwShots{opacity:1}
/* THE MESH NEEDS A CAMERA. bwMeshWave moves tiles in Z and tilts them, and
   BOTH are invisible without a perspective on their parent — the wave was
   running correctly and rendering nothing, because the only perspective in
   the file is on `body.bw .board` and the mine is not the takeover. Same
   680px, so the two events see the board from the same distance. Perspective
   ONLY: `body.bw .board` also goes transparent and drops pointer events,
   which belong to the takeover and not here. */
body.mine .board{perspective:680px;perspective-origin:50% 50%}
@keyframes mineshake{
  0%{transform:translate(0,0)}       12%{transform:translate(-9px,4px)}
  25%{transform:translate(8px,-6px)} 38%{transform:translate(-7px,-3px)}
  52%{transform:translate(6px,5px)}  66%{transform:translate(-4px,-2px)}
  80%{transform:translate(3px,2px)}  100%{transform:translate(0,0)}}
body.mineshake .gamewrap{animation:mineshake 620ms cubic-bezier(.36,.07,.19,.97)}
body.bwsky #bwSky{opacity:1}
/* the board rides above the streaks from the moment they start, so it never
   pops through them partway */
body.bwsky #boardCard{position:relative;z-index:950}
}
}
/* the board rides above the storm and grows; everything else stands down */
body.bw .col-left, body.bw .col-right, body.bw #devCard,
body.bw #devHint{opacity:0;transition:opacity 900ms ease;pointer-events:none}
/* THE BOARD GROWS AGAIN — but around the GRID, not the card.

   The first attempt scaled #boardCard about its own centre, and the card is
   131px taller than the grid it holds: a faded cardhead above and a faded
   playrow below. Both keep their height so nothing reflows, so both became
   dead black bands that pushed the grid off-centre and ate the room the
   board could have used.

   Scaling about the grid's centre and translating THAT onto the viewport
   centre fixes both at once — the grid is centred and sized on its own
   terms, and the dead bands simply overflow off-screen, where being black on
   black costs nothing. body gets overflow:hidden so that overflow cannot
   produce a scrollbar.

   The flicker this caused the first time was the SVG storm, not the scale;
   with the storm on canvas a static 40-tile layer is cheap to raster. */
body.bw{overflow:hidden}
/* NOTHING TRANSITIONS ACROSS THE SWAP. Fading the interface out is what
   looked cheap — you could watch the room being taken apart. Behind an
   opaque veil there is nothing to hide, so every one of these changes at
   once, in a single frame, and the transitions come back immediately after.
   `.bw` is always present at this moment, which is what keeps these ahead
   of the rules they are cancelling. */
body.bw.bwinstant #boardCard,body.bw.bwinstant .gamewrap,body.bw.bwinstant .kt,
body.bw.bwinstant .col-left,body.bw.bwinstant .col-right,
body.bw.bwinstant #devCard,body.bw.bwinstant #devHint,
body.bw.bwinstant .balcorner,
body.bw.bwinstant #boardCard .cardhead,body.bw.bwinstant #boardCard .playrow,
body.bw.bwinstant #boardCard .hint,body.bw.bwinstant #bigwin{transition:none}
/* THE WAY BACK IS STAGED, and only during the way back — putting these
   transitions on the base elements would soften every ordinary draw. The
   board shrinks first, its colours follow a beat later, and the interface
   returns last, once there is something worth looking at again. */
body.bwout #boardCard{transition:transform 780ms cubic-bezier(.3,.8,.35,1),
  background-color 560ms ease 260ms,border-color 560ms ease 260ms}
body.bwout .gamewrap{transition:background-color 560ms ease 260ms,
  box-shadow 560ms ease 260ms}
body.bwout .kt{transition:background-color 560ms ease 260ms,
  border-color 560ms ease 260ms,color 560ms ease 260ms}
body.bwout .col-left,body.bwout .col-right,body.bwout #devCard,body.bwout #devHint,
body.bwout .balcorner,
body.bwout #boardCard .cardhead,body.bwout #boardCard .playrow,
body.bwout #boardCard .hint{transition:opacity 440ms ease 680ms}
/* THE GROW IS A SEPARATE STEP FROM THE DARK. Both used to land on `bw` at
   once, 60ms after the click — the room, the board and the sky all moving in
   the same frame, which is what made the opening feel like a jump cut. The
   transform waits for `bwbig`, added once the room has actually gone dark.
   will-change promotes the card before it moves, so the first frame of the
   grow is not also the frame that builds its layer. */
body.bw #boardCard{position:relative;z-index:950;will-change:transform}
body.bw.bwbig #boardCard{
  transform:translate(var(--bwdx,0px),var(--bwdy,0px)) scale(var(--bwscale,1));
  transform-origin:var(--bwox,50%) var(--bwoy,50%)}

/* a pool of darkness so the storm does not run straight up to the tiles —
   without it the grid reads as a hole punched in the streaks rather than an
   object lit in front of them */
/* A PANEL, NOT A WINDOW. Fully transparent tiles let streaks run straight
   across the numbers, which read as noise rather than depth. One scrim over
   the whole grid at .90 keeps the storm as a faint ghost behind the board
   instead — enough that the board is clearly in front of the sky, not a hole
   cut out of it. The soft pool around it does the separating. */
/* A RECTANGLE IS THE PROBLEM. A flat panel with a hard edge, filled with a
   grid of outlined boxes, is a spreadsheet — and no amount of starfield
   behind it stops it reading as one. The pool is a radial fade with no edge
   at all now, so the board has no border anywhere: it is just a patch of
   deeper dark that the numbers happen to sit in. */
body.bw .gamewrap{background:transparent;box-shadow:none}
/* `closest-side` IS LOAD-BEARING. A radial-gradient sizes itself to
   farthest-corner by default, so it only reaches full transparency at the
   CORNERS — along the left and right mid-edges it was still around 15%
   opaque when the element clipped, which is exactly the two hard vertical
   edges that appeared to jut out into space. closest-side makes the ellipse
   inscribe the box instead: transparent at all four mid-edges, and past 100%
   (so also transparent) everywhere out toward the corners. No edge anywhere.

   Weaker than it was, too. With the tiles carrying their own glow the pool
   no longer has to hold the board up on its own. */
body.bw .gamewrap::after{content:"";position:absolute;inset:-34%;z-index:-1;
  pointer-events:none;
  background:radial-gradient(ellipse closest-side at 50% 50%,
    rgba(0,0,0,.92) 0%, rgba(0,0,0,.82) 30%,
    rgba(0,0,0,.52) 55%, rgba(0,0,0,.18) 78%, rgba(0,0,0,0) 100%)}
/* THE BALANCE STANDS DOWN WITH EVERYTHING ELSE. This said
   `.col-mid > .card:first-child` while the bank was the first card in the
   middle column; the balance is pinned to the corner now and that selector
   had quietly become THE BOARD CARD — the one thing the takeover grows. */
body.bw .balcorner{opacity:0;transition:opacity 400ms ease}

/* THE POINT OF THE DARK ROOM IS CONTRAST, so the card has to go black with
   it. Left grey it read as an ugly slab floating on the overlay — and worse,
   the tile borders (#1b1b21) are all but identical to the card behind them
   (#1b1b1f), so against black the whole grid vanished into a flat void. The
   tiles need their own darker ground and a border that can actually be seen.
   Everything that is chrome rather than the feature fades out; the card keeps
   its full height so nothing reflows underneath. */
/* ONE transition declaration, because `transition` is a shorthand: a second
   rule on the same element replaces the first outright. Two of them meant
   the transform lost its timing entirely and the board snapped to size
   instead of growing. */
body.bw #boardCard{background:transparent;border-color:transparent;
  transition:transform 1250ms cubic-bezier(.22,.68,.28,1),
             background-color 1000ms ease,border-color 1000ms ease}
body.bw #boardCard .cardhead,
body.bw #boardCard .playrow,
body.bw #boardCard .hint{opacity:0;transition:opacity 900ms ease;pointer-events:none}
body.bw #boardCard .cardhead{border-bottom-color:transparent}
/* The tiles themselves stay alpha so the scrim under them does the work —
   borders carry the structure, and the only fully solid thing on screen is
   the win itself. */
/* REAL PERSPECTIVE, so the well can actually be three dimensional. A tile
   pushed to translateZ(-400) under a 900px perspective recedes AND
   foreshortens on its own, which no amount of scale() can imitate — and the
   tilt of each tile toward the throat is what makes the funnel wall read as
   a surface rather than as forty separate squares getting smaller. */
/* THE FRAME COMES OFF FOR THE TAKEOVER along with everything else. The whole
   point of that sequence is forty numbers hanging in the dark with no
   furniture; a 2px boundary is furniture. */
body.bw .board{background:transparent;pointer-events:none;
  border-color:transparent;box-shadow:none;
  perspective:680px;perspective-origin:50% 50%}
/* THE REVEAL POP CARRIES THE OLD PALETTE. `kthit` throws a purple box-shadow
   ring when a picked tile turns over — fine on the ordinary board, but at
   2.2x it is a 15px purple rectangle, and two vertically adjacent picks
   revealing together merge into one tall box floating in the starfield.

   Restating the takeover's own animation at higher specificity is what stops
   it. The value is identical to the non-`.just` rule, so the hue cycle does
   NOT restart when the class comes and goes — which is the whole reason the
   rainbow works at all now. Landing is already announced by the tile going
   from dim to lit; it does not also need a ring. */
body.bw .kt.just{animation:none}
body.bw .kt.pick.just{animation:bwpick 3.4s linear infinite;animation-delay:var(--kd,0s)}
body.bw .kt.pick.drawn.just,
body.bwafter .kt.pick.drawn.just{animation:bwcyc 3.4s linear infinite;animation-delay:var(--kd,0s)}

/* AND THE HOVER STYLES THEMSELVES ARE NEUTRALISED, because
   pointer-events:none is not enough on its own: Chrome does not re-run hit
   testing when pointer-events changes, so a :hover latched before the event
   started stays latched until the mouse moves. Turning off the pointer stops
   NEW hovers; overriding the rules stops the one already stuck. */
body.bw .kt:hover,
body.bw .kt.pick:hover,
body.bw .kt.drawn:hover,
body.bw .kt.pick.drawn:hover{background:transparent;border-color:transparent;
  color:inherit}

/* HOVER LEAKS THROUGH OTHERWISE. `.kt.pick:hover` sets a cream border and
   counts three classes, which outranks `body.bw .kt` at two — so whatever
   tile the mouse happened to be resting on painted a lone amber box in the
   middle of the starfield, and it moved when the pointer did. The board is
   not interactive during the event, so the honest fix is to say so. */
/* NO OUTLINES AND NO FILLS. Every tile keeps its border width so nothing
   moves, but the border is invisible — the grid stops being forty boxes and
   becomes forty numbers hanging in the dark. Everything that used to be said
   with a box is said with light instead: your picks glow and cycle, a number
   that lands flares white, and a pick that lands does both. */
/* box-shadow:none is doing real work here. `.kt.pick.drawn` carries a static
   2px amber ring, and the takeover rules replaced its background, border,
   colour and animation but never its shadow — so every tile that HIT drew a
   lone amber square in the middle of the starfield, and it moved down the
   board as the draw came in. Overriding a palette means overriding all of
   it, not the properties you happened to think of. */
body.bw .kt{background:transparent;border-color:transparent;box-shadow:none;
  color:rgba(196,206,238,.26);
  text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 9px rgba(0,0,0,.85);
  transition:color 1000ms ease,text-shadow 1000ms ease}
/* PICKS CYCLE TOO, but as an outline. Amber against a rainbow board read as
   the one thing that had not been told about the party. The distinction that
   matters is filled vs not: a pick is a hollow rainbow square, a pick that
   has been drawn fills in. */
/* A KNOCKED-OUT NUMBER IS GONE, NOT DIMMED. Once the storm has been through,
   the board should hold only the numbers you chose. */
body.bw .kt.out{opacity:0;transition:opacity 420ms ease}
/* and the survivors carry a real outline, because they are now the only
   things on the board and the grid has to still read as a grid */
/* THE OFFSET HAS TO BE ON THIS RULE TOO — it is the one a picked tile wears
   for the twenty seconds BEFORE the gem lands, which is most of the event.
   `--kd` was added to `.pick.just` and `.pick.drawn` and missed here, so the
   board sat in perfect lockstep for the whole build and only broke into a
   spectrum once the draw resolved. That is the wrong way round: the ramp is
   when there is nothing else to look at. */
body.bw .kt.pick{background:transparent;font-weight:700;
  animation:bwpick 3.4s linear infinite;animation-delay:var(--kd,0s)}
@keyframes bwpick{
  0%{color:hsl(0 95% 76%);border-color:hsl(0 95% 62%);
     text-shadow:0 0 15px hsla(0,95%,60%,.8),0 1px 3px #000}
  25%{color:hsl(90 95% 76%);border-color:hsl(90 95% 62%);
     text-shadow:0 0 15px hsla(90,95%,60%,.8),0 1px 3px #000}
  50%{color:hsl(180 95% 76%);border-color:hsl(180 95% 62%);
     text-shadow:0 0 15px hsla(180,95%,60%,.8),0 1px 3px #000}
  75%{color:hsl(270 95% 76%);border-color:hsl(270 95% 62%);
     text-shadow:0 0 15px hsla(270,95%,60%,.8),0 1px 3px #000}
  100%{color:hsl(360 95% 76%);border-color:hsl(360 95% 62%);
     text-shadow:0 0 15px hsla(360,95%,60%,.8),0 1px 3px #000}
}
body.bw .kt.drawn{background:transparent;border-color:transparent;box-shadow:none;color:#fff;
  text-shadow:0 0 20px rgba(255,255,255,.6),0 0 6px rgba(255,255,255,.5),0 1px 3px #000}

/* the frame around the whole board, once the win lands */

/* ABOVE THE GRID, not across it. `top` is the plate's BOTTOM edge here —
   translate(-50%,-100%) anchors it that way, so bwFitBoard can park it a
   fixed gap over the first row without knowing how tall the plate is. No
   border: with the numbers borderless too, the only outline left in space is
   the one that marks a number you picked and hit. */
#bwPop{position:fixed;left:50%;top:var(--bwpoptop,130px);
  transform:translate(-50%,-100%) scale(.85);
  z-index:990;text-align:center;pointer-events:none;background:transparent;
  border:0;padding:4px 20px 10px;opacity:0;
  transition:opacity 180ms ease,transform 300ms cubic-bezier(.2,1.4,.4,1);
  text-shadow:0 2px 14px rgba(0,0,0,.95)}
#bwPop.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
/* THE GRADIENT IS THE TEXT, so there is no ink behind it and every property
   of it has to carry the weight the glyphs would otherwise get from a fill.

   Lifting the stops to pastels made it PALER, not more solid — washed out is
   what "translucent" looked like here, and it was saturation, not opacity.
   These are vivid instead, and the shadow is tight rather than a wide blur,
   which was adding haze around the letters and softening them further. */
.bwcap,.bwamt{-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  background-image:linear-gradient(90deg,#ff2d45,#ffab2e,#3dff5f,#00b4ff,#a855ff,#ff2d45);
  background-size:300% 100%;animation:bwflow 2.6s linear infinite;
  filter:drop-shadow(0 0 1px rgba(0,0,0,1)) drop-shadow(0 1px 3px rgba(0,0,0,1))
         drop-shadow(0 3px 12px rgba(0,0,0,.85))}
@keyframes bwflow{ to{ background-position:300% 0; } }
/* SIZED OFF THE VIEWPORT, NOT OFF A FIXED NUMBER. This is the payoff of a
   thirty-second event and 42px was reading as a notification. It clamps so a
   narrow window cannot let it run off the sides and a wide one cannot make it
   silly. */
.bwcap{font-family:var(--mono);font-size:clamp(15px,2.0vw,26px);letter-spacing:.34em;
  text-transform:uppercase;margin-bottom:10px;font-weight:700}
.bwamt{font-family:var(--mono);font-size:clamp(56px,9vw,132px);font-weight:700;line-height:.98;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* during the event the winning tiles cycle hue together, rather than amber */
/* `bwafter` KEEPS THIS ALIVE ONCE THE EVENT IS OVER. Returning to the board
   dropped the winning tiles back to plain amber — the cycle stopped dead the
   moment `body.bw` came off, so the colour fell off a cliff at exactly the
   point the player is looking at what they won.

   It has to restate the WHOLE palette, not just the animation: background,
   border, box-shadow and weight all differ from `.kt.pick.drawn`'s ordinary
   purple, and inheriting any one of them would leave a purple slab under a
   rainbow glow. Same trap as the stray ring on the winning tiles, twice over. */
body.bw .kt.pick.drawn,
body.bwafter .kt.pick.drawn,
body.bwafter .kt.pick.drawn:hover{background:transparent;border-color:transparent;
  box-shadow:none;font-weight:700;animation:bwcyc 3.4s linear infinite;
  animation-delay:var(--kd,0s)}
/* THE ONE OUTLINE THAT EARNS ITS PLACE. Everything else in space is
   borderless, so a border now means exactly one thing: a number you picked
   that the draw actually delivered. It cycles with the glow rather than
   against it, and the box is what makes it legible at a glance among forty
   numbers that are all lit to some degree. */
@keyframes bwcyc{
  0%{color:hsl(0 100% 82%);border-color:hsl(0 95% 64%);
     text-shadow:0 0 26px hsla(0,100%,62%,.95),0 0 10px #fff,0 1px 3px #000}
  25%{color:hsl(90 100% 82%);border-color:hsl(90 95% 64%);
     text-shadow:0 0 26px hsla(90,100%,62%,.95),0 0 10px #fff,0 1px 3px #000}
  50%{color:hsl(180 100% 82%);border-color:hsl(180 95% 64%);
     text-shadow:0 0 26px hsla(180,100%,62%,.95),0 0 10px #fff,0 1px 3px #000}
  75%{color:hsl(270 100% 82%);border-color:hsl(270 95% 64%);
     text-shadow:0 0 26px hsla(270,100%,62%,.95),0 0 10px #fff,0 1px 3px #000}
  100%{color:hsl(360 100% 82%);border-color:hsl(360 95% 64%);
     text-shadow:0 0 26px hsla(360,100%,62%,.95),0 0 10px #fff,0 1px 3px #000}
}
@media (prefers-reduced-motion:reduce){
  .bwcap,.bwamt,
  body.bw .kt.pick,body.bw .kt.pick.drawn{animation:none}
}

/* ── the plinko ball ───────────────────────────────────────────────────
   Three objects by prize: a bearing under 100x, a marble under 200x, a cut
   gem above. The gem tiers add a spinning stone, a rainbow ring in place of
   the amber one, and streaks that grow denser, longer and faster as the
   prize climbs. */
@keyframes ballin{
  0%  {transform:translate(-50%,-50%) translate(-420px,-230px) scale(.55);opacity:0}
  12% {opacity:1}
  72% {transform:translate(-50%,-50%) translate(0,-15px) scale(1.10)}
  86% {transform:translate(-50%,-50%) translate(0,5px)  scale(.95)}
  100%{transform:translate(-50%,-50%) translate(0,0)    scale(1)}
}
@keyframes ballroll{ from{transform:rotate(-620deg)} to{transform:rotate(0)} }
/* A GEM DOES NOT DRIFT IN, IT ARRIVES. `ballin` brings the ordinary balls
   from the upper left at 0.55 and eases to a stop, which is a gentle,
   pleasant landing and completely wrong for the thing the whole event has
   been building toward. This one starts enormous and comes straight at the
   board on a hard ease-IN, so it is still accelerating when it hits — and
   nothing settles afterwards, because the BOARD does the reacting. */
@keyframes gemcrash{
  0%  {transform:translate(-50%,-50%) translate(-780px,320px) scale(2.2);
       opacity:0;filter:blur(4px)}
  16% {opacity:1}
  100%{transform:translate(-50%,-50%) translate(0,0) scale(1);
       opacity:1;filter:blur(0)}
}
@keyframes gemspin{ to{ transform:rotate(360deg); } }
@keyframes ringspin{ to{ transform:rotate(360deg); } }
@keyframes streakout{
  0%{opacity:0;transform:rotate(var(--rot)) translateY(var(--r0)) scaleY(.35)}
  16%{opacity:1}
  100%{opacity:0;transform:rotate(var(--rot)) translateY(var(--r1)) scaleY(1.6)}
}
@keyframes labflow{ to{ background-position:300% 0; } }
/* THE BALL RADIATES IN THE BOARD'S COLOUR. It is a thing that arrives ON the
   board and lands on a tile you picked, so it belongs to the board's palette
   and not to the interface's. The prize ART is untouched — a bearing is still
   steel and a marble is still a marble; those are objects, not accents. */
@keyframes ballpulse{
  0%{box-shadow:0 0 0 0 rgba(124,58,237,.65)}
  100%{box-shadow:0 0 0 22px rgba(124,58,237,0)}
}
#ball{position:absolute;z-index:12;pointer-events:none;width:62px;height:62px;
  transform:translate(-50%,-50%)}
#ballArt{position:absolute;inset:0;z-index:3;
  filter:drop-shadow(0 4px 7px rgba(0,0,0,.6))}
#ballArt svg{width:100%;height:100%;display:block}
#ball.drop.plain{animation:ballin .82s cubic-bezier(.3,.7,.35,1) both}
#ball.drop.gem{animation:gemcrash .44s cubic-bezier(.78,0,.9,.22) both}
#ball.drop.gem #ballArt{animation:ballroll .44s cubic-bezier(.78,0,.9,.22) both;
  transform-box:fill-box;transform-origin:center}
#ball.drop.plain #ballArt{animation:ballroll .82s cubic-bezier(.3,.7,.35,1) both;
  transform-box:fill-box;transform-origin:center}
#ball.land.plain{animation:ballpulse .55s ease-out 2}
/* a gem keeps turning once it has landed */
#ball.land.gem #ballArt.gem,#ball.land #ballArt.gem{animation:gemspin var(--gemspin,7s) linear infinite}

/* THE RING REPLACES THE AMBER ONE, and clips only itself. */
#ballRing{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  z-index:1;overflow:hidden;display:none}
#ballRing.on{display:block}
#ballRing::before{content:"";position:absolute;left:50%;top:50%;width:180%;height:180%;
  margin:-90% 0 0 -90%;
  background:conic-gradient(hsl(0 95% 62%),hsl(51 95% 62%),hsl(102 95% 62%),hsl(153 95% 62%),
    hsl(204 95% 62%),hsl(255 95% 62%),hsl(306 95% 62%),hsl(360 95% 62%));
  animation:ringspin var(--ringspin,4s) linear infinite}
/* THE INNER FILL IS THE TILE'S OWN BACKGROUND, and has to be — it is what
   turns a filled disc into a 2px rim. It was #26241d, which was `.kt.pick`'s
   amber-tinted background verbatim; the pick is purple-tinted now, so a
   hardcoded copy of the old value would have left an amber disc sitting on a
   purple tile. Reading the variable means it cannot come apart again. */
#ballRing i{position:absolute;inset:2px;background:var(--accent-tint);display:block}

/* OUTSIDE anything that clips, so they cross the neighbouring tiles */
#ballFx{position:absolute;left:50%;top:50%;width:0;height:0;z-index:2}
#ballFx.spin{animation:gemspin var(--fxspin,3s) linear infinite}
#ballFx i{position:absolute;left:0;top:0;border-radius:2px;opacity:0;
  transform-origin:50% 50%;animation:streakout var(--dur,1.4s) ease-out infinite}

/* two elements: the outer plate stays solid black, the inner span carries
   the gradient that gets clipped to the glyphs */
/* TOPMOST, ABOVE EVERYTHING THE BALL DRAWS. The streaks travel outward as
   they animate, so they sweep through this space even though they start
   below it — measured statically the label sat clear, and in motion it did
   not. It is the one thing that must stay readable, so it outranks the art
   it is describing. A solid plate and a hard ring, because it is sitting
   over ninety moving rainbow streaks. */
#ball .ballmult{position:absolute;left:50%;bottom:calc(100% + 9px);
  transform:translate(-50%,0);white-space:nowrap;z-index:40;
  font-family:var(--mono);font-size:16px;font-weight:700;color:#fff;
  background:#000;border:1px solid #5a5a66;padding:3px 11px;
  box-shadow:0 0 0 3px rgba(0,0,0,.85), 0 8px 22px rgba(0,0,0,.8)}
#ball .ballmult.blue{color:#7fc3ff}
#ball .ballmult.purple{color:#c79cff}
#ball .ballmult.rain span{-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  background-image:linear-gradient(90deg,#ff5f6d,#ffc371,#8fff7a,#5fd0ff,#c79cff,#ff5f6d);
  background-size:300% 100%;animation:labflow 2.4s linear infinite}

@keyframes ballflash{
  0%{box-shadow:0 0 0 0 rgba(124,58,237,0)}
  35%{box-shadow:0 0 0 5px rgba(124,58,237,.5)}
  100%{box-shadow:0 0 0 0 rgba(124,58,237,0)}
}
.board.ballhit{animation:ballflash .9s ease-out 2}
/* THE WIN BANNER IS GONE. A green box over the board for every paying draw —
   green being the one colour in the game that belongs to nothing else — and it
   covered the tiles at the moment you were reading them. The balance moving is
   the same information without anything landing on top of the board. */

/* ─────────────────────────────────────────────────────────────── shop ── */
.shop{display:grid;gap:2px}
.uprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:8px 10px;background:var(--bg-deep);border:1px solid var(--border)}
.uprow.can{border-color:var(--accent-edge)}
.uprow .un{font-size:12.5px;color:var(--fg-2);font-weight:600}
.uprow .ud{font-size:11.5px;color:var(--faint);margin-top:1px}
.uprow button{min-width:96px}

/* ────────────────────────────────────────────────────────── streamers ── */
.streamers{display:grid;gap:2px}
.srow{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:9px;align-items:center;
  padding:7px 9px;background:var(--bg-deep);border:1px solid var(--border)}
.srow.owned{border-color:#3a3a44}
.sicon{font-size:21px;line-height:1;text-align:center;filter:grayscale(1) opacity(.45)}
.srow.owned .sicon{filter:none}
.smid{min-width:0}
.sname{font-size:12.5px;color:var(--fg-2);font-weight:600}
.scount{font-family:var(--mono);color:var(--accent-lit);font-weight:700}
.sblurb{font-size:11px;color:var(--faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.sbuy{text-align:right}
.snobody{padding:10px 2px;font-size:11.5px;color:var(--faint);text-align:center}

/* ── what just landed ─────────────────────────────────────────────────── */
/* ONE TILE PER DRAW: the multiplier it paid, and under it how many of your
   numbers came in. Same shape the paytable strip uses, so a 0x here reads as
   the same object as a 0x there. Grey when it paid nothing, amber when it
   did — a column of these is a run of results you can scan without reading. */
/* FOUR CELLS, TWO BY TWO, AND NO SCROLL. It used to auto-fill as many columns
   as the card was wide and scroll to sixty — which made it a log you had to
   read rather than a glance you could take, and put a scrollbar next to a
   board that is itself only two tiles wide at the start. Four is what the
   panel shows and four is all HISTORY_MAX keeps, so there is nothing below
   the fold to scroll to.

   IT IS A LITTLE BOARD. A cell is one keno square and the frame around the
   four of them is the board's own — same 2px edge, same padding, same ground
   — so the last four draws read as a small copy of the thing they came off
   rather than as a list in a panel. `--kt` is the tile size the board solves
   for at eight columns; it is stated here rather than derived, because the
   two are equal by intent and a board that stops being 59px should not
   silently resize the history. */
.histgrid{--kt:59px;--bgap:3px;--bpad:7px;box-sizing:content-box;
  display:grid;grid-template-columns:repeat(2,var(--kt));
  grid-auto-rows:var(--kt);gap:var(--bgap);padding:var(--bpad);margin:0 auto;
  width:calc(2 * var(--kt) + var(--bgap));
  border:2px solid var(--accent-edge);background:#0d0b13;
  box-shadow:0 0 0 1px #000, inset 0 2px 16px rgba(0,0,0,.55)}
.hcell{border:1px solid var(--border);background:var(--bg-deep);text-align:center;
  overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.hcell.won{border-color:#3a3a44}
.hcell.big{border-color:var(--accent)}
/* a draw a ball landed on, so it stands out in the run */
.hcell.ball{border-color:var(--accent);background:var(--accent-tint)}
.hcell.ball .hmult{color:#ddc9ff}
/* AND A GEM GETS THE SAME TURNING RAINBOW IT WORE ON THE BOARD. Amber was
   right for a bearing and wrong for the thing that just took the screen over
   for half a minute — the row should be able to tell you which draw that was
   from across the room, and permanently. */
.hcell.gem{background:#0b0a14;animation:hgem 3.4s linear infinite}
@keyframes hgem{
  0%{border-color:hsl(0 95% 64%);
     box-shadow:0 0 13px hsla(0,95%,60%,.5),inset 0 0 11px hsla(0,95%,60%,.2)}
  25%{border-color:hsl(90 95% 64%);
     box-shadow:0 0 13px hsla(90,95%,60%,.5),inset 0 0 11px hsla(90,95%,60%,.2)}
  50%{border-color:hsl(180 95% 64%);
     box-shadow:0 0 13px hsla(180,95%,60%,.5),inset 0 0 11px hsla(180,95%,60%,.2)}
  75%{border-color:hsl(270 95% 64%);
     box-shadow:0 0 13px hsla(270,95%,60%,.5),inset 0 0 11px hsla(270,95%,60%,.2)}
  100%{border-color:hsl(360 95% 64%);
     box-shadow:0 0 13px hsla(360,95%,60%,.5),inset 0 0 11px hsla(360,95%,60%,.2)}
}
.hcell.gem .hmult{font-weight:700;animation:hgemtx 3.4s linear infinite}
@keyframes hgemtx{
  0%{color:hsl(0 100% 82%);text-shadow:0 0 11px hsla(0,100%,62%,.95)}
  25%{color:hsl(90 100% 82%);text-shadow:0 0 11px hsla(90,100%,62%,.95)}
  50%{color:hsl(180 100% 82%);text-shadow:0 0 11px hsla(180,100%,62%,.95)}
  75%{color:hsl(270 100% 82%);text-shadow:0 0 11px hsla(270,100%,62%,.95)}
  100%{color:hsl(360 100% 82%);text-shadow:0 0 11px hsla(360,100%,62%,.95)}
}
.hcell.gem .hhits{background:#12101c;border-top-color:#2a2440}
.hcell.gem .hhits i{animation:hgemsq 3.4s linear infinite}
@keyframes hgemsq{
  0%{background:hsl(0 95% 64%)}   25%{background:hsl(90 95% 64%)}
  50%{background:hsl(180 95% 64%)} 75%{background:hsl(270 95% 64%)}
  100%{background:hsl(360 95% 64%)}
}
.hmult{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);
  padding:0 2px 4px;letter-spacing:-.02em}
.hcell.won .hmult{color:var(--accent-lit)}
.hhits{display:flex;align-items:center;justify-content:center;gap:5px;
  border-top:1px solid var(--border);background:#141419;padding:3px 2px;
  font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.hcell.won .hhits{color:var(--fg-2)}
.hhits i{width:7px;height:7px;display:block;background:var(--track)}
.hcell.won .hhits i{background:var(--accent)}
.sbuy button{min-width:92px}
.sout{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:11.5px;
  color:var(--green);margin-bottom:3px;min-height:16px}
.strk{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.sbtn{font:inherit;cursor:pointer;border-radius:0;padding:2px 7px;text-align:left;
  border:1px solid var(--border);background:var(--button);color:var(--muted);
  display:flex;flex-direction:column;line-height:1.25;min-width:76px}
.sbtn i{font-style:normal;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.sbtn b{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--fg-2)}
.sbtn.can{border-color:var(--accent-edge)}
.sbtn.can b{color:var(--accent-lit)}
.sbtn:disabled{opacity:.4;cursor:default}
/* locked on headcount rather than money - reads as a requirement, not a price */
.sbtn.shut b{color:var(--teal);font-weight:600}
.sbtn u{text-decoration:none;font-family:var(--mono);font-size:9px;color:var(--green);
  white-space:nowrap}

/* what a purchase buys, per hour - developer only, so it wears the dev green
   rather than competing with the price it sits beside */
.devgain{font-family:var(--mono);font-size:10px;color:var(--green);white-space:nowrap}
.sbuy .devgain{margin-bottom:3px}

/* ── the board they are playing on ────────────────────────────────────── */
#peek{position:fixed;z-index:40;width:222px;background:var(--card);
  border:1px solid var(--track);box-shadow:0 14px 40px rgba(0,0,0,.6);padding:8px;
  pointer-events:none}
#peek .peekhead{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
#peek .peekhead b{font-size:11.5px;color:var(--fg-2)}
#peek .peekhead span{font-size:10px;color:var(--accent-lit);font-family:var(--mono);
  text-transform:uppercase;letter-spacing:.06em;margin-left:auto}
#peek .board{--bgap:2px;--bpad:4px;border-width:1px;box-shadow:none}
#peek .kt{min-height:0;font-size:8px;border-width:1px;cursor:default}
#peek .peekfoot{font-family:var(--mono);font-size:10.5px;color:var(--fg-2);margin-top:6px}
#peek .peeksub{font-size:10px;color:var(--faint);margin-top:1px}

/* THE BET IS FUSED TO THE BOARD'S BOTTOM EDGE — mockups/bet-looks.html #5.
   Not a button under the board: the board and its trigger as one object, with
   the frame running straight into it. That is why the row solves to the same
   width the board does, from the same calc plus its padding and border, and
   why the bet carries no top border of its own — the board's bottom edge IS
   the line between them, so there is one 2px rule there and not two touching.

   IT IS A COLUMN AT EVERY SIZE, not only when narrow. Fusing only reads if
   the vertical edges line up, which means the bet has to be the full width;
   and once it is, Auto has nowhere to sit but underneath. Board, bet, auto —
   one stack, one width, at 139px and at 511px alike. */
.playrow{position:relative;display:flex;flex-direction:column;gap:5px;margin:0 auto;
  width:calc((var(--bcols,8) * (100% + var(--bgap)) - 8 * var(--bgap)) / 8
             + 2 * var(--bpad) + 4px)}
.playrow button{padding:9px 12px;font-size:13px}
.playrow #btnPlay{border-top:0;display:flex;align-items:center;justify-content:center;
  gap:9px;padding:10px 12px;white-space:nowrap;overflow:hidden}
/* ABSOLUTE, so appearing cannot move the board. `.gamewrap` is the
   positioning context and `bottom:100%` sits it on the frame's top edge —
   left:50% of the wrapper is the board's centre, because the board centres
   itself in it.

   IT RISES RATHER THAN DROPS. Under the bar the note slid down and away from
   the board; above it, coming up off the frame is the same gesture the right
   way round — money leaving the board rather than falling out of it. */
.winnote{position:absolute;left:50%;bottom:100%;margin-bottom:6px;
  transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;
  text-shadow:0 0 9px rgba(124,58,237,.85);opacity:0}
.winnote.go{animation:winslide 1.15s ease forwards}
@keyframes winslide{
  0%{opacity:0;transform:translate(-50%,7px)}
  16%{opacity:1;transform:translate(-50%,0)}
  72%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-4px)}}

/* THE WORD AND THE FIGURE ARE SEPARATE ELEMENTS, so paint() writes only the
   figure — and it sits in a tabular mono slot, because the ladder runs from
   $0.01 to $1,000,000.00 and the button should not lurch every time it moves. */
.betlab{font-size:10.5px;letter-spacing:.13em;font-weight:700;opacity:.72}
.betamt{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:14px;font-weight:700}
/* WHILE AUTO HAS THE BOARD THE BAR IS A CLOCK. Just the number — no label, no
   unit — bigger, and each new one fades in as it lands rather than the digit
   silently swapping. `.tick` is removed and re-added with a reflow between,
   because a CSS animation restarts on nothing less. */
#btnPlay.counting .betamt{font-size:19px;letter-spacing:.02em}
.betamt.tick{animation:tickin 320ms cubic-bezier(.2,.8,.3,1)}
@keyframes tickin{
  0%{opacity:0;transform:scale(1.35)}
  60%{opacity:1}
  100%{opacity:1;transform:scale(1)}}
/* THE AUTO BUTTON IS GONE. It never needed to be a control: auto arms itself
   after five idle seconds, and requestPlay() turns it off the moment you
   press BET — so the button's only real job was telling you it was coming.

   A LINE THAT BREATHES INSTEAD. White, because a third purple object under a
   purple button on a purple-framed board is one too many; held at a low
   opacity so it never competes with the stake; and pulsed slowly enough to
   read as waiting rather than as blinking. The purple is in the bloom behind
   the letters rather than in them. */
.autonote{position:fixed;left:50%;transform:translateX(-50%);bottom:11px;z-index:12;
  text-align:center;font-family:var(--mono);font-size:11px;
  letter-spacing:.14em;color:#fff;white-space:nowrap;
  pointer-events:none;user-select:none;
  text-shadow:0 0 12px rgba(124,58,237,.55);
  opacity:0;transition:opacity 420ms ease}
.autonote.show{animation:autobreath 3.6s ease-in-out infinite}
@keyframes autobreath{
  0%{opacity:.16} 50%{opacity:.46} 100%{opacity:.16}}
/* THE PULSE STOPS ONCE THE BOARD IS RUNNING. A countdown breathes because it
   is waiting for something; with auto on, nothing is pending, and a line that
   kept pulsing would be saying so about nothing. */
.autonote.on{animation:none;opacity:.34}
/* TABULAR, so a countdown ticking 20s -> 9s does not shuffle the line's own
   width underneath it once a second. */
.autonote b{font-variant-numeric:tabular-nums;font-weight:400}
.mutebtn{min-width:30px}
.corner{position:fixed;right:10px;bottom:10px;z-index:970;display:flex;gap:5px}
/* THE RATE, OUT OF THE WAY. It was under the balance in 13px green bold and
   dominated the one number the card is for. It is still worth having while
   tuning — the whole point of the timeline tool is that pacing is hard to
   see — so it goes to the opposite corner at a size that does not compete.
   Add `if (!DEV) return;` at the top of paintReadout() to hide it in play. */
/* BOTTOM LEFT, which the balance has just vacated. Top right would now sit
   directly above the balance heading the rail. */
.cornerL{position:fixed;left:var(--edge);bottom:11px;z-index:970;
  font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.02em;pointer-events:none;white-space:nowrap}
body.bw .cornerL{opacity:0;transition:opacity 900ms ease}
/* IT DIMS FOR THE TAKEOVER BUT DOES NOT LEAVE. Everything else stands down to
   opacity 0 — but 42 seconds of score with no reachable off switch is exactly
   the case the mute button exists for, and a control that is invisible and
   still clickable is worse than one you can see. So it goes quiet instead of
   away, and comes back under the cursor. */
body.bw .corner{opacity:.22;transition:opacity 900ms ease}
body.bw .corner:hover{opacity:1}
.hint{font-size:11.5px;color:var(--faint);padding:6px 0 0;text-align:center;min-height:18px}
.saved{font-size:10.5px;color:var(--faint);text-align:center;padding:6px 0 2px}

/* ────────────────────────────────────────────────────── developer ──────
   RED, AND NOT SUBTLE. Nothing in here is part of the game, and a panel
   that can hand itself a billion dollars should never be mistaken for one
   that cannot. */
#devCard{border-color:#5a2a26}
#devCard .cardhead{border-bottom-color:#5a2a26}
#devCard h2{color:var(--danger)}
.devrow{display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px;align-items:center;
  padding:6px 0;border-bottom:1px solid #241a19}
.devrow:last-child{border-bottom:0}
.devlab{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--danger)}
.devbtns{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.devbtns input,.devbtns select{font:inherit;font-family:var(--mono);font-size:12px;
  background:var(--bg-deep);border:1px solid var(--border);color:var(--cream);
  padding:3px 7px;border-radius:0;min-width:0}
.devbtns input{width:112px}
.devbtns button{font-size:11px;padding:2px 8px;border-radius:0;font:inherit;cursor:pointer;
  border:1px solid #5a2a26;background:#241a19;color:#e8a49a}
.devbtns button:hover{background:#31211f;color:#fff}
.devbtns button.on{background:var(--danger);border-color:var(--danger);color:#1a0c0a;font-weight:700}
/* the ball buttons wear their tier, so the row reads as the ladder it is */
.devbtns button.bq{font-family:var(--mono)}
.devbtns button.bq.bearing{border-color:#5a6068;color:#c9d2dc}
.devbtns button.bq.marble{border-color:#7a5a2a;color:#ffc978}
.devbtns button.bq.gem{border-color:#6b4a9e;color:#c9a4ef}
.devout{font-family:var(--mono);font-size:11px;color:var(--muted);padding-top:4px;
  white-space:pre-wrap;line-height:1.45}
.devrate{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:pre-wrap;
  line-height:1.5}
.devrate b{color:var(--cream);font-weight:700}
.devhint{font-size:10.5px;color:var(--faint);text-align:center;padding-top:8px}
</style>
</head>
<body>

<!-- THE HEADER IS GONE — the brand, the two site links and the strip they sat
     in. What it cost was the mute button, which lived there, and muting is not
     optional: auto-play pings on every hit and the takeover carries a
     42-second score. It is in the Upgrades head now, beside Erase save.

     THAT PLACE IS DELIBERATE. The obvious home is the play row, next to Auto —
     but `body.bw` fades the board card's furniture out for the whole takeover,
     so the one control you might actually reach for while 42 seconds of music
     plays would be the one that disappears. The right column fades too, but
     only its OPACITY: it is still there and still clickable. -->
