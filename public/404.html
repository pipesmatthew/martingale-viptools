<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found &middot; VIP Tools</title>
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<style>
/* The 404. It exists so unknown paths get a 404 STATUS rather than the
   homepage with a 200, which is what a scanner reads and what got the domain
   flagged. The look is the house palette; the job is the status code. */
:root{color-scheme:dark;--bg:#131316;--fg:#f0f0f2;--accent:#ffb454;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:14px;line-height:1.6;min-height:100vh;display:grid;place-items:center;
  padding:32px 16px;text-align:center}
h1{font-size:22px;font-weight:700;margin:0 0 8px;letter-spacing:-.01em}
p{margin:0 0 18px;max-width:46ch}
a{color:var(--accent);font-weight:700;text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>That page isn't here</h1>
  <p>Nothing is published at this address.</p>
  <a href="https://martingale.viptools.gg/">Martingale &#8201;&rarr;</a>
</main>
</body>
</html>
